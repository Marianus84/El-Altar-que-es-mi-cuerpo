<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>El Camino del Héroe</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #0b0f19;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
        }

        h1, h2, h3, .hero-font {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
        }

        button,
        input,
        select {
            font-family: 'Inter', sans-serif;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            max-width: 480px;
            min-height: 100vh;
            margin: auto;
            background: #0b0f19;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .gold-accent { color: #fbbf24; }
        .bg-gold { background: #fbbf24; color: #0b0f19; }
        .border-gold { border-color: #fbbf24; }

        .progress-track {
            background: #1e293b;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        .progress-gold {
            background: linear-gradient(90deg, #d97706, #fbbf24);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
        }

        .progress-red {
            background: linear-gradient(90deg, #991b1b, #ef4444);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }
        
        .progress-blue {
            background: linear-gradient(90deg, #1d4ed8, #3b82f6);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .card {
            background: #151e2e;
            border-radius: 16px;
            border: 1px solid #2a3a52;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255,255,255,0.05);
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, .75);
            backdrop-filter: blur(5px);
        }

        .safe-bottom { padding-bottom: calc(115px + env(safe-area-inset-bottom)); }
        .nav-bottom { padding-bottom: env(safe-area-inset-bottom); }

        input:focus,
        select:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 2px rgba(251, 191, 36, .2);
        }

        .day-row { transition: transform .15s ease, opacity .2s ease; }
        .day-row:active { transform: scale(.99); }

        .past-day {
            opacity: .70;
            background: #0f1623;
            box-shadow: none !important;
            padding: 12px 16px !important;
            border: 1px dashed #2a3a52;
        }

        .today-day {
            box-shadow:
                0 0 0 1px rgba(251, 191, 36, .5),
                0 4px 20px rgba(251, 191, 36, .15);
            border: 1px solid #fbbf24;
        }

        .water-circle {
            position: relative;
            overflow: hidden;
            border-radius: 50%;
            background: #0f1623;
            box-shadow:
                inset 0 0 20px #000,
                0 0 0 4px #1e293b,
                0 0 15px rgba(251, 191, 36, 0.2);
            transform: perspective(300px);
            will-change: transform;
        }

        .water-fill {
            position: absolute;
            left: -15%;
            width: 130%;
            bottom: 0;
            background: linear-gradient(180deg, #fbbf24, #b45309);
            transition: height .7s cubic-bezier(.22, .61, .36, 1), transform 0.1s ease-out;
            will-change: transform, height;
            box-shadow: inset 0 5px 15px rgba(255,255,255,0.3);
        }
        
        .water-fill.damage {
            background: linear-gradient(180deg, #ef4444, #7f1d1d);
        }

        .water-wave {
            position: absolute;
            left: -20%;
            width: 140%;
            height: 32px;
            top: -15px;
            border-radius: 50%;
            background: rgba(255,255,255,.15);
            animation: waveMove 3.2s linear infinite;
        }

        .water-wave-2 {
            position: absolute;
            left: -20%;
            width: 140%;
            height: 28px;
            top: -11px;
            border-radius: 50%;
            background: rgba(0,0,0,.15);
            animation: waveMoveReverse 4.5s linear infinite;
        }

        .water-shimmer {
            position: absolute;
            left: -50%;
            width: 200%;
            height: 70%;
            top: 15%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.20),
                transparent
            );
            transform: rotate(-15deg);
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes waveMove { from { transform: translateX(0); } to { transform: translateX(-12%); } }
        @keyframes waveMoveReverse { from { transform: translateX(-8%); } to { transform: translateX(8%); } }
        @keyframes shimmer { 0% { transform: translateX(-30%) rotate(-15deg); } 50% { transform: translateX(30%) rotate(-15deg); } 100% { transform: translateX(-30%) rotate(-15deg); } }

        .water-content {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .water-number { font-size: 28px; font-family: 'Cinzel', serif; font-weight: 800; line-height: 1.1; color: white; }
        .water-max { font-size: 14px; color: #cbd5e1; margin-top: 3px; font-weight: bold; }
        .water-label { font-size: 12px; color: #fbbf24; margin-top: 6px; letter-spacing: 1px; font-weight: bold; text-transform: uppercase;}

        .chart-grid-line { border-top: 1px dashed #334155; }
        .chart-scroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
        .chart-scroll::-webkit-scrollbar { display: none; }
        .chart-inner { min-width: 100%; }

        .chart-label { font-size: 10px; color: #94a3b8; margin-top: 8px; white-space: nowrap; font-family: 'Cinzel'; font-weight: bold;}
        .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 5px currentColor; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f1623; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .bg-surface { background-color: #1e293b; }
        .text-muted { color: #94a3b8; }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

const DEFAULT_SETTINGS = {
    caloriesWeekly: 16590,
    proteinWeekly: 1190,
    stepsWeekly: 70000,
    name: "Campaña del Héroe",
    initialWeight: 80,
    targetWeight: 75,
    strictWindowsEnabled: false,
    breakfastStart: "07:00",
    breakfastEnd: "11:00",
    lunchStart: "12:30",
    lunchEnd: "16:00",
    dinnerStart: "19:30",
    dinnerEnd: "22:30"
};

const DAYS = [
    "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"
];

const MEAL_TYPES = [
    "Desayuno", "Almuerzo", "Cena"
];

const MEAL_LABELS = {
    "Desayuno": "🌅 Alba (Desayuno)",
    "Almuerzo": "☀️ Cenit (Almuerzo)",
    "Cena": "🌙 Ocaso (Cena)"
};

function getMonday(date = new Date()) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
}

function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

function formatDate(date) {
    return date.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function formatWeekDate(date) {
    return date.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit" });
}

function getWeekDates(referenceDate = new Date()) {
    const monday = getMonday(referenceDate);
    const dates = [];
    for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        dates.push(d);
    }
    return dates;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function loadJSON(key, fallback) {
    try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
    } catch {
        return fallback;
    }
}

function isPastDate(key) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const date = new Date(key + "T00:00:00");
    return date < today;
}

function formatShortDate(key) {
    const date = new Date(key + "T00:00:00");
    return date.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit" });
}

function timeStringToMinutes(timeStr) {
    if (!timeStr) return 0;
    const [h, m] = timeStr.split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
}

function isCurrentTimeInRange(startStr, endStr) {
    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const startMinutes = timeStringToMinutes(startStr);
    const endMinutes = timeStringToMinutes(endStr);
    return currentMinutes >= startMinutes && currentMinutes <= endMinutes;
}

function CustomDialog({ config, onClose }) {
    if (!config.show) return null;

    return (
        <div className="fixed inset-0 z-[100] modal-backdrop flex items-center justify-center p-4">
            <div className="bg-surface border-2 border-slate-700 rounded-3xl p-6 w-full max-w-[320px] shadow-[0_0_30px_rgba(0,0,0,0.8)] animate-[fadeIn_0.2s_ease-out]">
                {config.title && (
                    <h3 className="text-xl font-extrabold mb-2 text-white hero-font text-gold-accent">{config.title}</h3>
                )}
                <p className="text-slate-300 text-sm mb-6 leading-relaxed">
                    {config.message}
                </p>
                
                <div className="flex gap-3 justify-end">
                    {!config.isAlert && (
                        <button 
                            onClick={onClose}
                            className="px-5 py-2.5 rounded-xl text-slate-300 font-semibold bg-slate-700 hover:bg-slate-600 border border-slate-600 transition-colors"
                        >
                            Retirada
                        </button>
                    )}
                    <button 
                        onClick={() => {
                            if (config.onConfirm) config.onConfirm();
                            onClose();
                        }}
                        className="px-5 py-2.5 rounded-xl text-slate-900 font-bold bg-gold hover:bg-amber-400 transition-colors shadow-sm shadow-amber-500/20"
                    >
                        {config.isAlert ? 'Comprendido' : 'Proceder'}
                    </button>
                </div>
            </div>
        </div>
    );
}

function ProgressCircle({ value, max, size, label }) {
    const [tilt, setTilt] = useState({ x: 0, y: 0 });

    useEffect(() => {
        function handleOrientation(e) {
            if (e.beta !== null && e.gamma !== null) {
                const x = clamp(e.gamma / 3, -15, 15);
                const y = clamp(e.beta / 3, -15, 15);
                setTilt({ x, y });
            }
        }
        window.addEventListener('deviceorientation', handleOrientation);
        return () => window.removeEventListener('deviceorientation', handleOrientation);
    }, []);

    const percent = max > 0 ? clamp(value / max, 0, 1) : 0;
    const percentage = percent * 100;
    const isDamage = value > max;

    return (
        <div
            className="water-circle flex-shrink-0"
            style={{ width: size, height: size }}
        >
            <div
                className={`water-fill ${isDamage ? 'damage' : ''}`}
                style={{
                    height: `${percentage}%`,
                    transform: `translate(${tilt.x}px, ${tilt.y}px)`
                }}
            >
                <div className="water-wave"></div>
                <div className="water-wave-2"></div>
                <div className="water-shimmer"></div>
            </div>

            <div className="water-content">
                <div className="water-number">
                    {Math.round(value).toLocaleString("es-ES")}
                </div>
                <div className="water-max">
                    / {Math.round(max).toLocaleString("es-ES")}
                </div>
                <div className="water-label">
                    {label}
                </div>
            </div>
        </div>
    );
}

function MiniProgress({ value, max, label, suffix, color }) {
    const percent = max > 0 ? clamp((value / max) * 100, 0, 100) : 0;

    return (
        <div>
            <div className="flex justify-between text-xs mb-2">
                <span className="text-slate-400">{label}</span>
                <span className="font-semibold text-white">
                    {Math.round(value).toLocaleString("es-ES")} / {Math.round(max).toLocaleString("es-ES")} {suffix}
                </span>
            </div>
            <div className="h-2 rounded-full progress-track overflow-hidden">
                <div
                    className="h-full rounded-full transition-all duration-500"
                    style={{ width: `${percent}%`, background: color || '#fbbf24' }}
                />
            </div>
        </div>
    );
}

function App() {
    const [activeTab, setActiveTab] = useState("home");
    
    const [dialogConfig, setDialogConfig] = useState({
        show: false, title: "", message: "", isAlert: true, onConfirm: null
    });

    const showAlert = (title, message) => {
        setDialogConfig({ show: true, title, message, isAlert: true, onConfirm: null });
    };

    const showConfirm = (title, message, onConfirm) => {
        setDialogConfig({ show: true, title, message, isAlert: false, onConfirm });
    };

    const closeDialog = () => setDialogConfig(prev => ({ ...prev, show: false }));

    const [settings, setSettings] = useState(() => loadJSON("nutrition_settings", DEFAULT_SETTINGS));
    
    const [entries, setEntries] = useState(() => {
        const raw = loadJSON("nutrition_entries", []);
        const cleanMap = new Map();
        raw.forEach(e => {
            if (e && e.date && e.name && e.calories !== undefined) {
                const uniqueKey = e.id ? String(e.id) : `${e.date}_${e.name}_${Math.random()}`;
                cleanMap.set(uniqueKey, {
                    id: e.id || Date.now() + Math.random(),
                    date: String(e.date),
                    name: String(e.name),
                    calories: Number(e.calories) || 0,
                    protein: Number(e.protein) || 0,
                    mealType: String(e.mealType || "Desayuno")
                });
            }
        });
        return Array.from(cleanMap.values());
    });
    const [savedFoods, setSavedFoods] = useState(() => loadJSON("nutrition_saved_foods", []));
    const [stepsData, setStepsData] = useState(() => loadJSON("nutrition_steps", {}));
    const [weightEntries, setWeightEntries] = useState(() => loadJSON("nutrition_weight", []));
    
    const [showAdd, setShowAdd] = useState(false);
    const [selectedDate, setSelectedDate] = useState(dateKey(new Date()));
    const [selectedMealType, setSelectedMealType] = useState("Desayuno");
    const [editingEntry, setEditingEntry] = useState(null);
    const [editingFood, setEditingFood] = useState(null);

    const [currentWeekReference, setCurrentWeekReference] = useState(new Date());

    useEffect(() => { localStorage.setItem("nutrition_settings", JSON.stringify(settings)); }, [settings]);
    useEffect(() => { localStorage.setItem("nutrition_entries", JSON.stringify(entries)); }, [entries]);
    useEffect(() => { localStorage.setItem("nutrition_saved_foods", JSON.stringify(savedFoods)); }, [savedFoods]);
    useEffect(() => { localStorage.setItem("nutrition_steps", JSON.stringify(stepsData)); }, [stepsData]);
    useEffect(() => { localStorage.setItem("nutrition_weight", JSON.stringify(weightEntries)); }, [weightEntries]);

    const weekDates = getWeekDates(currentWeekReference);
    const weekKeys = weekDates.map(dateKey);
    const todayKey = dateKey(new Date());

    function getDayEntries(key) {
        return entries.filter(e => e.date === key);
    }

    function getDayCalories(key) {
        return getDayEntries(key).reduce((sum, e) => sum + Number(e.calories || 0), 0);
    }

    function getDayProtein(key) {
        return getDayEntries(key).reduce((sum, e) => sum + Number(e.protein || 0), 0);
    }

    function getDaySteps(key) {
        return Number(stepsData[key] || 0);
    }

    function setDaySteps(key, val) {
        setStepsData(prev => ({ ...prev, [key]: Math.max(0, Number(val) || 0) }));
    }

    const weeklyCaloriesConsumed = weekKeys.reduce((sum, key) => sum + getDayCalories(key), 0);
    const weeklyProteinConsumed = weekKeys.reduce((sum, key) => sum + getDayProtein(key), 0);
    const weeklyStepsConsumed = weekKeys.reduce((sum, key) => sum + getDaySteps(key), 0);

    const weeklyCaloriesRemaining = Math.max(0, Number(settings.caloriesWeekly || 0) - weeklyCaloriesConsumed);

    function getDynamicDailyBudget(index, totalWeeklyTarget, getConsumedFn) {
        let remainingBudget = Number(totalWeeklyTarget || 0);
        for (let i = 0; i < index; i++) {
            remainingBudget -= getConsumedFn(weekKeys[i]);
        }
        const remainingDays = 7 - index;
        if (remainingDays <= 0) return 0;
        return Math.max(0, remainingBudget / remainingDays);
    }

    const todayIndex = weekKeys.indexOf(todayKey);
    
    const todayBudget = todayIndex >= 0 ? getDynamicDailyBudget(todayIndex, settings.caloriesWeekly, getDayCalories) : Number(settings.caloriesWeekly || 0) / 7;
    const todayCalories = getDayCalories(todayKey);
    const todayRemaining = Math.max(0, todayBudget - todayCalories);

    const todayProteinBudget = todayIndex >= 0 ? getDynamicDailyBudget(todayIndex, settings.proteinWeekly, getDayProtein) : Number(settings.proteinWeekly || 0) / 7;
    const todayProtein = getDayProtein(todayKey);

    const todayStepsBudget = todayIndex >= 0 ? getDynamicDailyBudget(todayIndex, settings.stepsWeekly, getDaySteps) : Number(settings.stepsWeekly || 0) / 7;
    const todaySteps = getDaySteps(todayKey);

    function saveEntry(data) {
        if (settings.strictWindowsEnabled && selectedDate === todayKey && !editingEntry) {
            let start = settings.breakfastStart;
            let end = settings.breakfastEnd;
            if (data.mealType === "Almuerzo") { start = settings.lunchStart; end = settings.lunchEnd; }
            if (data.mealType === "Cena") { start = settings.dinnerStart; end = settings.dinnerEnd; }

            if (!isCurrentTimeInRange(start, end)) {
                showConfirm(
                    "Maldición de Tiempo",
                    `Estás intentando forjar una provisión fuera del ciclo sagrado (${start} - ${end}). ¿Deseas romper el pacto y registrarlo igualmente?`,
                    () => proceedSaveEntry(data)
                );
                return;
            }
        }

        proceedSaveEntry(data);
    }

    function proceedSaveEntry(data) {
        if (editingEntry) {
            setEntries(prev => prev.map(e => e.id === editingEntry.id ? {
                ...e,
                name: data.name.trim(),
                calories: Number(data.calories),
                protein: Number(data.protein),
                mealType: data.mealType
            } : e));
        } else {
            setEntries(prev => [
                ...prev,
                {
                    id: Date.now() + Math.random(),
                    date: selectedDate,
                    name: data.name.trim(),
                    calories: Number(data.calories),
                    protein: Number(data.protein),
                    mealType: data.mealType
                }
            ]);
        }

        const nameLower = data.name.trim().toLowerCase();
        const existsInLibrary = savedFoods.some(f => f.name.toLowerCase() === nameLower);
        
        if (!existsInLibrary) {
            setSavedFoods(prev => [...prev, {
                id: Date.now() + Math.random(),
                name: data.name.trim(),
                calories: Number(data.calories),
                protein: Number(data.protein || 0)
            }]);
        }

        setShowAdd(false);
        setEditingEntry(null);
    }

    function deleteEntry(id) {
        setEntries(prev => prev.filter(entry => entry.id !== id));
    }

    function deleteSavedFood(id) {
        setSavedFoods(prev => prev.filter(food => food.id !== id));
    }

    function updateSavedFood(updatedFood) {
        setSavedFoods(prev => prev.map(f => f.id === updatedFood.id ? updatedFood : f));
        setEditingFood(null);
    }

    function resetAll() {
        showConfirm(
            "Destruir Pergaminos", 
            "¿Seguro que quieres quemar todos tus registros y empezar de cero? Esta acción no se puede deshacer.",
            () => {
                setEntries([]);
                setStepsData({});
                localStorage.removeItem("nutrition_entries");
                localStorage.removeItem("nutrition_steps");
                showAlert("Victoria", "Tus antiguas gestas han sido borradas de la historia.");
            }
        );
    }

    function saveBackup() {
        const backup = {
            app: "El Camino del Heroe",
            version: 14,
            exportedAt: new Date().toISOString(),
            settings: settings,
            entries: entries,
            savedFoods: savedFoods,
            steps: stepsData,
            weight: weightEntries
        };

        const json = JSON.stringify(backup, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        const today = new Date().toISOString().slice(0, 10);
        link.download = `cronicas-heroe-${today}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function loadBackup(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const backup = JSON.parse(e.target.result);
                if (!backup || !backup.settings || !Array.isArray(backup.entries)) {
                    throw new Error("Formato inválido");
                }

                showConfirm(
                    "Restaurar Crónicas",
                    "Leer este pergamino antiguo reemplazará tus recuerdos actuales. ¿Continuar?",
                    () => {
                        const importedSettings = {
                            ...DEFAULT_SETTINGS,
                            ...backup.settings,
                            caloriesWeekly: Number(backup.settings.caloriesWeekly) || 16590,
                            proteinWeekly: Number(backup.settings.proteinWeekly) || 1190,
                            stepsWeekly: Number(backup.settings.stepsWeekly) || 70000
                        };

                        const importedEntries = backup.entries
                            .filter(entry => entry && entry.date && entry.name)
                            .map(entry => ({
                                id: entry.id || Date.now() + Math.random(),
                                date: String(entry.date),
                                name: String(entry.name),
                                calories: Number(entry.calories) || 0,
                                protein: Number(entry.protein) || 0,
                                mealType: String(entry.mealType || "Desayuno")
                            }));
                        
                        const importedSavedFoods = Array.isArray(backup.savedFoods) ? backup.savedFoods : [];
                        const importedSteps = backup.steps && typeof backup.steps === 'object' ? backup.steps : {};
                        const importedWeight = Array.isArray(backup.weight) ? backup.weight : [];

                        setSettings(importedSettings);
                        setEntries(importedEntries);
                        setSavedFoods(importedSavedFoods);
                        setStepsData(importedSteps);
                        setWeightEntries(importedWeight);

                        showAlert("Magia Completada", " Las crónicas han sido restauradas.");
                    }
                );
            } catch {
                showAlert("Magia Fallida", "El pergamino está corrupto (Formato no válido).");
            }
            event.target.value = "";

                <div className="max-w-[480px] mx-auto h-[82px] flex items-center justify-around px-2">
                    <NavButton
                        active={activeTab === "home"}
                        icon="🏕️"
                        label="Campamento"

                    />
                    <NavButton
                        active={activeTab === "history"}
                        icon="📜"
                        label="Crónicas"

                    />
                    <NavButton
                        active={activeTab === "foods"}
                        icon="🎒"
                        label="Botica"

                    />
                    <NavButton

                    />

            {showAdd && (
                <AddModal
                    date={selectedDate}
                    initialMealType={selectedMealType}

                />

            {editingFood && (
                <EditFoodModal
                    food={editingFood}
                    onClose={() => setEditingFood(null)}

            )}

}

function Home({

function AddModal({ date, initialMealType, onClose, onSave, savedFoods, showAlert, initialData, settings }) {
    const [name, setName] = useState(initialData ? initialData.name : "");
    const [calories, setCalories] = useState(initialData ? initialData.calories.toString() : "");
    const [protein, setProtein] = useState(initialData ? initialData.protein.toString() : "");
    const [mealType, setMealType] = useState(initialData ? initialData.mealType : initialMealType);
    const [showSuggestions, setShowSuggestions] = useState(false);

    const filteredFoods = name.trim() === "" 
        ? [] 
        : savedFoods.filter(f => f.name.toLowerCase().includes(name.toLowerCase()));

    const exactMatch = filteredFoods.length === 1 && filteredFoods[0].name.toLowerCase() === name.toLowerCase();
    const displaySuggestions = showSuggestions && filteredFoods.length > 0 && !exactMatch;

    function submit(e) {
        e.preventDefault();

        if (!name.trim()) {
            showAlert("Rúnica Incompleta", "El nombre de la provisión no puede estar vacío.");
            return;
        }

        if (calories === "" || Number(calories) < 0) {
            showAlert("Magia Inestable", "La energía vital (calorías) debe ser válida.");
            return;
        }

        onSave({
            name: name.trim(),
            calories: Number(calories),
            protein: Number(protein || 0),
            mealType: mealType
        });
    }

    function selectFood(food) {
        setName(food.name);
        setCalories(food.calories.toString());
        setProtein(food.protein.toString());
        setShowSuggestions(false);
    }

    return (
        <div className="fixed inset-0 z-[60] modal-backdrop flex items-end justify-center animate-[fadeIn_0.2s_ease-out]">
            <div className="bg-surface border-t border-x border-slate-700 w-full max-w-[480px] rounded-t-[32px] p-6 shadow-[0_-10px_40px_rgba(0,0,0,0.8)] relative flex flex-col max-h-[90vh]">

                    <button onClick={onClose} className="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>

                <form onSubmit={submit} className="flex flex-col gap-5 overflow-y-auto custom-scrollbar pb-4">
                    <div>
                        <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Momento del Día</label>

                    <div className="relative">

                        />
                        
                        {displaySuggestions && (
                            <div className="absolute top-full left-0 right-0 mt-2 bg-slate-800 border border-slate-700 shadow-[0_10px_25px_rgba(0,0,0,0.5)] rounded-xl z-50 max-h-56 overflow-y-auto custom-scrollbar overflow-hidden">
                                <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-4 py-2 bg-slate-900/80 border-b border-slate-700">Conocimiento Previo</div>

                                    <div

                                        onClick={() => selectFood(f)}

                                        <div className="font-bold text-sm text-white">{f.name}</div>

                                    className="w-full border border-slate-700 bg-slate-900 rounded-xl pl-4 pr-12 py-3 text-lg font-black text-blue-400 focus:border-blue-500 outline-none transition-colors"
                                />
                                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-500">g</span>
                            </div>
                        </div>
                    </div>

                    <button
                        type="submit"

function History({ entries, settings, stepsData, weightEntries, setWeightEntries, getDayCalories, getDayProtein, getDaySteps, getDynamicDailyBudget, onSelectDay, showAlert, showConfirm }) {
    const [period, setPeriod] = useState("week");
    const [historyTab, setHistoryTab] = useState("nutrition");
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    function getHistoryDates() {
        const dates = [];
        if (period === "week") {
            const monday = getMonday(today);
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                dates.push(d);
            }
        } else if (period === "month") {
            const start = new Date(today.getFullYear(), today.getMonth(), 1);
            const end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) dates.push(new Date(d));
        } else {
            if (entries.length === 0) return [];
            const sorted = [...entries].sort((a, b) => a.date.localeCompare(b.date));
            const start = new Date(sorted[0].date + "T00:00:00");
            for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) dates.push(new Date(d));
        }
        return dates;
    }

    const dates = getHistoryDates();
    const chartData = dates.map((date, index) => {
        const key = dateKey(date);
        const calories = getDayCalories(key);
        const budget = period === "week" ? getDynamicDailyBudget(index, settings.caloriesWeekly, getDayCalories) : Number(settings.caloriesWeekly || 0) / 7;
        return { date, key, calories, budget };
    });

    const totalCalories = chartData.reduce((sum, item) => sum + item.calories, 0);
    const totalProtein = chartData.reduce((sum, item) => sum + getDayProtein(item.key), 0);
    const totalSteps = chartData.reduce((sum, item) => sum + getDaySteps(item.key), 0);
    const daysWithData = chartData.filter(item => item.calories > 0 || getDaySteps(item.key) > 0).length;
    const averageCalories = daysWithData > 0 ? totalCalories / daysWithData : 0;
    
    const dailyBaseline = Number(settings.caloriesWeekly || 0) / 7;
    const maxChartValue = Math.max(...chartData.map(item => Math.max(item.calories, item.budget)), dailyBaseline, 1) * 1.15; 
    
    function periodTitle() {
        if (period === "week") return "Cruzada Actual";
        if (period === "month") return today.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
        return "Toda la Leyenda";
    }

    return (
        <main className="safe-bottom p-5 animate-[fadeIn_0.2s_ease-out]">
            <header className="mb-5 mt-2">
                <div className="text-xs font-bold tracking-widest text-gold-accent uppercase">Registros Antiguos</div>
                <h1 className="text-3xl font-extrabold text-white hero-font mt-1">Tus Hazañas</h1>
            </header>

            <div className="flex gap-2 mb-6 p-1 bg-slate-900 rounded-2xl border border-slate-700">
                <button onClick={() => setHistoryTab("nutrition")} className={`flex-1 py-3 rounded-xl font-bold text-xs uppercase tracking-widest transition-all ${historyTab === "nutrition" ? "bg-slate-700 text-white shadow-md border border-slate-600" : "text-slate-500 hover:text-slate-300"}`}>Supervivencia</button>
                <button onClick={() => setHistoryTab("weight")} className={`flex-1 py-3 rounded-xl font-bold text-xs uppercase tracking-widest transition-all ${historyTab === "weight" ? "bg-slate-700 text-white shadow-md border border-slate-600" : "text-slate-500 hover:text-slate-300"}`}>Evolución Física</button>
            </div>

            {historyTab === "nutrition" ? (
                <>
                    <div className="flex gap-1 mb-6">
                        {[["week", "Semanal"], ["month", "Mensual"], ["all", "Total"]].map(([value, label]) => (
                            <button
                                key={value}
                                onClick={() => setPeriod(value)}
                                className={`flex-1 py-2.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all border ${period === value ? "bg-gold text-slate-900 border-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.2)]" : "bg-transparent text-slate-500 border-slate-700 hover:text-slate-300 hover:bg-slate-800"}`}
                            >
                                {label}
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-2 gap-3 mb-4">
                        <div className="card p-4 text-center">
                            <div className="text-[10px] font-bold text-amber-500/70 uppercase tracking-widest">Energía Total</div>
                            <div className="text-2xl font-black mt-1 text-amber-400 hero-font">{Math.round(totalCalories).toLocaleString("es-ES")}</div>
                            <div className="text-[10px] font-medium text-slate-500 mt-1 uppercase tracking-wider">
                                {daysWithData > 0 ? `~${Math.round(averageCalories).toLocaleString("es-ES")} E/día` : "Sin batallas"}
                            </div>
                        </div>
                        <div className="card p-4 text-center">
                            <div className="text-[10px] font-bold text-blue-500/70 uppercase tracking-widest">Fuerza Generada</div>
                            <div className="text-2xl font-black mt-1 text-blue-400 hero-font">{Math.round(totalProtein).toLocaleString("es-ES")}</div>
                            <div className="text-[10px] font-medium text-slate-500 mt-1 uppercase tracking-wider">
                                {daysWithData > 0 ? `~${Math.round(totalProtein / daysWithData)} F/día` : "Sin batallas"}
                            </div>
                        </div>
                    </div>

                    <div className="card p-4 mb-6 flex items-center justify-between">
                        <div>
                            <div className="text-[10px] font-bold text-emerald-500/70 uppercase tracking-widest">Ruta Total</div>
                            <div className="text-xl font-black mt-1 text-emerald-400 hero-font">{totalSteps.toLocaleString("es-ES")} <span className="text-xs text-slate-500 font-sans">Pasos</span></div>
                        </div>
                        <div className="text-right">
                            <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Media por Jornada</div>
                            <div className="text-xl font-black mt-1 text-white hero-font">{daysWithData > 0 ? Math.round(totalSteps / daysWithData).toLocaleString("es-ES") : 0}</div>
                        </div>
                    </div>

                    <section className="card p-5 mb-5 border-t-2 border-t-slate-600">
                        <div className="mb-4">
                            <h2 className="font-bold text-lg text-white capitalize hero-font">{periodTitle()}</h2>
                            <p className="text-[10px] font-bold text-slate-500 mt-1 uppercase tracking-widest">Energía Consumida vs Límite del Reino</p>
                        </div>

                        <div className="flex items-center gap-4 mb-6 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <div className="flex items-center gap-1.5"><span className="legend-dot" style={{ background: '#fbbf24', color: '#fbbf24' }}></span>Consumo</div>
                            <div className="flex items-center gap-1.5"><span className="legend-dot" style={{ background: '#ef4444', color: '#ef4444' }}></span>Límite Mortal</div>
                        </div>

                        {chartData.length === 0 ? (
                            <div className="py-12 text-center text-slate-600 text-xs font-bold uppercase tracking-widest">No hay pergaminos escritos aún.</div>
                        ) : (
                            <div className="chart-scroll pb-2">
                                <div className="chart-inner" style={{ minWidth: period === "month" ? "760px" : period === "all" ? `${Math.max(chartData.length * 48, 100)}px` : "100%" }}>
                                    <div className="relative h-[220px] w-full mt-6">
                                        {[0, 25, 50, 75, 100].map(percentage => (
                                            <div key={percentage} className="absolute left-0 right-0 border-t border-dashed border-slate-700/50 pointer-events-none" style={{ top: `${100 - percentage}%` }} />
                                        ))}
                                        
                                        <div 
                                            className="absolute left-0 right-0 border-t-[2px] border-dashed border-red-500/80 z-10 pointer-events-none" 
                                            style={{ bottom: `${(dailyBaseline / maxChartValue) * 100}%` }}
                                        >
                                            <div className="absolute -top-[20px] right-0 text-[9px] font-black text-red-400 bg-red-950/80 px-2 py-0.5 rounded border border-red-900 uppercase tracking-widest shadow-[0_0_10px_rgba(239,68,68,0.2)]">
                                                LÍMITE {Math.round(dailyBaseline)}
                                            </div>
                                        </div>

                                        <div className="absolute inset-0 flex items-end justify-between gap-1 px-1">
                                            {chartData.map(item => {
                                                const heightPercent = Math.max((item.calories / maxChartValue) * 100, 0);
                                                const isOverBaseline = item.calories > dailyBaseline;

                                                return (
                                                    <div key={item.key} className="flex-1 flex flex-col justify-end items-center h-full group relative">
                                                        <div className="w-full flex items-end justify-center h-full relative">
                                                            {item.calories > 0 && (
                                                                <div className="absolute -top-6 text-[9px] font-black text-white opacity-0 group-hover:opacity-100 transition-opacity bg-slate-800 px-1.5 py-0.5 rounded shadow-lg border border-slate-600 whitespace-nowrap z-20">
                                                                    {Math.round(item.calories)}
                                                                </div>
                                                            )}
                                                            <div 
                                                                className={`w-full max-w-[32px] rounded-t-sm transition-all duration-300 z-10 ${isOverBaseline ? 'bg-red-600/90 shadow-[0_0_10px_rgba(220,38,38,0.5)]' : 'bg-amber-500/90 shadow-[0_0_10px_rgba(245,158,11,0.3)]'}`} 
                                                                style={{ height: `${item.calories > 0 ? Math.max(heightPercent, 1.5) : 0}%`, borderTop: '2px solid rgba(255,255,255,0.2)' }} 
                                                            />
                                                        </div>
                                                        <div className="absolute -bottom-7 chart-label text-slate-500 text-[9px]">
                                                            {period === "week" ? DAYS[item.date.getDay() === 0 ? 6 : item.date.getDay() - 1].slice(0, 2) : formatShortDate(item.key)}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <div className="h-10"></div>
                                </div>
                            </div>
                        )}
                    </section>
                </>
            ) : (
                <WeightDashboard 
                    weightEntries={weightEntries} 
                    setWeightEntries={setWeightEntries} 
                    settings={settings}
                    showAlert={showAlert}
                    showConfirm={showConfirm}
                />
            )}
        </main>
    );
}

function WeightDashboard({ weightEntries, setWeightEntries, settings, showAlert, showConfirm }) {
    const [newWeight, setNewWeight] = useState("");
    const [newDate, setNewDate] = useState(dateKey(new Date()));

    const sortedEntries = [...weightEntries].sort((a, b) => a.date.localeCompare(b.date));
    const currentWeight = sortedEntries.length > 0 ? sortedEntries[sortedEntries.length - 1].weight : Number(settings.initialWeight);
    const initialWeight = Number(settings.initialWeight);
    const targetWeight = Number(settings.targetWeight);

    const isLosing = initialWeight >= targetWeight;
    let progress = 0;
    let weightDiff = 0;

    if (isLosing) {
        weightDiff = initialWeight - currentWeight;
        const totalToLose = initialWeight - targetWeight;
        progress = totalToLose > 0 ? (weightDiff / totalToLose) * 100 : 0;
    } else {
        weightDiff = currentWeight - initialWeight;
        const totalToGain = targetWeight - initialWeight;
        progress = totalToGain > 0 ? (weightDiff / totalToGain) * 100 : 0;
    }

    progress = Math.max(0, Math.min(100, progress));
    const isGoalReached = progress >= 100;

    const daysElapsed = sortedEntries.length > 1 ? (new Date(sortedEntries[sortedEntries.length - 1].date) - new Date(sortedEntries[0].date)) / (1000 * 60 * 60 * 24) : 0;
    const weeksElapsed = daysElapsed / 7;
    const avgPerWeek = weeksElapsed > 0 ? (weightDiff / weeksElapsed) : 0;

    const minW = Math.min(...sortedEntries.map(e => e.weight), initialWeight, targetWeight) - 2;
    const maxW = Math.max(...sortedEntries.map(e => e.weight), initialWeight, targetWeight) + 2;
    const range = maxW - minW;

    function handleAddWeight(e) {
        e.preventDefault();
        const weightVal = Number(newWeight);
        if (!weightVal || weightVal <= 0) { showAlert("Error", "Carga inválida."); return; }
        const newEntry = { id: Date.now(), date: newDate, weight: weightVal };
        const filtered = weightEntries.filter(e => e.date !== newDate);
        setWeightEntries([...filtered, newEntry]);
        setNewWeight("");
        showAlert("¡Victoria!", "Nuevos atributos registrados.");
    }

    function deleteEntry(id) {
        if (showConfirm) {
            showConfirm("Borrar Registro", "¿Destruir este recuerdo de tu evolución?", () => {
                setWeightEntries(weightEntries.filter(e => e.id !== id));
            });
        }
    }

    return (
        <div className="space-y-5 animate-[fadeIn_0.2s_ease-out]">
            <div className="card p-6 flex flex-col items-center justify-center relative overflow-hidden border-t-2 border-t-amber-500/50">
                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-amber-900/20 to-transparent"></div>
                <div className="text-[10px] font-bold text-amber-500 z-10 mb-2 uppercase tracking-widest">Nivel de Carga Actual</div>
                <div className="text-[44px] font-black text-white z-10 mb-6 leading-none hero-font drop-shadow-[0_0_15px_rgba(251,191,36,0.3)]">{currentWeight.toFixed(1)} <span className="text-xl text-slate-500 font-sans">kg</span></div>
                
                <div className="w-full relative z-10 mt-2">
                    <div className="flex justify-between text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">
                        <span>{initialWeight} kg (Base)</span>
                        <span className={isGoalReached ? "text-amber-400 font-black" : ""}>{targetWeight} kg (Destino)</span>
                    </div>
                    <div className="h-3 bg-slate-800 border border-slate-700 rounded-full overflow-hidden shadow-inner relative">
                        <div className="h-full bg-gradient-to-r from-amber-600 to-amber-400 rounded-full transition-all duration-1000 relative shadow-[0_0_10px_rgba(251,191,36,0.5)]" style={{ width: `${progress}%` }}></div>
                    </div>
                    <div className="text-center text-[10px] font-black text-amber-500 mt-3 uppercase tracking-widest">
                        {progress.toFixed(1)}% Hacia la Trascendencia
                    </div>
                </div>
            </div>

            <div className="grid grid-cols-2 gap-3">
                <div className="card p-4 text-center">
                    <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total {isLosing ? 'Liberado' : 'Asimilado'}</div>
                    <div className="text-2xl font-black mt-1 text-white hero-font">{Math.abs(weightDiff).toFixed(1)} <span className="text-xs text-slate-500 font-sans">kg</span></div>
                </div>
                <div className="card p-4 text-center">
                    <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Media por Ciclo</div>
                    <div className="text-2xl font-black mt-1 text-white hero-font">{Math.abs(avgPerWeek).toFixed(2)} <span className="text-xs text-slate-500 font-sans">kg</span></div>
                </div>
            </div>

            <section className="card p-5">
                <h3 className="font-bold text-white mb-4 hero-font">Ritual de Pesaje</h3>
                <form onSubmit={handleAddWeight} className="flex gap-2">
                    <input type="date" value={newDate} onChange={e => setNewDate(e.target.value)} className="w-[140px] border border-slate-700 rounded-xl px-3 py-2 text-[11px] uppercase tracking-widest font-black text-slate-300 bg-slate-900 outline-none focus:border-amber-500" required />
                    <input type="number" step="0.1" value={newWeight} onChange={e => setNewWeight(e.target.value)} placeholder="Ej. 74.5" className="flex-1 border border-slate-700 rounded-xl px-4 py-2 text-sm font-black text-white bg-slate-900 outline-none focus:border-amber-500" required />
                    <button type="submit" className="bg-gold text-slate-900 px-5 rounded-xl font-black shadow-[0_0_15px_rgba(251,191,36,0.2)] hover:bg-amber-400 active:scale-95 transition-transform text-lg">+</button>
                </form>
            </section>

            <section className="card p-5">
                <div className="flex justify-between items-end mb-4">
                    <h3 className="font-bold text-white hero-font">Mapa de Transformación</h3>
                </div>
                
                {sortedEntries.length === 0 ? (
                    <div className="text-center py-6 text-slate-500 text-xs font-bold uppercase tracking-widest">Comienza tu viaje para revelar el mapa.</div>
                ) : (
                    <div className="relative w-full h-[180px] mt-4 mb-2 pl-6">
                        <div className="absolute left-0 top-0 bottom-0 w-6 flex flex-col justify-between text-[9px] font-bold text-slate-500 text-right pr-2 font-sans">
                            <span>{Math.round(maxW)}</span>
                            <span>{Math.round(maxW - (range/2))}</span>
                            <span>{Math.round(minW)}</span>
                        </div>
                        
                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full overflow-visible">
                            <line x1="0" y1="0" x2="100" y2="0" stroke="#1e293b" strokeWidth="1" />
                            <line x1="0" y1="50" x2="100" y2="50" stroke="#1e293b" strokeWidth="1" />
                            <line x1="0" y1="100" x2="100" y2="100" stroke="#1e293b" strokeWidth="1" />

                            <line 
                                x1="0" y1={Math.max(0, Math.min(100, 100 - ((targetWeight - minW) / range) * 100))} 
                                x2="100" y2={Math.max(0, Math.min(100, 100 - ((targetWeight - minW) / range) * 100))} 
                                stroke="#10b981" strokeWidth="1.5" strokeDasharray="4 4" 
                            />

                            <polyline 
                                points={sortedEntries.map((e, i) => `${sortedEntries.length === 1 ? 50 : (i / (sortedEntries.length - 1)) * 100},${100 - ((e.weight - minW) / range) * 100}`).join(" ")}
                                fill="none" stroke="#fbbf24" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                            />
                            
                            {sortedEntries.map((e, i) => (
                                <circle 
                                    key={e.id}
                                    cx={sortedEntries.length === 1 ? 50 : (i / (sortedEntries.length - 1)) * 100}
                                    cy={100 - ((e.weight - minW) / range) * 100}
                                    r="4" fill="#0b0f19" stroke="#fbbf24" strokeWidth="2"
                                />
                            ))}
                        </svg>
                        <div className="absolute right-0 text-[8px] font-black text-emerald-400 bg-emerald-950/80 border border-emerald-900 px-1.5 py-0.5 rounded shadow-lg z-10 uppercase tracking-widest" style={{ top: `calc(${Math.max(0, Math.min(100, 100 - ((targetWeight - minW) / range) * 100))}% - 8px)` }}>
                            DESTINO
                        </div>
                    </div>
                )}
            </section>

            <section className="card p-5">
                <h3 className="font-bold text-white mb-4 hero-font">Bitácora de Carga</h3>
                <div className="space-y-2">
                    {sortedEntries.slice().reverse().map((entry, idx, arr) => {
                        const prevEntry = arr[idx + 1];
                        const diff = prevEntry ? entry.weight - prevEntry.weight : 0;
                        return (
                            <div key={entry.id} className="flex justify-between items-center p-4 bg-slate-800/50 hover:bg-slate-800 transition-colors rounded-xl border border-slate-700/50">
                                <div>
                                    <div className="font-black text-white text-lg hero-font">{entry.weight} <span className="text-xs text-slate-500 font-sans font-medium">kg</span></div>
                                    <div className="text-[10px] font-bold text-slate-500 mt-1 uppercase tracking-widest">{formatShortDate(entry.date)}</div>
                                </div>
                                <div className="flex items-center gap-4">
                                    {diff !== 0 && (
                                        <div className={`text-[10px] font-black px-2 py-1 rounded border uppercase tracking-wider ${diff > 0 ? 'bg-red-900/30 text-red-400 border-red-800' : 'bg-emerald-900/30 text-emerald-400 border-emerald-800'}`}>
                                            {diff > 0 ? '+' : ''}{diff.toFixed(1)}
                                        </div>
                                    )}
                                    <button onClick={() => deleteEntry(entry.id)} className="w-8 h-8 rounded-lg bg-slate-700 border border-slate-600 text-slate-400 hover:text-red-400 hover:bg-red-900/30 hover:border-red-800 flex items-center justify-center font-bold text-lg leading-none transition-colors">×</button>
                                </div>
                            </div>
                        );
                    })}
                    {sortedEntries.length === 0 && <div className="text-center py-4 text-[10px] font-bold uppercase tracking-widest text-slate-500">Sin bitácora</div>}
                </div>
            </section>
        </div>
    );
}

function Settings({ settings, setSettings, resetAll, saveBackup, loadBackup, showAlert }) {
    const [local, setLocal] = useState(settings);

    useEffect(() => setLocal(settings), [settings]);

    function save() {
        const calories = Number(local.caloriesWeekly);
        const protein = Number(local.proteinWeekly);
        const steps = Number(local.stepsWeekly);
        const iWeight = Number(local.initialWeight);
        const tWeight = Number(local.targetWeight);

        if (!Number.isFinite(calories) || calories <= 0) return showAlert("Error", "La Energía Vital debe ser válida.");
        if (!Number.isFinite(protein) || protein < 0) return showAlert("Error", "La Fuerza debe ser válida.");
        if (!Number.isFinite(steps) || steps < 0) return showAlert("Error", "La Misión de Exploración debe ser válida.");
        if (!Number.isFinite(iWeight) || iWeight <= 0 || !Number.isFinite(tWeight) || tWeight <= 0) return showAlert("Error", "Las Cargas Base y Destino deben ser válidas.");
        
        setSettings({ ...local, caloriesWeekly: calories, proteinWeekly: protein, stepsWeekly: steps, initialWeight: iWeight, targetWeight: tWeight });
        showAlert("Pacto Sellado", "Tus nuevos juramentos han sido grabados en piedra.");
    }

    return (
        <main className="safe-bottom p-5">
            <header className="mb-6 mt-2">
                <div className="text-xs font-bold tracking-widest text-gold-accent uppercase">Reglas del Reino</div>
                <h1 className="text-3xl font-extrabold text-white hero-font mt-1">Tus Pactos</h1>
            </header>

            <section className="card p-5 mb-5">
                <h2 className="font-bold text-lg mb-5 text-white hero-font border-b border-slate-700 pb-3">Misiones de Ciclo (Semanales)</h2>
                
                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Energía Vital (Kcal / Semana)</label>
                <div className="relative mb-5">
                    <input 
                        type="number" inputMode="numeric" value={local.caloriesWeekly} onChange={e => setLocal({ ...local, caloriesWeekly: e.target.value })} 
                        className="w-full border border-slate-700 bg-slate-900 focus:border-amber-500 rounded-xl pl-4 pr-12 py-3 text-lg font-black text-amber-400 outline-none transition-colors" 
                    />
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-500">kcal</span>
                </div>

                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Atributo Fuerza (Prot / Semana)</label>
                <div className="relative mb-5">
                    <input 
                        type="number" inputMode="numeric" value={local.proteinWeekly} onChange={e => setLocal({ ...local, proteinWeekly: e.target.value })} 
                        className="w-full border border-slate-700 bg-slate-900 focus:border-blue-500 rounded-xl pl-4 pr-10 py-3 text-lg font-black text-blue-400 outline-none transition-colors" 
                    />
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-500">g</span>
                </div>

                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Exploración (Pasos / Semana)</label>
                <div className="relative mb-6">
                    <input 
                        type="number" inputMode="numeric" value={local.stepsWeekly} onChange={e => setLocal({ ...local, stepsWeekly: e.target.value })} 
                        className="w-full border border-slate-700 bg-slate-900 focus:border-emerald-500 rounded-xl pl-4 pr-16 py-3 text-lg font-black text-emerald-400 outline-none transition-colors" 
                    />
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] font-bold uppercase tracking-widest text-slate-500">Pasos</span>
                </div>

                <h2 className="font-bold text-lg mb-5 text-white hero-font border-b border-slate-700 pb-3 mt-8">Carga Física (Evolución)</h2>
                <div className="grid grid-cols-2 gap-4 mb-2">
                    <div>
                        <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Carga Base</label>
                        <div className="relative">
                            <input type="number" step="0.1" inputMode="decimal" value={local.initialWeight} onChange={e => setLocal({ ...local, initialWeight: e.target.value })} className="w-full border border-slate-700 bg-slate-900 focus:border-amber-500 rounded-xl pl-4 pr-10 py-3 text-lg font-black text-white outline-none" />
                            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-500">kg</span>
                        </div>
                    </div>
                    <div>
                        <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Carga Destino</label>
                        <div className="relative">
                            <input type="number" step="0.1" inputMode="decimal" value={local.targetWeight} onChange={e => setLocal({ ...local, targetWeight: e.target.value })} className="w-full border border-slate-700 bg-slate-900 focus:border-amber-500 rounded-xl pl-4 pr-10 py-3 text-lg font-black text-emerald-400 outline-none" />
                            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-500">kg</span>
                        </div>
                    </div>
                </div>
            </section>

            <section className="card p-5 mb-5">
                <div className="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                    <div>
                        <h2 className="font-bold text-lg text-white hero-font">Ritual del Tiempo</h2>
                        <p className="text-[9px] text-slate-400 font-bold uppercase tracking-widest mt-1">Limita tu forja a horas sagradas</p>
                    </div>
                    <input
                        type="checkbox"
                        checked={local.strictWindowsEnabled}
                        onChange={e => setLocal({ ...local, strictWindowsEnabled: e.target.checked })}
                        className="w-5 h-5 accent-amber-500 cursor-pointer"
                    />
                </div>

                {local.strictWindowsEnabled && (
                    <div className="space-y-4 mt-4">
                        <div className="grid grid-cols-2 gap-3 items-center">
                            <span className="text-[10px] font-black uppercase tracking-widest text-amber-500">Alba</span>
                            <div className="flex gap-2 items-center">
                                <input type="time" value={local.breakfastStart} onChange={e => setLocal({ ...local, breakfastStart: e.target.value })} className="border border-slate-700 bg-slate-900 text-white rounded-lg p-2 text-xs w-full focus:border-amber-500 outline-none" />
                                <span className="text-slate-500 font-bold">-</span>
                                <input type="time" value={local.breakfastEnd} onChange={e => setLocal({ ...local, breakfastEnd: e.target.value })} className="border border-slate-700 bg-slate-900 text-white rounded-lg p-2 text-xs w-full focus:border-amber-500 outline-none" />
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3 items-center">
                            <span className="text-[10px] font-black uppercase tracking-widest text-amber-500">Cenit</span>
                            <div className="flex gap-2 items-center">
                                <input type="time" value={local.lunchStart} onChange={e => setLocal({ ...local, lunchStart: e.target.value })} className="border border-slate-700 bg-slate-900 text-white rounded-lg p-2 text-xs w-full focus:border-amber-500 outline-none" />
                                <span className="text-slate-500 font-bold">-</span>
                                <input type="time" value={local.lunchEnd} onChange={e => setLocal({ ...local, lunchEnd: e.target.value })} className="border border-slate-700 bg-slate-900 text-white rounded-lg p-2 text-xs w-full focus:border-amber-500 outline-none" />
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3 items-center">
                            <span className="text-[10px] font-black uppercase tracking-widest text-amber-500">Ocaso</span>
                            <div className="flex gap-2 items-center">
                                <input type="time" value={local.dinnerStart} onChange={e => setLocal({ ...local, dinnerStart: e.target.value })} className="border border-slate-700 bg-slate-900 text-white rounded-lg p-2 text-xs w-full focus:border-amber-500 outline-none" />
                                <span className="text-slate-500 font-bold">-</span>
                                <input type="time" value={local.dinnerEnd} onChange={e => setLocal({ ...local, dinnerEnd: e.target.value })} className="border border-slate-700 bg-slate-900 text-white rounded-lg p-2 text-xs w-full focus:border-amber-500 outline-none" />
                            </div>
                        </div>
                    </div>
                )}
                
                <button 
                    onClick={save} 
                    className="w-full bg-gold text-[#0b0f19] py-4 rounded-xl font-black text-lg mt-6 shadow-[0_0_20px_rgba(251,191,36,0.3)] hover:bg-amber-400 active:scale-[0.98] transition-all hero-font tracking-wide"
                >
                    Sellar Pactos
                </button>
            </section>

            <section className="card p-5 mb-5 border-t-2 border-t-red-900/50">
                <h2 className="font-bold text-lg mb-4 text-red-500 hero-font">Magia Prohibida</h2>
                <div className="space-y-3">
                    <button onClick={resetAll} className="w-full py-3.5 rounded-xl font-black text-xs uppercase tracking-widest bg-red-950/40 text-red-500 border border-red-900 hover:bg-red-900/60 transition-colors">
                        Quemar todas las Crónicas
                    </button>
                </div>
            </section>

            <section className="card p-5">
                <h2 className="font-bold text-lg mb-4 text-white hero-font">Reliquias de Memoria</h2>
                <div className="space-y-3">
                    <button onClick={saveBackup} className="w-full py-3.5 rounded-xl font-black text-xs uppercase tracking-widest bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition-colors">
                        Inscribir Pergamino (Exportar)
                    </button>
                    <label className="w-full py-3.5 rounded-xl font-black text-xs uppercase tracking-widest bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition-colors flex items-center justify-center cursor-pointer">
                        Leer Pergamino Antiguo (Importar)
                        <input type="file" accept=".json" onChange={loadBackup} className="hidden" />
                    </label>
                </div>
                <p className="text-[10px] text-slate-600 mt-5 text-center font-bold uppercase tracking-widest">Edición de Fantasía (v2.0)</p>
            </section>
        </main>
    );
}

function NavButton({ active, icon, label, onClick }) {
    return (
        <button
            onClick={onClick}
            className={`flex flex-col items-center justify-center gap-1 w-20 transition-all duration-300 ${active ? "text-amber-400 scale-110 drop-shadow-[0_0_8px_rgba(251,191,36,0.5)]" : "text-slate-500 hover:text-slate-300 hover:scale-105"}`}
        >
            <span className="text-2xl leading-none">{icon}</span>
            <span className="text-[9px] font-black tracking-widest uppercase mt-1">{label}</span>
        </button>
    );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

</body>
</html>
