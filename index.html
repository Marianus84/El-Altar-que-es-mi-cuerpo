<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Mi Presupuesto</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #f7faf8;
            color: #14221b;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            max-width: 480px;
            min-height: 100vh;
            margin: auto;
            background: #f7faf8;
        }

        .green {
            color: #20a35a;
        }

        .bg-green {
            background: #20a35a;
        }

        .progress-track {
            background: #e3eae5;
        }

        .progress-green {
            background: #20a35a;
        }

        .progress-red {
            background: #e91e4d;
        }

        .card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .circle {
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: #e4eae6;
        }

        .circle-progress {
            fill: none;
            stroke: #20a35a;
            stroke-linecap: round;
            transition: stroke-dashoffset .4s ease;
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, .42);
            backdrop-filter: blur(3px);
        }

        .safe-bottom {
            padding-bottom: calc(115px + env(safe-area-inset-bottom));
        }

        .nav-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

        input:focus {
            outline: none;
            border-color: #20a35a;
            box-shadow: 0 0 0 3px rgba(32, 163, 90, .12);
        }

        .day-row {
            transition: transform .15s ease, opacity .2s ease;
        }

        .day-row:active {
            transform: scale(.99);
        }

        /*
         * DÍAS PASADOS
         *
         * Se ven ligeramente grises y apagados,
         * pero siguen siendo completamente funcionales.
         */
        .past-day {
            opacity: .62;
            filter: grayscale(12%);
        }

        .past-day .day-date {
            color: #9aa39e;
        }

        .today-day {
            box-shadow:
                0 0 0 2px rgba(32, 163, 90, .16),
                0 2px 8px rgba(0, 0, 0, .08);
        }

        .future-day {
            opacity: 1;
        }

        .backup-button {
            transition: transform .15s ease, background .15s ease;
        }

        .backup-button:active {
            transform: scale(.98);
        }

        .floating-add {
            box-shadow: 0 6px 20px rgba(32, 163, 90, .25);
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const DEFAULT_SETTINGS = {
    caloriesWeekly: 16590,
    proteinDaily: 170,
    name: "Mi plan"
};

const DAYS = [
    "Lunes",
    "Martes",
    "Miércoles",
    "Jueves",
    "Viernes",
    "Sábado",
    "Domingo"
];

/* =========================================================
   UTILIDADES
========================================================= */

function getMonday(date = new Date()) {

    const d = new Date(date);

    d.setHours(0, 0, 0, 0);

    const day = d.getDay();

    const diff =
        day === 0
            ? -6
            : 1 - day;

    d.setDate(d.getDate() + diff);

    return d;
}


function dateKey(date) {

    const y = date.getFullYear();

    const m = String(
        date.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        date.getDate()
    ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function formatDate(date) {

    return date.toLocaleDateString(
        "es-ES",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


function formatWeekDate(date) {

    return date.toLocaleDateString(
        "es-ES",
        {
            day: "2-digit",
            month: "2-digit"
        }
    );
}


function getWeekDates() {

    const monday = getMonday();

    const dates = [];

    for (let i = 0; i < 7; i++) {

        const d = new Date(monday);

        d.setDate(
            monday.getDate() + i
        );

        dates.push(d);
    }

    return dates;
}


function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


function loadJSON(key, fallback) {

    try {

        const value =
            localStorage.getItem(key);

        return value
            ? JSON.parse(value)
            : fallback;

    } catch {

        return fallback;
    }
}


/*
 * Devuelve true si una fecha pertenece
 * a un día anterior a hoy.
 */
function isPastDate(key) {

    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );

    const date =
        new Date(
            key + "T00:00:00"
        );

    return date < today;
}


/* =========================================================
   APP
========================================================= */

function App() {

    const [activeTab, setActiveTab] =
        useState("home");

    const [settings, setSettings] =
        useState(() =>
            loadJSON(
                "nutrition_settings",
                DEFAULT_SETTINGS
            )
        );

    const [entries, setEntries] =
        useState(() =>
            loadJSON(
                "nutrition_entries",
                []
            )
        );

    const [showAdd, setShowAdd] =
        useState(false);

    const [selectedDate, setSelectedDate] =
        useState(
            dateKey(new Date())
        );


    /* -----------------------------------------------------
       GUARDAR AUTOMÁTICAMENTE
    ----------------------------------------------------- */

    useEffect(() => {

        localStorage.setItem(
            "nutrition_settings",
            JSON.stringify(settings)
        );

    }, [settings]);


    useEffect(() => {

        localStorage.setItem(
            "nutrition_entries",
            JSON.stringify(entries)
        );

    }, [entries]);


    /* -----------------------------------------------------
       FECHAS
    ----------------------------------------------------- */

    const weekDates =
        getWeekDates();

    const weekKeys =
        weekDates.map(dateKey);

    const todayKey =
        dateKey(new Date());


    /* -----------------------------------------------------
       ENTRADAS
    ----------------------------------------------------- */

    function getDayEntries(key) {

        return entries.filter(
            e => e.date === key
        );
    }


    function getDayCalories(key) {

        return getDayEntries(key)
            .reduce(
                (sum, e) =>
                    sum +
                    Number(e.calories || 0),
                0
            );
    }


    function getDayProtein(key) {

        return getDayEntries(key)
            .reduce(
                (sum, e) =>
                    sum +
                    Number(e.protein || 0),
                0
            );
    }


    /* =====================================================
       DATOS SEMANALES
    ===================================================== */

    const weeklyCaloriesConsumed =
        weekKeys.reduce(
            (sum, key) =>
                sum +
                getDayCalories(key),
            0
        );


    const weeklyProteinConsumed =
        weekKeys.reduce(
            (sum, key) =>
                sum +
                getDayProtein(key),
            0
        );


    const weeklyProteinTarget =
        Number(settings.proteinDaily) * 7;


    const weeklyCaloriesRemaining =
        Math.max(
            0,
            Number(settings.caloriesWeekly) -
            weeklyCaloriesConsumed
        );


    /* =====================================================
       PRESUPUESTO DINÁMICO
       
       El presupuesto de cada día depende
       de TODO lo consumido en los días anteriores.

       Ejemplo:

       16.590 semanal

       Lunes consume 2.600

       Quedan:
       16.590 - 2.600 = 13.990

       Martes recibe:
       13.990 / 6 = 2.331,67

       Si martes consume 2.000:

       Quedan:
       11.990

       Miércoles recibe:
       11.990 / 5 = 2.398
    ===================================================== */

    function getDynamicDailyBudget(index) {

        let remainingBudget =
            Number(settings.caloriesWeekly);

        /*
         * Restamos únicamente los días
         * anteriores al día consultado.
         */
        for (let i = 0; i < index; i++) {

            remainingBudget -=
                getDayCalories(
                    weekKeys[i]
                );
        }

        const remainingDays =
            7 - index;

        if (remainingDays <= 0) {
            return 0;
        }

        return Math.max(
            0,
            remainingBudget /
            remainingDays
        );
    }


    /* -----------------------------------------------------
       HOY
    ----------------------------------------------------- */

    const todayIndex =
        weekKeys.indexOf(todayKey);


    const todayBudget =
        todayIndex >= 0
            ? getDynamicDailyBudget(
                todayIndex
            )
            : Number(
                settings.caloriesWeekly
            ) / 7;


    const todayCalories =
        getDayCalories(
            todayKey
        );


    const todayProtein =
        getDayProtein(
            todayKey
        );


    const todayRemaining =
        Math.max(
            0,
            todayBudget -
            todayCalories
        );


    /* =====================================================
       AÑADIR REGISTRO
    ===================================================== */

    function addEntry(data) {

        const newEntry = {

            id:
                Date.now() +
                Math.random(),

            date:
                selectedDate,

            name:
                data.name,

            calories:
                Number(data.calories),

            protein:
                Number(data.protein)
        };


        setEntries(prev => [
            ...prev,
            newEntry
        ]);


        setShowAdd(false);
    }


    /* =====================================================
       ELIMINAR
    ===================================================== */

    function deleteEntry(id) {

        setEntries(prev =>
            prev.filter(
                entry =>
                    entry.id !== id
            )
        );
    }


    /* =====================================================
       BORRAR TODOS LOS REGISTROS
    ===================================================== */

    function resetAll() {

        const confirmed =
            confirm(
                "¿Seguro que quieres borrar todos los registros? Esta acción no se puede deshacer."
            );

        if (!confirmed) {
            return;
        }

        setEntries([]);

        localStorage.removeItem(
            "nutrition_entries"
        );
    }


    /* =====================================================
       BACKUP — GUARDAR
    ===================================================== */

    function saveBackup() {

        const backup = {

            app:
                "Mi Presupuesto",

            version:
                1,

            exportedAt:
                new Date().toISOString(),

            settings:
                settings,

            entries:
                entries
        };


        const json =
            JSON.stringify(
                backup,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href = url;


        const today =
            new Date()
                .toISOString()
                .slice(0, 10);


        link.download =
            `backup-calorias-${today}.json`;


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        URL.revokeObjectURL(
            url
        );
    }


    /* =====================================================
       BACKUP — CARGAR
    ===================================================== */

    function loadBackup(event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                try {

                    const backup =
                        JSON.parse(
                            e.target.result
                        );


                    /*
                     * Validación básica
                     */
                    if (
                        !backup ||
                        !backup.settings ||
                        !Array.isArray(
                            backup.entries
                        )
                    ) {

                        throw new Error(
                            "Formato inválido"
                        );
                    }


                    const confirmed =
                        confirm(
                            "Cargar este backup reemplazará los datos actuales. ¿Quieres continuar?"
                        );


                    if (!confirmed) {

                        event.target.value =
                            "";

                        return;
                    }


                    const importedSettings = {

                        ...DEFAULT_SETTINGS,

                        ...backup.settings,

                        caloriesWeekly:
                            Number(
                                backup.settings
                                    .caloriesWeekly
                            ) || 0,

                        proteinDaily:
                            Number(
                                backup.settings
                                    .proteinDaily
                            ) || 0
                    };


                    const importedEntries =
                        backup.entries
                            .filter(
                                entry =>
                                    entry &&
                                    entry.date &&
                                    entry.name
                            )
                            .map(
                                entry => ({

                                    id:
                                        entry.id ||
                                        Date.now() +
                                        Math.random(),

                                    date:
                                        String(
                                            entry.date
                                        ),

                                    name:
                                        String(
                                            entry.name
                                        ),

                                    calories:
                                        Number(
                                            entry.calories
                                        ) || 0,

                                    protein:
                                        Number(
                                            entry.protein
                                        ) || 0
                                })
                            );


                    setSettings(
                        importedSettings
                    );

                    setEntries(
                        importedEntries
                    );


                    alert(
                        "Backup cargado correctamente."
                    );

                } catch (error) {

                    alert(
                        "No se pudo cargar el backup. El archivo no tiene un formato válido."
                    );
                }


                event.target.value =
                    "";
            };


        reader.readAsText(file);
    }


    /* =====================================================
       RENDER
    ===================================================== */

    return (

        <div className="app">

            {activeTab === "home" && (

                <Home

                    settings={
                        settings
                    }

                    weekDates={
                        weekDates
                    }

                    weekKeys={
                        weekKeys
                    }

                    todayKey={
                        todayKey
                    }

                    todayBudget={
                        todayBudget
                    }

                    todayCalories={
                        todayCalories
                    }

                    todayProtein={
                        todayProtein
                    }

                    todayRemaining={
                        todayRemaining
                    }

                    weeklyCaloriesConsumed={
                        weeklyCaloriesConsumed
                    }

                    weeklyCaloriesRemaining={
                        weeklyCaloriesRemaining
                    }

                    weeklyProteinConsumed={
                        weeklyProteinConsumed
                    }

                    weeklyProteinTarget={
                        weeklyProteinTarget
                    }

                    getDayCalories={
                        getDayCalories
                    }

                    getDayProtein={
                        getDayProtein
                    }

                    getDynamicDailyBudget={
                        getDynamicDailyBudget
                    }

                    onAdd={() => {

                        setSelectedDate(
                            todayKey
                        );

                        setShowAdd(
                            true
                        );
                    }}

                    onSelectDay={
                        key => {

                            setSelectedDate(
                                key
                            );

                            setShowAdd(
                                true
                            );
                        }
                    }

                    entries={
                        entries
                    }

                    onDelete={
                        deleteEntry
                    }
                />
            )}


            {activeTab === "history" && (

                <History

                    weekDates={
                        weekDates
                    }

                    weekKeys={
                        weekKeys
                    }

                    todayKey={
                        todayKey
                    }

                    entries={
                        entries
                    }

                    getDayCalories={
                        getDayCalories
                    }

                    getDayProtein={
                        getDayProtein
                    }

                    getDynamicDailyBudget={
                        getDynamicDailyBudget
                    }

                    settings={
                        settings
                    }

                    onSelectDay={
                        key => {

                            setSelectedDate(
                                key
                            );

                            setShowAdd(
                                true
                            );
                        }
                    }
                />
            )}


            {activeTab === "settings" && (

                <Settings

                    settings={
                        settings
                    }

                    setSettings={
                        setSettings
                    }

                    resetAll={
                        resetAll
                    }

                    saveBackup={
                        saveBackup
                    }

                    loadBackup={
                        loadBackup
                    }
                />
            )}


            {/* =================================================
               NAVEGACIÓN
            ================================================= */}

            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 nav-bottom z-30">

                <div className="max-w-[480px] mx-auto h-[82px] flex items-center justify-around">

                    <NavButton
                        active={
                            activeTab === "home"
                        }
                        icon="⌂"
                        label="Inicio"
                        onClick={() =>
                            setActiveTab(
                                "home"
                            )
                        }
                    />


                    <NavButton
                        active={
                            activeTab === "history"
                        }
                        icon="▦"
                        label="Historial"
                        onClick={() =>
                            setActiveTab(
                                "history"
                            )
                        }
                    />


                    <NavButton
                        active={
                            activeTab === "settings"
                        }
                        icon="⚙"
                        label="Ajustes"
                        onClick={() =>
                            setActiveTab(
                                "settings"
                            )
                        }
                    />

                </div>

            </div>


            {/* =================================================
               MODAL AÑADIR
            ================================================= */}

            {showAdd && (

                <AddModal

                    date={
                        selectedDate
                    }

                    onClose={() =>
                        setShowAdd(
                            false
                        )
                    }

                    onSave={
                        addEntry
                    }
                />
            )}

        </div>
    );
}


/* =========================================================
   HOME
========================================================= */

function Home({

    settings,
    weekDates,
    weekKeys,
    todayKey,
    todayBudget,
    todayCalories,
    todayProtein,
    todayRemaining,
    weeklyCaloriesConsumed,
    weeklyCaloriesRemaining,
    weeklyProteinConsumed,
    weeklyProteinTarget,
    getDayCalories,
    getDayProtein,
    getDynamicDailyBudget,
    onAdd,
    onSelectDay,
    entries,
    onDelete

}) {

    return (

        <main className="safe-bottom p-5">

            {/* =================================================
               HEADER
            ================================================= */}

            <header className="flex justify-between items-center mb-5">

                <div>

                    <div className="text-sm text-gray-500">
                        ESTA SEMANA
                    </div>

                    <h1 className="text-[28px] font-extrabold">

                        {formatWeekDate(
                            weekDates[0]
                        )}

                        {" – "}

                        {formatWeekDate(
                            weekDates[6]
                        )}

                    </h1>

                </div>


                <div className="w-12 h-12 rounded-2xl bg-white shadow-sm flex items-center justify-center text-2xl text-gray-500">

                    ⋁

                </div>

            </header>


            {/* =================================================
               RESUMEN SEMANAL
            ================================================= */}

            <section className="card p-6 mb-5">

                <div className="flex items-center gap-5">

                    <ProgressCircle

                        value={
                            weeklyCaloriesConsumed
                        }

                        max={
                            settings.caloriesWeekly
                        }

                        size={175}

                        stroke={14}

                        label="Calorías"
                    />


                    <div className="flex-1 space-y-5">

                        <MiniProgress

                            value={
                                weeklyProteinConsumed
                            }

                            max={
                                weeklyProteinTarget
                            }

                            label="Proteína"

                            suffix="g"
                        />


                        <div>

                            <div className="flex justify-between text-xs mb-2">

                                <span className="text-gray-500">
                                    Restantes
                                </span>

                                <span className="font-semibold">

                                    {Math.round(
                                        weeklyCaloriesRemaining
                                    ).toLocaleString(
                                        "es-ES"
                                    )}

                                    {" kcal"}

                                </span>

                            </div>


                            <div className="text-sm text-gray-500">

                                de{" "}

                                {Number(
                                    settings.caloriesWeekly
                                ).toLocaleString(
                                    "es-ES"
                                )}

                                {" kcal"}

                            </div>

                        </div>

                    </div>

                </div>

            </section>


            {/* =================================================
               PRESUPUESTO DE HOY
            ================================================= */}

            <section className="card p-5 mb-5">

                <div className="flex justify-between items-start">

                    <div>

                        <div className="text-sm text-gray-500">
                            PRESUPUESTO DE HOY
                        </div>


                        <div className="text-3xl font-extrabold mt-1">

                            {Math.round(
                                todayBudget
                            ).toLocaleString(
                                "es-ES"
                            )}

                            <span className="text-base font-medium text-gray-400">

                                {" kcal"}

                            </span>

                        </div>


                        <div className="text-sm text-gray-500 mt-1">

                            {Math.round(
                                todayCalories
                            ).toLocaleString(
                                "es-ES"
                            )}

                            {" consumidas · "}

                            {Math.round(
                                todayRemaining
                            ).toLocaleString(
                                "es-ES"
                            )}

                            {" restantes"}

                        </div>

                    </div>


                    <button

                        onClick={
                            onAdd
                        }

                        className="bg-green text-white w-12 h-12 rounded-2xl text-2xl shadow-sm"

                    >

                        +

                    </button>

                </div>


                {/* CALORÍAS */}

                <div className="mt-5">

                    <div className="flex justify-between text-xs mb-2">

                        <span>
                            Calorías
                        </span>

                        <span>

                            {Math.round(
                                todayCalories
                            )}

                            {" / "}

                            {Math.round(
                                todayBudget
                            )}

                        </span>

                    </div>


                    <div className="h-2 rounded-full progress-track overflow-hidden">

                        <div

                            className="h-full progress-green rounded-full"

                            style={{
                                width:
                                    `${clamp(
                                        todayCalories /
                                        Math.max(
                                            todayBudget,
                                            1
                                        ) *
                                        100,
                                        0,
                                        100
                                    )}%`
                            }}

                        />

                    </div>

                </div>


                {/* PROTEÍNA */}

                <div className="mt-4">

                    <div className="flex justify-between text-xs mb-2">

                        <span>
                            Proteína
                        </span>

                        <span>

                            {todayProtein}

                            {" / "}

                            {settings.proteinDaily}

                            {" g"}

                        </span>

                    </div>


                    <div className="h-2 rounded-full progress-track overflow-hidden">

                        <div

                            className="h-full progress-red rounded-full"

                            style={{
                                width:
                                    `${clamp(
                                        todayProtein /
                                        Math.max(
                                            settings.proteinDaily,
                                            1
                                        ) *
                                        100,
                                        0,
                                        100
                                    )}%`
                            }}

                        />

                    </div>

                </div>

            </section>


            {/* =================================================
               LISTA SEMANAL
            ================================================= */}

            <div className="flex items-center justify-between mb-3">

                <h2 className="text-xl font-bold">
                    Esta semana
                </h2>


                <span className="text-sm text-gray-500">

                    {weeklyCaloriesConsumed.toLocaleString(
                        "es-ES"
                    )}

                    {" / "}

                    {Number(
                        settings.caloriesWeekly
                    ).toLocaleString(
                        "es-ES"
                    )}

                </span>

            </div>


            <div className="space-y-3">

                {weekDates.map(
                    (date, index) => {

                        const key =
                            weekKeys[index];


                        const calories =
                            getDayCalories(
                                key
                            );


                        const protein =
                            getDayProtein(
                                key
                            );


                        const budget =
                            getDynamicDailyBudget(
                                index
                            );


                        const isToday =
                            key === todayKey;


                        const isPast =
                            isPastDate(
                                key
                            );


                        const dayEntries =
                            entries.filter(
                                e =>
                                    e.date === key
                            );


                        return (

                            <div

                                key={key}

                                className={`
                                    card
                                    p-4
                                    day-row

                                    ${isToday

                                            {formatDate(

                                        </div>

                                    </div>


                                    <div className="text-right">

                                        <div className="font-bold">

                                            {Math.round(
                                                calories
                                            ).toLocaleString(
                                                "es-ES"
                                            )}

                                            {" / "}

                                            {Math.round(

                                            ).toLocaleString(
                                                "es-ES"

                                        <div className="text-xs text-gray-500">

                                    <span>

                                        {protein}

                                        {settings.proteinDaily}

                                    </span>


                                    <span>

                                        {dayEntries.length}

                                        {" "}

                                    <div className="mt-4 space-y-2">

                                        {dayEntries.map(
                                            entry => (

                                                <div

                                                    key={

                                                    <div>

                                                        <div className="font-medium text-sm">

                                                            {entry.name}

                                                        </div>


                                                        <div className="text-xs text-gray-500 mt-1">

                                                            P{" "}
                                                            {entry.protein}
                                                            {" g"}

                                                        </div>

                                                    </div>


                                                    <div className="flex items-center gap-3">

                                                        <span className="font-semibold text-sm">

                                                            {entry.calories}
                                                            {" kcal"}

                                                        </span>


                                                        <button

                                                            onClick={() =>
                                                                onDelete(
                                                                    entry.id
                                                                )
                                                            }

                                                            className="text-gray-400 hover:text-red-500 text-xl"

                                                        >

                                                            ×

                                                        </button>

                                                    </div>

                                                </div>

                                            )
                                        )}

                                    </div>

                                )}

                            </div>

                        );
                    }
                )}

            </div>


            {/* =================================================
               BOTÓN AÑADIR
            ================================================= */}

            <button

                onClick={
                    onAdd
                }

                className="fixed bottom-[105px] left-1/2 -translate-x-1/2 max-w-[430px] w-[calc(100%-40px)] bg-green text-white py-4 rounded-2xl font-bold floating-add z-20"

            >

                + Añadir calorías

            </button>

        </main>
    );
}


/* =========================================================
   CÍRCULO DE PROGRESO
========================================================= */

function ProgressCircle({

    value,
    max,
    size,
    stroke,
    label

}) {

    const radius =
        (size - stroke) / 2;


    const circumference =
        2 * Math.PI * radius;


    const percent =
        max > 0
            ? clamp(
                value / max,
                0,
                1
            )
            : 0;


    const offset =
        circumference *
        (1 - percent);


    return (

        <div

            className="relative flex-shrink-0"

            style={{
                width: size,
                height: size
            }}

        >

            <svg

                width={size}
                height={size}
                className="circle"

            >

                <circle

                    className="circle-bg"

                    cx={
                        size / 2
                    }

                    cy={
                        size / 2
                    }

                    r={
                        radius
                    }

                    strokeWidth={
                        stroke
                    }

                />


                <circle

                    className="circle-progress"

                    cx={
                        size / 2
                    }

                    cy={
                        size / 2
                    }

                    r={
                        radius
                    }

                    strokeWidth={
                        stroke
                    }

                    strokeDasharray={
                        circumference
                    }

                    strokeDashoffset={
                        offset
                    }

                />

            </svg>


            <div className="absolute inset-0 flex flex-col items-center justify-center">

                <div className="text-[25px] font-extrabold">

                    {Math.round(
                        value
                    ).toLocaleString(
                        "es-ES"
                    )}

                </div>


                <div className="text-sm text-gray-400">

                    /{" "}

                    {Math.round(
                        max
                    ).toLocaleString(
                        "es-ES"
                    )}

                </div>


                <div className="text-sm text-gray-500 mt-1">

                    {label}

                </div>

            </div>

        </div>
    );
}


/* =========================================================
   MINI PROGRESS
========================================================= */

function MiniProgress({

    value,
    max,
    label,
    suffix

}) {

    const percent =
        max > 0
            ? clamp(
                value /
                max *
                100,
                0,
                100
            )
            : 0;


    return (

        <div>

            <div className="flex justify-between text-xs mb-2">

                <span className="text-gray-500">

                    {label}

                </span>


                <span className="font-semibold">

                    {Math.round(
                        value
                    )}

                    {" / "}

                    {Math.round(
                        max
                    )}

                    {" "}

                    {suffix}

                </span>

            </div>


            <div className="h-2 rounded-full progress-track overflow-hidden">

                <div

                    className="h-full progress-green rounded-full"

                    style={{
                        width:
                            `${percent}%`
                    }}

                />

            </div>

        </div>
    );
}


/* =========================================================
   HISTORIAL
========================================================= */

function History({

    weekDates,
    weekKeys,
    todayKey,
    entries,
    getDayCalories,
    getDayProtein,
    getDynamicDailyBudget,
    settings,
    onSelectDay

}) {

    const totalCalories =
        weekKeys.reduce(
            (sum, key) =>
                sum +
                getDayCalories(
                    key
                ),
            0
        );


    const totalProtein =
        weekKeys.reduce(
            (sum, key) =>
                sum +
                getDayProtein(
                    key
                ),
            0
        );


    return (

        <main className="safe-bottom p-5">

            <header className="mb-6">

                <div className="text-sm text-gray-500">
                    HISTORIAL
                </div>

                <h1 className="text-3xl font-extrabold">
                    Resumen semanal
                </h1>

            </header>


            {/* RESUMEN */}

            <div className="grid grid-cols-2 gap-3 mb-6">

                <div className="card p-5">

                    <div className="text-sm text-gray-500">
                        Calorías
                    </div>


                    <div className="text-2xl font-extrabold mt-1">

                        {totalCalories.toLocaleString(
                            "es-ES"
                        )}

                    </div>


                    <div className="text-xs text-gray-400">

                        de{" "}

                        {Number(
                            settings.caloriesWeekly
                        ).toLocaleString(
                            "es-ES"
                        )}

                    </div>

                </div>


                <div className="card p-5">

                    <div className="text-sm text-gray-500">
                        Proteína
                    </div>


                    <div className="text-2xl font-extrabold mt-1">

                        {totalProtein.toLocaleString(
                            "es-ES"
                        )}

                        {" g"}

                    </div>


                    <div className="text-xs text-gray-400">

                        objetivo{" "}

                        {Number(
                            settings.proteinDaily
                        ) * 7}

                        {" g"}

                    </div>

                </div>

            </div>


            {/* DÍAS */}

            <div className="space-y-3">

                {weekDates.map(
                    (date, index) => {

                        const key =
                            weekKeys[index];


                        const calories =
                            getDayCalories(
                                key
                            );


                        const protein =
                            getDayProtein(
                                key
                            );


                        const budget =
                            getDynamicDailyBudget(
                                index
                            );


                        const dayEntries =
                            entries.filter(
                                e =>
                                    e.date === key
                            );


                        const isToday =
                            key === todayKey;


                        const isPast =
                            isPastDate(
                                key
                            );


                        return (

                            <div

                                key={key}

                                onClick={() =>
                                    onSelectDay(
                                        key
                                    )
                                }

                                className={`
                                    card
                                    p-5
                                    cursor-pointer
                                    day-row

                                    ${isToday
                                        ? "today-day"
                                        : ""}

                                    ${isPast
                                        ? "past-day"
                                        : ""}
                                `}

                            >

                                <div className="flex justify-between">

                                    <div>

                                        <div className="flex items-center gap-2">

                                            <div className="font-bold">

                                                {DAYS[index]}

                                            </div>


                                            {isToday && (

                                                <span className="text-[10px] px-2 py-1 rounded-full bg-green/10 green font-bold">

                                                    HOY

                                                </span>

                                            )}

                                        </div>


                                        <div className="text-xs text-gray-500 mt-1 day-date">

                                            {formatDate(
                                                date
                                            )}

                                        </div>

                                    </div>


                                    <div className="text-right">

                                        <div className="font-bold">

                                            {Math.round(
                                                calories
                                            )}

                                            {" kcal"}

                                        </div>


                                        <div className="text-xs text-gray-500">

                                            presupuesto{" "}

                                            {Math.round(
                                                budget
                                            )}

                                        </div>

                                    </div>

                                </div>


                                <div className="grid grid-cols-2 gap-3 mt-4 text-sm">

                                    <div className="bg-gray-50 rounded-xl p-3">

                                        <div className="text-gray-500 text-xs">
                                            Proteína
                                        </div>

                                        <div className="font-bold mt-1">

                                            {protein}
                                            {" g"}

                                        </div>

                                    </div>


                                    <div className="bg-gray-50 rounded-xl p-3">

                                        <div className="text-gray-500 text-xs">
                                            Registros
                                        </div>

                                        <div className="font-bold mt-1">

                                            {dayEntries.length}

                                        </div>

                                    </div>

                                </div>

                            </div>

                        );

                    }
                )}

            </div>

        </main>
    );
}


/* =========================================================
   AJUSTES
========================================================= */

function Settings({

    settings,
    setSettings,
    resetAll,
    saveBackup,
    loadBackup

}) {

    const [local, setLocal] =
        useState(settings);


    useEffect(() => {

        setLocal(
            settings
        );

    }, [settings]);


    function save() {

        const calories =
            Number(
                local.caloriesWeekly
            );

        const protein =
            Number(
                local.proteinDaily
            );


        if (
            !Number.isFinite(
                calories
            ) ||
            calories <= 0
        ) {

            alert(
                "Introduce un presupuesto semanal válido."
            );

            return;
        }


        if (
            !Number.isFinite(
                protein
            ) ||
            protein < 0
        ) {

            alert(
                "Introduce un objetivo de proteína válido."
            );

            return;
        }


        const newSettings = {

            ...local,

            caloriesWeekly:
                calories,

            proteinDaily:
                protein
        };


        setSettings(
            newSettings
        );


        setLocal(
            newSettings
        );


        alert(
            "Configuración guardada."
        );
    }


    return (

        <main className="safe-bottom p-5">

            <header className="mb-6">

                <h1 className="text-3xl font-extrabold">
                    Mi plan
                </h1>


                <p className="text-gray-500 mt-2">
                    Configura tu presupuesto nutricional
                </p>

            </header>


            {/* =================================================
               OBJETIVOS
            ================================================= */}

            <section className="card p-5 mb-4">

                <h2 className="font-bold text-lg mb-5">
                    Objetivos
                </h2>


                <label className="block text-sm text-gray-500 mb-2">

                    Presupuesto semanal de calorías

                </label>


                <input

                    type="number"

                    inputMode="numeric"

                    value={
                        local.caloriesWeekly
                    }

                    onChange={e =>
                        setLocal({
                            ...local,
                            caloriesWeekly:
                                e.target.value
                        })
                    }

                    className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold mb-5"

                />


                <label className="block text-sm text-gray-500 mb-2">

                    Objetivo diario de proteína

                </label>


                <input

                    type="number"

                    inputMode="numeric"

                    value={
                        local.proteinDaily
                    }

                    onChange={e =>
                        setLocal({
                            ...local,
                            proteinDaily:
                                e.target.value
                        })
                    }

                    className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold"

                />

            </section>


            {/* =================================================
               FUNCIONAMIENTO
            ================================================= */}

            <section className="card p-5 mb-4">

                <h2 className="font-bold text-lg">
                    Cómo funciona
                </h2>


                <p className="text-sm text-gray-500 leading-6 mt-3">

                    Tu presupuesto de calorías es semanal.
                    No tienes un límite diario fijo.

                </p>


                <p className="text-sm text-gray-500 leading-6 mt-2">

                    Cada día, las calorías que quedan de la
                    semana se redistribuyen automáticamente
                    entre los días restantes.

                </p>


                <div className="bg-green/10 rounded-2xl p-4 mt-4 text-sm">

                    <div className="font-bold green mb-2">
                        Ejemplo
                    </div>


                    <div className="text-gray-600 leading-6">

                        Presupuesto semanal:
                        <strong>
                            {" 16.590 kcal"}
                        </strong>

                        <br />

                        Lunes consume:
                        <strong>
                            {" 2.600 kcal"}
                        </strong>

                        <br />

                        Quedan:
                        <strong>
                            {" 13.990 kcal"}
                        </strong>

                        <br />

                        Martes recibe:
                        <strong>
                            {" 2.331 kcal"}
                        </strong>

                        <br /><br />

                        Si el martes consumes menos,
                        el presupuesto de miércoles
                        aumenta automáticamente.

                    </div>

                </div>

            </section>


            {/* =================================================
               BACKUP
            ================================================= */}

            <section className="card p-5 mb-4">

                <h2 className="font-bold text-lg">
                    Backup
                </h2>


                <p className="text-sm text-gray-500 leading-6 mt-2 mb-5">

                    Guarda una copia de tus registros y
                    configuración para poder restaurarlos
                    posteriormente.

                </p>


                <button

                    onClick={
                        saveBackup
                    }

                    className="backup-button w-full bg-green text-white py-4 rounded-2xl font-bold mb-3"

                >

                    ↓ Guardar backup

                </button>


                <label className="backup-button w-full bg-gray-100 text-gray-700 py-4 rounded-2xl font-bold flex items-center justify-center cursor-pointer">

                    ↑ Cargar backup


                    <input

                        type="file"

                        accept=".json,application/json"

                        onChange={
                            loadBackup
                        }

                        className="hidden"

                    />

                </label>

            </section>


            {/* =================================================
               GUARDAR
            ================================================= */}

            <button

                onClick={
                    save
                }

                className="w-full bg-green text-white py-4 rounded-2xl font-bold text-lg mb-4"

            >

                Guardar configuración

            </button>


            {/* =================================================
               BORRAR
            ================================================= */}

            <button

                onClick={
                    resetAll
                }

                className="w-full bg-white text-red-500 border border-red-100 py-4 rounded-2xl font-semibold"

            >

                Borrar registros

            </button>

        </main>
    );
}


/* =========================================================
   MODAL AÑADIR
========================================================= */

function AddModal({

    date,
    onClose,
    onSave

}) {

    const [name, setName] =
        useState("");

    const [calories, setCalories] =
        useState("");

    const [protein, setProtein] =
        useState("");


    function submit(e) {

        e.preventDefault();


        if (!name.trim()) {

            alert(
                "Introduce el nombre del alimento."
            );

            return;
        }


        if (
            calories === "" ||
            Number(calories) < 0
        ) {

            alert(
                "Introduce las calorías."
            );

            return;
        }


        if (
            protein !== "" &&
            Number(protein) < 0
        ) {

            alert(
                "La proteína no puede ser negativa."
            );

            return;
        }


        onSave({

            name:
                name.trim(),

            calories:
                Number(calories),

            protein:
                Number(protein || 0)

        });
    }


    return (

        <div className="fixed inset-0 z-50 modal-backdrop flex items-end justify-center">

            <div className="bg-white w-full max-w-[480px] rounded-t-[30px] p-6">

                {/* HEADER */}

                <div className="flex justify-between items-center mb-6">

                    <div>

                        <div className="text-sm text-gray-500">

                            {formatDate(
                                new Date(
                                    date +
                                    "T00:00:00"
                                )
                            )}

                        </div>


                        <h2 className="text-2xl font-extrabold">

                            Añadir comida

                        </h2>

                    </div>


                    <button

                        onClick={
                            onClose
                        }

                        className="w-10 h-10 rounded-full bg-gray-100 text-xl"

                    >

                        ×

                    </button>

                </div>


                {/* FORM */}

                <form

                    onSubmit={
                        submit
                    }

                    className="space-y-4"

                >

                    <div>

                        <label className="block text-sm text-gray-500 mb-2">

                            Alimento / comida

                        </label>


                        <input

                            autoFocus

                            value={
                                name
                            }

                            onChange={e =>
                                setName(
                                    e.target.value
                                )
                            }

                            placeholder="Ej. Pechuga de pollo"

                            className="w-full border border-gray-200 rounded-2xl px-4 py-4"

                        />

                    </div>


                    <div>

                        <label className="block text-sm text-gray-500 mb-2">

                            Calorías

                        </label>


                        <input

                            type="number"

                            inputMode="decimal"

                            min="0"

                            value={
                                calories
                            }

                            onChange={e =>
                                setCalories(
                                    e.target.value
                                )
                            }

                            placeholder="500"

                            className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold"

                        />

                    </div>


                    <div>

                        <label className="block text-sm text-gray-500 mb-2">

                            Proteína (g)

                        </label>


                        <input

                            type="number"

                            inputMode="decimal"

                            min="0"

                            value={
                                protein
                            }

                            onChange={e =>
                                setProtein(
                                    e.target.value
                                )
                            }

                            placeholder="40"

                            className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold"

                        />

                    </div>


                    <button

                        type="submit"

                        className="w-full bg-green text-white py-4 rounded-2xl font-bold text-lg mt-3"

                    >

                        Añadir

                    </button>

                </form>

            </div>

        </div>
    );
}
