<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Camino del Héroe - Calorías y Macros</title>
    
    <!-- PWA y Metadatos Móviles -->
    <meta name="theme-color" content="#121214">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2965/2965567.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-base: #121214;
            --bg-card: #18181b;
            --bg-card-hover: #202024;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.2);
            --danger: #ef4444;
            --success: #22c55e;
            --font-title: 'Cinzel', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-base); color: var(--text-main); padding-bottom: 90px; max-width: 480px; margin: 0 auto; min-height: 100vh; }

        header { padding: 20px 16px 12px; text-align: center; border-bottom: 1px solid var(--border-color); background: linear-gradient(to bottom, #18181b, #121214); }
        header h1 { font-family: var(--font-title); font-size: 1.4rem; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 2px 10px var(--gold-glow); }
        header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

        .container { padding: 16px; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        
        /* Navegación Inferior Estilo RPG */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: rgba(18, 18, 20, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; gap: 4px; cursor: pointer; transition: all 0.2s; }
        .nav-item.active { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); }
        .nav-item span:first-child { font-size: 1.2rem; }

        /* Botones Épicos */
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-family: var(--font-title); cursor: pointer; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 4px 15px var(--gold-glow); }
        .btn-gold:active { transform: scale(0.98); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); margin-top: 8px; }

        /* Formularios e Inputs */
        input, select { width: 100%; background: #09090b; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; color: var(--text-main); font-size: 0.95rem; margin-top: 6px; outline: none; }
        input:focus, select:focus { border-color: var(--gold); }
        label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; display: block; margin-top: 12px; }

        /* Utilidades */
        .view { display: none; }
        .view.active { display: block; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        
        /* Modal */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 16px; backdrop-filter: blur(5px); }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <header>
        <h1>⚔️ El Camino del Héroe</h1>
        <p>Forja tu físico, registra tu energía y conquista tus metas</p>
    </header>

    <div class="container">
        <!-- VISTA CAMPAMENTO (INICIO) -->
        <div id="view-inicio" class="view active">
            <div class="card" style="text-align: center;">
                <h3 style="font-family: var(--font-title); color: var(--gold); margin-bottom: 8px;">ESTAMINA SEMANAL</h3>
                <div id="resumen-semanal-info" style="font-size: 0.9rem; color: var(--text-muted);">Cargando datos de la quest...</div>
            </div>
            <div id="dia-actual-container"></div>
        </div>

        <!-- VISTA HISTORIAL -->
        <div id="view-historial" class="view">
            <div class="card">
                <h3 style="font-family: var(--font-title); color: var(--gold); margin-bottom: 12px;">📜 Crónicas del Viaje</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted);">Aquí podrás revisar tus registros anteriores y estadísticas globales.</p>
            </div>
        </div>

        <!-- VISTA LIBRERÍA DE ALIMENTOS -->
        <div id="view-alimentos" class="view">
            <div class="card">
                <h3 style="font-family: var(--font-title); color: var(--gold); margin-bottom: 12px;">🎒 Arsenal de Alimentos</h3>
                <button class="btn btn-gold" onclick="openFoodModal()">+ Nuevo Suministro</button>
            </div>
            <div id="lista-alimentos-guardados"></div>
        </div>

        <!-- VISTA AJUSTES -->
        <div id="view-ajustes" class="view">
            <div class="card">
                <h3 style="font-family: var(--font-title); color: var(--gold); margin-bottom: 12px;">🛡️ Pactos y Ajustes</h3>
                <label>Presupuesto Semanal de Calorías (kcal)</label>
                <input type="number" id="cfg-kcal" value="16590">
                
                <label>Objetivo Semanal de Proteína (g)</label>
                <input type="number" id="cfg-prot" value="1190">

                <label>Objetivo Semanal de Pasos</label>
                <input type="number" id="cfg-pasos" value="70000">

                <button class="btn btn-gold" style="margin-top: 16px;" onclick="guardarAjustes()">Guardar Pacto</button>
                <button class="btn btn-outline" id="btn-install" style="display:none;" onclick="instalarApp()">📲 Instalar como App</button>
            </div>
        </div>
    </div>

    <!-- Navegación Inferior -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="cambiarVista('inicio', this)"><span>🏕️</span>Campamento</button>
        <button class="nav-item" onclick="cambiarVista('historial', this)"><span>📜</span>Crónicas</button>
        <button class="nav-item" onclick="cambiarVista('alimentos', this)"><span>🎒</span>Arsenal</button>
        <button class="nav-item" onclick="cambiarVista('ajustes', this)"><span>🛡️</span>Pactos</button>
    </nav>

    <!-- Modal General -->
    <div class="modal" id="modal-app">
        <div class="modal-content" id="modal-body">
            <!-- Contenido dinámico -->
        </div>
    </div>

    <script>
        // Lógica de navegación y PWA básica
        function cambiarVista(vistaId, btnElement) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('view-' + vistaId).classList.add('active');
            btnElement.classList.add('active');
        }

        // Instalación PWA (Prompt)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('btn-install').style.display = 'flex';
        });

        function instalarApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('btn-install').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        function guardarAjustes() {
            localStorage.setItem('heroe_kcal', document.getElementById('cfg-kcal').value);
            localStorage.setItem('heroe_prot', document.getElementById('cfg-prot').value);
            localStorage.setItem('heroe_pasos', document.getElementById('cfg-pasos').value);
            alert('¡Pactos actualizados con éxito, Héroe!');
        }

        function openFoodModal() {
            const modal = document.getElementById('modal-app');
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h3 style="font-family: var(--font-title); color: var(--gold); margin-bottom: 12px;">Nuevo Alimento</h3>
                <label>Nombre</label>
                <input type="text" id="food-name" placeholder="Ej. Pollo, Arroz...">
                <label>Calorías (kcal)</label>
                <input type="number" id="food-kcal" placeholder="0">
                <label>Proteína (g)</label>
                <input type="number" id="food-prot" placeholder="0">
                <button class="btn btn-gold" style="margin-top:16px;" onclick="alert('Alimento registrado en el arsenal')">Guardar Suministro</button>
                <button class="btn btn-outline" onclick="document.getElementById('modal-app').style.display='none'">Cancelar</button>
            `;
            modal.style.display = 'flex';
        }

        // Inicialización rápida de ejemplo
        document.getElementById('resumen-semanal-info').innerText = "Presupuesto Activo: 16.590 kcal | 1.190g Prot";
    </script>
</body>
</html>
