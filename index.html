<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Mi Presupuesto</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #f7faf8;
            color: #14221b;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            max-width: 480px;
            min-height: 100vh;
            margin: auto;
            background: #f7faf8;
        }

        .green {
            color: #20a35a;
        }

        .bg-green {
            background: #20a35a;
        }

        .progress-track {
            background: #e3eae5;
        }

        .progress-green {
            background: #20a35a;
        }

        .progress-red {
            background: #e91e4d;
        }

        .card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, .42);
            backdrop-filter: blur(3px);
        }

        .safe-bottom {
            padding-bottom: calc(115px + env(safe-area-inset-bottom));
        }

        .nav-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #20a35a;
            box-shadow: 0 0 0 3px rgba(32, 163, 90, .12);
        }

        .day-row {
            transition: transform .15s ease, opacity .2s ease;
        }

        .day-row:active {
            transform: scale(.99);
        }

        .past-day {
            opacity: .62;
            filter: grayscale(12%);
        }

        .past-day .day-date {
            color: #9aa39e;
        }

        .today-day {
            box-shadow:
                0 0 0 2px rgba(32, 163, 90, .16),
                0 2px 8px rgba(0, 0, 0, .08);
        }

        .future-day {
            opacity: 1;
        }

        .backup-button {
            transition: transform .15s ease, background .15s ease;
        }

        .backup-button:active {
            transform: scale(.98);
        }

        .floating-add {
            box-shadow: 0 6px 20px rgba(32, 163, 90, .25);
        }

        /* =====================================================
           CÍRCULO DE AGUA
        ===================================================== */

        .water-circle {
            position: relative;
            overflow: hidden;
            border-radius: 50%;
            background: #f1f5f2;
            box-shadow:
                inset 0 0 0 8px #e4eae6,
                0 2px 8px rgba(0, 0, 0, .05);
        }

        .water-fill {
            position: absolute;
            left: -15%;
            width: 130%;
            bottom: 0;
            background: #20a35a;
            transition: height .7s cubic-bezier(.22, .61, .36, 1);
        }

        .water-wave {
            position: absolute;
            left: -20%;
            width: 140%;
            height: 32px;
            top: -15px;
            border-radius: 50%;
            background: rgba(255,255,255,.28);
            animation: waveMove 3.2s linear infinite;
        }

        .water-wave-2 {
            position: absolute;
            left: -20%;
            width: 140%;
            height: 28px;
            top: -11px;
            border-radius: 50%;
            background: rgba(255,255,255,.16);
            animation: waveMoveReverse 4.5s linear infinite;
        }

        .water-shimmer {
            position: absolute;
            left: -50%;
            width: 200%;
            height: 70%;
            top: 15%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.10),
                transparent
            );
            transform: rotate(-15deg);
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes waveMove {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-12%);
            }
        }

        @keyframes waveMoveReverse {
            from {
                transform: translateX(-8%);
            }

            to {
                transform: translateX(8%);
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-30%) rotate(-15deg);
            }

            50% {
                transform: translateX(30%) rotate(-15deg);
            }

            100% {
                transform: translateX(-30%) rotate(-15deg);
            }
        }

        .water-content {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .water-number {
            font-size: 25px;
            font-weight: 800;
            line-height: 1.1;
        }

        .water-max {
            font-size: 14px;
            color: #6b7280;
            margin-top: 3px;
        }

        .water-label {
            font-size: 14px;
            color: #6b7280;
            margin-top: 6px;
        }

        .history-chart {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .chart-grid-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px dashed #dfe6e1;
        }

        .chart-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .chart-scroll::-webkit-scrollbar {
            display: none;
        }

        .chart-inner {
            min-width: 100%;
        }

        .bar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-width: 48px;
            height: 230px;
        }

        .bar-area {
            position: relative;
            width: 100%;
            height: 185px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .budget-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #e91e4d;
            z-index: 4;
        }

        .budget-line::after {
            content: "";
            position: absolute;
            right: 0;
            top: -3px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e91e4d;
        }

        .consumption-bar {
            width: 27px;
            min-height: 2px;
            background: #20a35a;
            border-radius: 8px 8px 3px 3px;
            transition: height .4s ease;
            z-index: 3;
        }

        .chart-label {
            font-size: 10px;
            color: #6b7280;
            margin-top: 8px;
            white-space: nowrap;
        }

        .chart-value {
            font-size: 9px;
            color: #6b7280;
            margin-bottom: 3px;
            white-space: nowrap;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }

        .legend-green {
            background: #20a35a;
        }

        .legend-red {
            background: #e91e4d;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const DEFAULT_SETTINGS = {
    caloriesWeekly: 16590,
    proteinDaily: 170,
    name: "Mi plan"
};

const DAYS = [
    "Lunes",
    "Martes",
    "Miércoles",
    "Jueves",
    "Viernes",
    "Sábado",
    "Domingo"
];

/* =========================================================
   UTILIDADES
========================================================= */

function getMonday(date = new Date()) {

    const d = new Date(date);

    d.setHours(0, 0, 0, 0);

    const day = d.getDay();

    const diff =
        day === 0
            ? -6
            : 1 - day;

    d.setDate(d.getDate() + diff);

    return d;
}


function dateKey(date) {

    const y = date.getFullYear();

    const m = String(
        date.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        date.getDate()
    ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function formatDate(date) {

    return date.toLocaleDateString(
        "es-ES",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


function formatWeekDate(date) {

    return date.toLocaleDateString(
        "es-ES",
        {
            day: "2-digit",
            month: "2-digit"
        }
    );
}


function getWeekDates(referenceDate = new Date()) {

    const monday =
        getMonday(referenceDate);

    const dates = [];

    for (let i = 0; i < 7; i++) {

        const d =
            new Date(monday);

        d.setDate(
            monday.getDate() + i
        );

        dates.push(d);
    }

    return dates;
}


function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


function loadJSON(key, fallback) {

    try {

        const value =
            localStorage.getItem(key);

        return value
            ? JSON.parse(value)
            : fallback;

    } catch {

        return fallback;
    }
}


function isPastDate(key) {

    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );

    const date =
        new Date(
            key + "T00:00:00"
        );

    return date < today;
}


function formatShortDate(key) {

    const date =
        new Date(
            key + "T00:00:00"
        );

    return date.toLocaleDateString(
        "es-ES",
        {
            day: "2-digit",
            month: "2-digit"
        }
    );
}


/* =========================================================
   APP
========================================================= */

function App() {

    const [activeTab, setActiveTab] =
        useState("home");

    const [settings, setSettings] =
        useState(() =>
            loadJSON(
                "nutrition_settings",
                DEFAULT_SETTINGS
            )
        );

    const [entries, setEntries] =
        useState(() =>
            loadJSON(
                "nutrition_entries",
                []
            )
        );

    const [showAdd, setShowAdd] =
        useState(false);

    const [selectedDate, setSelectedDate] =
        useState(
            dateKey(new Date())
        );


    useEffect(() => {

        localStorage.setItem(
            "nutrition_settings",
            JSON.stringify(settings)
        );

    }, [settings]);


    useEffect(() => {

        localStorage.setItem(
            "nutrition_entries",
            JSON.stringify(entries)
        );

    }, [entries]);


    const weekDates =
        getWeekDates();

    const weekKeys =
        weekDates.map(dateKey);

    const todayKey =
        dateKey(new Date());


    function getDayEntries(key) {

        return entries.filter(
            e => e.date === key
        );
    }


    function getDayCalories(key) {

        return getDayEntries(key)
            .reduce(
                (sum, e) =>
                    sum +
                    Number(e.calories || 0),
                0
            );
    }


    function getDayProtein(key) {

        return getDayEntries(key)
            .reduce(
                (sum, e) =>
                    sum +
                    Number(e.protein || 0),
                0
            );
    }


    const weeklyCaloriesConsumed =
        weekKeys.reduce(
            (sum, key) =>
                sum +
                getDayCalories(key),
            0
        );


    const weeklyProteinConsumed =
        weekKeys.reduce(
            (sum, key) =>
                sum +
                getDayProtein(key),
            0
        );


    const weeklyProteinTarget =
        Number(settings.proteinDaily) * 7;


    const weeklyCaloriesRemaining =
        Math.max(
            0,
            Number(settings.caloriesWeekly) -
            weeklyCaloriesConsumed
        );


    /* =====================================================
       PRESUPUESTO DINÁMICO
    ===================================================== */

    function getDynamicDailyBudget(index) {

        let remainingBudget =
            Number(settings.caloriesWeekly);

        for (let i = 0; i < index; i++) {

            remainingBudget -=
                getDayCalories(
                    weekKeys[i]
                );
        }

        const remainingDays =
            7 - index;

        if (remainingDays <= 0) {
            return 0;
        }

        return Math.max(
            0,
            remainingBudget /
            remainingDays
        );
    }


    const todayIndex =
        weekKeys.indexOf(todayKey);


    const todayBudget =
        todayIndex >= 0
            ? getDynamicDailyBudget(
                todayIndex
            )
            : Number(
                settings.caloriesWeekly
            ) / 7;


    const todayCalories =
        getDayCalories(
            todayKey
        );


    const todayProtein =
        getDayProtein(
            todayKey
        );


    const todayRemaining =
        Math.max(
            0,
            todayBudget - todayCalories
        );


    /* =====================================================
       AÑADIR
    ===================================================== */

    function addEntry(data) {

        const newEntry = {

            id:
                Date.now() +
                Math.random(),

            date:
                selectedDate,

            name:
                data.name,

            calories:
                Number(data.calories),

            protein:
                Number(data.protein)

        };


        setEntries(prev => [
            ...prev,
            newEntry
        ]);


        setShowAdd(false);
    }


    function deleteEntry(id) {

        setEntries(prev =>
            prev.filter(
                entry =>
                    entry.id !== id
            )
        );
    }


    function resetAll() {

        const confirmed =
            confirm(
                "¿Seguro que quieres borrar todos los registros? Esta acción no se puede deshacer."
            );

        if (!confirmed) {
            return;
        }

        setEntries([]);

        localStorage.removeItem(
            "nutrition_entries"
        );
    }


    /* =====================================================
       BACKUP
    ===================================================== */

    function saveBackup() {

        const backup = {

            app:
                "Mi Presupuesto",

            version:
                2,

            exportedAt:
                new Date().toISOString(),

            settings:
                settings,

            entries:
                entries

        };


        const json =
            JSON.stringify(
                backup,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href = url;


        const today =
            new Date()
                .toISOString()
                .slice(0, 10);


        link.download =
            `backup-calorias-${today}.json`;


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        URL.revokeObjectURL(
            url
        );
    }


    function loadBackup(event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                try {

                    const backup =
                        JSON.parse(
                            e.target.result
                        );


                    if (
                        !backup ||
                        !backup.settings ||
                        !Array.isArray(
                            backup.entries
                        )
                    ) {

                        throw new Error(
                            "Formato inválido"
                        );
                    }


                    const confirmed =
                        confirm(
                            "Cargar este backup reemplazará los datos actuales. ¿Quieres continuar?"
                        );


                    if (!confirmed) {

                        event.target.value =
                            "";

                        return;
                    }


                    const importedSettings = {

                        ...DEFAULT_SETTINGS,

                        ...backup.settings,

                        caloriesWeekly:
                            Number(
                                backup.settings
                                    .caloriesWeekly
                            ) || 0,

                        proteinDaily:
                            Number(
                                backup.settings
                                    .proteinDaily
                            ) || 0

                    };


                    const importedEntries =
                        backup.entries
                            .filter(
                                entry =>
                                    entry &&
                                    entry.date &&
                                    entry.name
                            )
                            .map(
                                entry => ({

                                    id:
                                        entry.id ||
                                        Date.now() +
                                        Math.random(),

                                    date:
                                        String(
                                            entry.date
                                        ),

                                    name:
                                        String(
                                            entry.name
                                        ),

                                    calories:
                                        Number(
                                            entry.calories
                                        ) || 0,

                                    protein:
                                        Number(
                                            entry.protein
                                        ) || 0

                                })
                            );


                    setSettings(
                        importedSettings
                    );

                    setEntries(
                        importedEntries
                    );


                    alert(
                        "Backup cargado correctamente."
                    );

                } catch {

                    alert(
                        "No se pudo cargar el backup. El archivo no tiene un formato válido."
                    );
                }


                event.target.value =
                    "";

            };


        reader.readAsText(file);
    }


    return (

        <div className="app">

            {activeTab === "home" && (

                <Home

                    settings={
                        settings
                    }

                    weekDates={
                        weekDates
                    }

                    weekKeys={
                        weekKeys
                    }

                    todayKey={
                        todayKey
                    }

                    todayBudget={
                        todayBudget
                    }

                    todayCalories={
                        todayCalories
                    }

                    todayProtein={
                        todayProtein
                    }

                    todayRemaining={
                        todayRemaining
                    }

                    weeklyCaloriesConsumed={
                        weeklyCaloriesConsumed
                    }

                    weeklyCaloriesRemaining={
                        weeklyCaloriesRemaining
                    }

                    weeklyProteinConsumed={
                        weeklyProteinConsumed
                    }

                    weeklyProteinTarget={
                        weeklyProteinTarget
                    }

                    getDayCalories={
                        getDayCalories
                    }

                    getDayProtein={
                        getDayProtein
                    }

                    getDynamicDailyBudget={
                        getDynamicDailyBudget
                    }

                    onAdd={() => {

                        setSelectedDate(
                            todayKey
                        );

                        setShowAdd(
                            true
                        );

                    }}

                    onSelectDay={
                        key => {

                            setSelectedDate(
                                key
                            );

                            setShowAdd(
                                true
                            );

                        }
                    }

                    entries={
                        entries
                    }

                    onDelete={
                        deleteEntry
                    }

                />

            )}


            {activeTab === "history" && (

                <History

                    entries={
                        entries
                    }

                    settings={
                        settings
                    }

                    getDayCalories={
                        getDayCalories
                    }

                    getDayProtein={
                        getDayProtein
                    }

                    getDynamicDailyBudget={
                        getDynamicDailyBudget
                    }

                    onSelectDay={
                        key => {

                            setSelectedDate(
                                key
                            );

                            setShowAdd(
                                true
                            );

                        }
                    }

                />

            )}


            {activeTab === "settings" && (

                <Settings

                    settings={
                        settings
                    }

                    setSettings={
                        setSettings
                    }

                    resetAll={
                        resetAll
                    }

                    saveBackup={
                        saveBackup
                    }

                    loadBackup={
                        loadBackup
                    }

                />

            )}


            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 nav-bottom z-30">

                <div className="max-w-[480px] mx-auto h-[82px] flex items-center justify-around">

                    <NavButton
                        active={
                            activeTab === "home"
                        }
                        icon="⌂"
                        label="Inicio"
                        onClick={() =>
                            setActiveTab(
                                "home"
                            )
                        }
                    />


                    <NavButton
                        active={
                            activeTab === "history"
                        }
                        icon="▦"
                        label="Historial"
                        onClick={() =>
                            setActiveTab(
                                "history"
                            )
                        }
                    />


                    <NavButton
                        active={
                            activeTab === "settings"
                        }
                        icon="⚙"
                        label="Ajustes"
                        onClick={() =>
                            setActiveTab(
                                "settings"
                            )
                        }
                    />

                </div>

            </div>


            {showAdd && (

                <AddModal

                    date={
                        selectedDate
                    }

                    onClose={() =>
                        setShowAdd(
                            false
                        )
                    }

                    onSave={
                        addEntry
                    }

                />

            )}

        </div>
    );
}


/* =========================================================
   HOME
========================================================= */

function Home({

    settings,
    weekDates,
    weekKeys,
    todayKey,
    todayBudget,
    todayCalories,
    todayProtein,
    todayRemaining,
    weeklyCaloriesConsumed,
    weeklyCaloriesRemaining,
    weeklyProteinConsumed,
    weeklyProteinTarget,
    getDayCalories,
    getDayProtein,
    getDynamicDailyBudget,
    onAdd,
    onSelectDay,
    entries,
    onDelete

}) {

    return (

        <main className="safe-bottom p-5">

            <header className="flex justify-between items-center mb-5">

                <div>

                    <div className="text-sm text-gray-500">
                        ESTA SEMANA
                    </div>

                    <h1 className="text-[28px] font-extrabold">

                        {formatWeekDate(
                            weekDates[0]
                        )}

                        {" – "}

                        {formatWeekDate(
                            weekDates[6]
                        )}

                    </h1>

                </div>


                <div className="w-12 h-12 rounded-2xl bg-white shadow-sm flex items-center justify-center text-2xl text-gray-500">

                    ⋁

                </div>

            </header>


            {/* =================================================
               RESUMEN SEMANAL
            ================================================= */}

            <section className="card p-6 mb-5">

                <div className="flex items-center gap-5">

                    <ProgressCircle

                        value={
                            weeklyCaloriesConsumed
                        }

                        max={
                            settings.caloriesWeekly
                        }

                        size={175}

                        label="Calorías"

                    />


                    <div className="flex-1 space-y-5">

                        <MiniProgress

                            value={
                                weeklyProteinConsumed
                            }

                            max={
                                weeklyProteinTarget
                            }

                            label="Proteína"

                            suffix="g"

                        />


                        <div>

                            <div className="flex justify-between text-xs mb-2">

                                <span className="text-gray-500">
                                    Restantes
                                </span>

                                <span className="font-semibold">

                                    {Math.round(
                                        weeklyCaloriesRemaining
                                    ).toLocaleString(
                                        "es-ES"
                                    )}

                                    {" kcal"}

                                </span>

                            </div>


                            <div className="text-sm text-gray-500">

                                de{" "}

                                {Number(
                                    settings.caloriesWeekly
                                ).toLocaleString(
                                    "es-ES"
                                )}

                                {" kcal"}

                            </div>

                        </div>

                    </div>

                </div>

            </section>


            {/* =================================================
               PRESUPUESTO HOY
            ================================================= */}

            <section className="card p-5 mb-5">

                <div className="flex justify-between items-start">

                    <div>

                        <div className="text-sm text-gray-500">
                            PRESUPUESTO DE HOY
                        </div>


                        <div className="text-3xl font-extrabold mt-1">

                            {Math.round(
                                todayBudget
                            ).toLocaleString(
                                "es-ES"
                            )}

                            <span className="text-base font-medium text-gray-400">
                                {" kcal"}
                            </span>

                        </div>


                        <div className="text-sm text-gray-500 mt-1">

                            {Math.round(
                                todayCalories
                            ).toLocaleString(
                                "es-ES"
                            )}

                            {" consumidas · "}

                            {Math.round(
                                todayRemaining
                            ).toLocaleString(
                                "es-ES"
                            )}

                            {" restantes"}

                        </div>

function ProgressCircle({

    label

    const percent =

                0,

            : 0;


    const percentage =
        percent * 100;


    return (

        <div

/* =========================================================
   HISTORIAL
========================================================= */

function History({

    entries,
    settings,
    getDayCalories,
    getDayProtein,
    getDynamicDailyBudget,
    onSelectDay

}) {

    const [period, setPeriod] =
        useState("week");


    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );


    /* =====================================================
       GENERAR FECHAS SEGÚN PERÍODO
    ===================================================== */

    function getHistoryDates() {

        const dates = [];

        if (period === "week") {

            const monday =
                getMonday(today);

            for (let i = 0; i < 7; i++) {

                const d =
                    new Date(monday);

                d.setDate(
                    monday.getDate() + i
                );

                dates.push(d);
            }

        }

        else if (period === "month") {

            const start =
                new Date(
                    today.getFullYear(),
                    today.getMonth(),
                    1
                );

            const end =
                new Date(
                    today.getFullYear(),
                    today.getMonth() + 1,
                    0
                );

            for (
                let d = new Date(start);
                d <= end;
                d.setDate(d.getDate() + 1)
            ) {

                dates.push(
                    new Date(d)
                );
            }

        }

        else {

            if (entries.length === 0) {
                return [];
            }


            const sorted =
                [...entries]
                    .sort(
                        (a, b) =>
                            a.date.localeCompare(
                                b.date
                            )
                    );


            const start =
                new Date(
                    sorted[0].date +
                    "T00:00:00"
                );


            for (
                let d = new Date(start);
                d <= today;
                d.setDate(d.getDate() + 1)
            ) {

                dates.push(
                    new Date(d)
                );

            }

        }

        return dates;
    }


    const dates =
        getHistoryDates();


    const keys =
        dates.map(dateKey);


    /* =====================================================
       DATOS
    ===================================================== */

    const chartData =
        dates.map(
            (date, index) => {

                const key =
                    dateKey(date);

                const calories =
                    getDayCalories(
                        key
                    );


                let budget;


                if (period === "week") {

                    budget =
                        getDynamicDailyBudget(
                            index
                        );

                }

                else {

                    /*
                     * Para mes y total mostramos
                     * el presupuesto diario equivalente.
                     *
                     * Esto permite comparar
                     * visualmente consumo y objetivo.
                     */

                    budget =
                        Number(
                            settings.caloriesWeekly
                        ) / 7;

                }


                return {

                    date,
                    key,
                    calories,
                    budget

                };

            }
        );


    const totalCalories =
        chartData.reduce(
            (sum, item) =>
                sum +
                item.calories,
            0
        );


    const totalProtein =
        chartData.reduce(
            (sum, item) =>
                sum +
                getDayProtein(
                    item.key
                ),
            0
        );


    const daysWithData =
        chartData.filter(
            item =>
                item.calories > 0
        ).length;


    const averageCalories =
        daysWithData > 0
            ? totalCalories /
              daysWithData
            : 0;


    const maxChartValue =
        Math.max(
            ...chartData.map(
                item =>
                    Math.max(
                        item.calories,
                        item.budget
                    )
            ),
            1
        );


    const chartHeight =
        185;


    function periodTitle() {

        if (period === "week") {
            return "Esta semana";
        }

        if (period === "month") {

            return today.toLocaleDateString(
                "es-ES",
                {
                    month: "long",
                    year: "numeric"
                }
            );

        }

        return "Todo el historial";
    }


    return (

        <main className="safe-bottom p-5">

            <header className="mb-5">

                <div className="text-sm text-gray-500">
                    HISTORIAL
                </div>


                <h1 className="text-3xl font-extrabold">
                    Consumo
                </h1>

            </header>


            {/* =================================================
               SELECTOR
            ================================================= */}

            <div className="card p-2 mb-5 flex gap-1">

                {[
                    ["week", "Semana"],
                    ["month", "Mes"],
                    ["all", "Total"]
                ].map(
                    ([value, label]) => (

                        <button

                            key={value}

                            onClick={() =>
                                setPeriod(
                                    value
                                )
                            }

                            className={`flex-1 py-3 rounded-xl text-sm font-semibold transition ${
                                period === value
                                    ? "bg-green text-white"
                                    : "text-gray-500"
                            }`}

                        >

                            {label}

                        </button>

                    )
                )}

            </div>


            {/* =================================================
               RESUMEN
            ================================================= */}

            <div className="grid grid-cols-2 gap-3 mb-5">

                <div className="card p-5">

                    <div className="text-sm text-gray-500">
                        Calorías
                    </div>


                    <div className="text-2xl font-extrabold mt-1">

                        {Math.round(
                            totalCalories
                        ).toLocaleString(
                            "es-ES"
                        )}

                    </div>


                    <div className="text-xs text-gray-400 mt-1">

                        {daysWithData > 0
                            ? `${Math.round(
                                averageCalories
                            ).toLocaleString(
                                "es-ES"
                            )} kcal/día`
                            : "Sin registros"}

                    </div>

                </div>


                <div className="card p-5">

                    <div className="text-sm text-gray-500">
                        Proteína
                    </div>


                    <div className="text-2xl font-extrabold mt-1">

                        {Math.round(
                            totalProtein
                        ).toLocaleString(
                            "es-ES"
                        )}

                        {" g"}

                    </div>


                    <div className="text-xs text-gray-400 mt-1">

                        {daysWithData > 0
                            ? `${Math.round(
                                totalProtein /
                                daysWithData
                            )} g/día`
                            : "Sin registros"}

                    </div>

                </div>

            </div>


            {/* =================================================
               GRÁFICO
            ================================================= */}

            <section className="card p-5 mb-5">

                <div className="flex justify-between items-start mb-4">

                    <div>

                        <h2 className="font-bold text-lg">
                            {periodTitle()}
                        </h2>

                        <p className="text-xs text-gray-500 mt-1">
                            Consumo diario vs presupuesto
                        </p>

                    </div>

                </div>


                <div className="flex items-center gap-4 mb-4 text-xs text-gray-500">

                    <div className="flex items-center gap-2">

                        <span className="legend-dot legend-green"></span>

                        Consumo

                    </div>


                    <div className="flex items-center gap-2">

                        <span className="legend-dot legend-red"></span>

                        Presupuesto

                    </div>

                </div>


                {chartData.length === 0 ? (

                    <div className="py-12 text-center text-gray-400 text-sm">

                        Todavía no hay registros suficientes
                        para mostrar el historial.

                    </div>

                ) : (

                    <div className="chart-scroll">

                        <div

                            className="chart-inner"

                            style={{
                                minWidth:
                                    period === "month"
                                        ? "760px"
                                        : period === "all"
                                            ? `${Math.max(
                                                chartData.length * 48,
                                                100
                                            )}px`
                                            : "100%"
                            }}

                        >

                            <div className="history-chart">

                                {/* LÍNEAS DE REFERENCIA */}

                                {[0, 25, 50, 75, 100].map(
                                    percentage => (

                                        <div

                                            key={
                                                percentage
                                            }

                                            className="chart-grid-line"

                                            style={{
                                                top:
                                                    `${100 - percentage}%`
                                            }}

                                        />

                                    )
                                )}


                                <div className="relative flex items-end justify-between gap-1 px-1">

                                    {chartData.map(
                                        item => {

                                            const consumptionHeight =
                                                item.calories /
                                                maxChartValue *
                                                chartHeight;


                                            const budgetPosition =
                                                chartHeight -
                                                (
                                                    item.budget /
                                                    maxChartValue *
                                                    chartHeight
                                                );


                                            const date =
                                                item.date;


                                            return (

                                                <div

                                                    key={
                                                        item.key
                                                    }

                                                    className="bar-item flex-1"

                                                >

                                                    <div className="bar-area">

                                                        {/* LÍNEA DE PRESUPUESTO */}

                                                        <div

                                                            className="budget-line"

                                                            style={{
                                                                bottom:
                                                                    `${budgetPosition}px`
                                                            }}

                                                        />


                                                        {/* VALOR */}

                                                        {item.calories > 0 && (

                                                            <div

                                                                className="chart-value"

                                                                style={{
                                                                    position:
                                                                        "absolute",
                                                                    bottom:
                                                                        `${Math.min(
                                                                            consumptionHeight +
                                                                            4,
                                                                            chartHeight -
                                                                            10
                                                                        )}px`
                                                                }}

                                                            >

                                                                {Math.round(
                                                                    item.calories
                                                                )}

                                                            </div>

                                                        )}


                                                        {/* BARRA */}

                                                        <div

                                                            className="consumption-bar"

                                                            style={{
                                                                height:
                                                                    `${Math.max(
                                                                        consumptionHeight,
                                                                        item.calories > 0
                                                                            ? 3
                                                                            : 0
                                                                    )}px`
                                                            }}

                                                        />

                                                    </div>


                                                    <div className="chart-label">

                                                        {period === "week"

                                                            ? DAYS[
                                                                date.getDay() === 0
                                                                    ? 6
                                                                    : date.getDay() - 1
                                                            ].slice(
                                                                0,
                                                                2
                                                            )

                                                            : formatShortDate(
                                                                item.key
                                                            )}

                                                    </div>

                                                </div>

                                            );

                                        }
                                    )}

                                </div>

                            </div>

                        </div>

                    </div>

                )}


                <div className="mt-4 text-xs text-gray-400">

                    La línea roja representa el presupuesto
                    disponible como referencia.

                    {period === "week" &&
                        " En la semana, el presupuesto se redistribuye dinámicamente según lo consumido."}

                </div>

            </section>


            {/* =================================================
               DETALLE DIARIO
            ================================================= */}

            <div className="flex items-center justify-between mb-3">

                <h2 className="text-xl font-bold">
                    Detalle
                </h2>

            </div>


            <div className="space-y-3">

                {chartData
                    .slice()
                    .reverse()
                    .map(
                        item => {

                            const protein =
                                getDayProtein(
                                    item.key
                                );


                            const dayEntries =
                                entries.filter(
                                    e =>
                                        e.date ===
                                        item.key
                                );


                            const overBudget =
                                item.calories >
                                item.budget;


                            const isToday =
                                item.key ===
                                dateKey(today);


                            return (

                                <div

                                    key={
                                        item.key
                                    }

                                    onClick={() =>

                                                            weekday:
                                                                "long"
                                                        }
                                                    )}

                                                {isToday && (

                                                    <span className="text-[10px] px-2 py-1 rounded-full bg-green/10 green font-bold">
                                                        HOY
                                                    </span>

                                                )}

                                            </div>


                                            <div className="text-xs text-gray-500 mt-1">

                                                {formatDate(

                                            </div>

                                        </div>


                                        <div className="text-right">

                                            <div className={`font-bold ${
                                                overBudget
                                                    ? "text-red-500"
                                                    : ""
                                            }`}>

                                                {Math.round(
                                                    item.calories
                                                ).toLocaleString(
                                                    "es-ES"
                                                )}

                                                {" kcal"}

                                            </div>


                                            <div className="text-xs text-gray-400">

                                                presupuesto{" "}

                                                {Math.round(
                                                    item.budget
                                                ).toLocaleString(
                                                    "es-ES"
                                                )}

                                            </div>

                                        </div>

                                    </div>


                                    <div className="grid grid-cols-2 gap-3 mt-3">

                                        <div className="bg-gray-50 rounded-xl p-3">

                                            <div className="text-xs text-gray-500">
                                                Proteína
                                            </div>

                                            <div className="font-bold mt-1">
                                                {Math.round(
                                                    protein

                                            <div className="font-bold mt-1">

                                            </div>

                                        </div>

                                    </div>


                                    <div className="mt-3">

                                        <div className="h-2 rounded-full progress-track overflow-hidden">

                                            <div

                                                className={`h-full rounded-full ${
                                                    overBudget
                                                        ? "progress-red"
                                                        : "progress-green"

                                                style={{
                                                    width:
                                                        `${clamp(
                                                            item.calories /

                                                            100

                                            />

                                    </div>

                                </div>

                            );

                        }
                    )}

            </div>

        </main>
    );
}

function Settings({

    settings,
    setSettings,
    resetAll,
    saveBackup,
    loadBackup

}) {

    const [local, setLocal] =
        useState(settings);


    useEffect(() => {

        setLocal(
            settings
        );

    }, [settings]);


    function save() {

        const calories =
            Number(
                local.caloriesWeekly
            );

        const protein =
            Number(
                local.proteinDaily
            );


        if (
            !Number.isFinite(
                calories
            ) ||
            calories <= 0
        ) {

            alert(
                "Introduce un presupuesto semanal válido."
            );

            return;
        }


        if (
            !Number.isFinite(
                protein
            ) ||
            protein < 0
        ) {

            alert(
                "Introduce un objetivo de proteína válido."
            );

            return;
        }


        const newSettings = {

            ...local,

            caloriesWeekly:
                calories,

            proteinDaily:
                protein

        };


        setSettings(
            newSettings
        );


        setLocal(
            newSettings
        );


        alert(
            "Configuración guardada."
        );

    }


    return (

        <main className="safe-bottom p-5">

            <header className="mb-6">

                <h1 className="text-3xl font-extrabold">
                    Mi plan
                </h1>


                <p className="text-gray-500 mt-2">
                    Configura tu presupuesto nutricional
                </p>

            </header>


            <section className="card p-5 mb-4">

                <h2 className="font-bold text-lg mb-5">
                    Objetivos
                </h2>


                <label className="block text-sm text-gray-500 mb-2">

                    Presupuesto semanal de calorías

                </label>


                <input

                    type="number"

                    inputMode="numeric"

                    value={
                        local.caloriesWeekly
                    }

                    onChange={e =>
                        setLocal({
                            ...local,
                            caloriesWeekly:
                                e.target.value
                        })
                    }

                    className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold mb-5"

                />


                <label className="block text-sm text-gray-500 mb-2">

                    Objetivo diario de proteína

                </label>


                <input

                    type="number"

                    inputMode="numeric"

                    value={
                        local.proteinDaily
                    }

                    onChange={e =>
                        setLocal({
                            ...local,
                            proteinDaily:
                                e.target.value
                        })
                    }

                    className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold"

                />

            </section>


            <section className="card p-5 mb-4">

                <h2 className="font-bold text-lg">
                    Cómo funciona
                </h2>


                <p className="text-sm text-gray-500 leading-6 mt-3">

                    Tu presupuesto de calorías es semanal.
                    No tienes un límite diario fijo.

                </p>


                <p className="text-sm text-gray-500 leading-6 mt-2">

                    Cada día, las calorías que quedan de la
                    semana se redistribuyen automáticamente
                    entre los días restantes.

                </p>


                <div className="bg-green/10 rounded-2xl p-4 mt-4 text-sm">

                    <div className="font-bold green mb-2">
                        Ejemplo
                    </div>


                    <div className="text-gray-600 leading-6">

                        Presupuesto semanal:
                        <strong>
                            {" 16.590 kcal"}
                        </strong>

                        <br />

                        Lunes consume:
                        <strong>
                            {" 2.600 kcal"}
                        </strong>

                        <br />

                        Quedan:
                        <strong>
                            {" 13.990 kcal"}
                        </strong>

                        <br />

                        Martes recibe:
                        <strong>
                            {" 2.331 kcal"}
                        </strong>

                        <br /><br />

                        Si el martes consumes menos,
                        el presupuesto de miércoles
                        aumenta automáticamente.

                    </div>

                </div>

            </section>


            <section className="card p-5 mb-4">

                <h2 className="font-bold text-lg">
                    Backup
                </h2>


                <p className="text-sm text-gray-500 leading-6 mt-2 mb-5">

                    Guarda una copia de tus registros y
                    configuración para poder restaurarlos
                    posteriormente.

                </p>


                <button

                    onClick={
                        saveBackup
                    }

                    className="backup-button w-full bg-green text-white py-4 rounded-2xl font-bold mb-3"

                >

                    ↓ Guardar backup

                </button>


                <label className="backup-button w-full bg-gray-100 text-gray-700 py-4 rounded-2xl font-bold flex items-center justify-center cursor-pointer">

                    ↑ Cargar backup


                    <input

                        type="file"

                        accept=".json,application/json"

                        onChange={
                            loadBackup
                        }

                        className="hidden"

                    />

                </label>

            </section>


            <button

                onClick={
                    save
                }

                className="w-full bg-green text-white py-4 rounded-2xl font-bold text-lg mb-4"

            >

                Guardar configuración

            </button>


            <button

                onClick={
                    resetAll
                }

                className="w-full bg-white text-red-500 border border-red-100 py-4 rounded-2xl font-semibold"

            >

                Borrar registros

            </button>

        </main>
    );
}


/* =========================================================
   MODAL AÑADIR
========================================================= */

function AddModal({

    date,
    onClose,
    onSave

}) {

    const [name, setName] =
        useState("");

    const [calories, setCalories] =
        useState("");

    const [protein, setProtein] =
        useState("");


    function submit(e) {

        e.preventDefault();


        if (!name.trim()) {

            alert(
                "Introduce el nombre del alimento."
            );

            return;
        }


        if (
            calories === "" ||
            Number(calories) < 0
        ) {

            alert(
                "Introduce las calorías."
            );

            return;
        }


        if (
            protein !== "" &&
            Number(protein) < 0
        ) {

            alert(
                "La proteína no puede ser negativa."
            );

            return;
        }


        onSave({

            name:
                name.trim(),

            calories:
                Number(calories),

            protein:
                Number(protein || 0)

        });

    }


    return (

        <div className="fixed inset-0 z-50 modal-backdrop flex items-end justify-center">

            <div className="bg-white w-full max-w-[480px] rounded-t-[30px] p-6">

                <div className="flex justify-between items-center mb-6">

                    <div>

                        <div className="text-sm text-gray-500">

                            {formatDate(
                                new Date(
                                    date +
                                    "T00:00:00"
                                )
                            )}

                        </div>


                        <h2 className="text-2xl font-extrabold">
                            Añadir comida
                        </h2>

                    </div>


                    <button

                        onClick={
                            onClose
                        }

                        className="w-10 h-10 rounded-full bg-gray-100 text-xl"

                    >
                        ×
                    </button>

                </div>


                <form

                    onSubmit={
                        submit
                    }

                    className="space-y-4"

                >

                    <div>

                        <label className="block text-sm text-gray-500 mb-2">
                            Alimento / comida
                        </label>


                        <input

                            autoFocus

                            value={
                                name
                            }

                            onChange={e =>
                                setName(
                                    e.target.value
                                )
                            }

                            placeholder="Ej. Pechuga de pollo"

                            className="w-full border border-gray-200 rounded-2xl px-4 py-4"

                        />

                    </div>


                    <div>

                        <label className="block text-sm text-gray-500 mb-2">
                            Calorías
                        </label>


                        <input

                            type="number"

                            inputMode="decimal"

                            min="0"

                            value={
                                calories
                            }

                            onChange={e =>
                                setCalories(
                                    e.target.value
                                )
                            }

                            placeholder="500"

                            className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold"

                        />

                    </div>


                    <div>

                        <label className="block text-sm text-gray-500 mb-2">
                            Proteína (g)
                        </label>


                        <input

                            type="number"

                            inputMode="decimal"

                            min="0"

                            value={
                                protein
                            }

                            onChange={e =>
                                setProtein(
                                    e.target.value
                                )
                            }

                            placeholder="40"

                            className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold"

                        />

                    </div>


                    <button

                        type="submit"

                        className="w-full bg-green text-white py-4 rounded-2xl font-bold text-lg mt-3"

                    >
                        Añadir
                    </button>

                </form>

            </div>

        </div>
    );
}


/* =========================================================
   NAV
========================================================= */

function NavButton({

    active,
    icon,
    label,
    onClick

}) {

    return (

        <button

            onClick={
                onClick
            }

            className={`flex flex-col items-center justify-center gap-1 w-24 ${
                active
                    ? "green"
                    : "text-gray-500"
            }`}

        >

            <span className="text-3xl leading-none">
                {icon}
            </span>


            <span className="text-xs font-medium">
                {label}
            </span>

        </button>
    );
}

    ReactDOM.createRoot(

root.render(
