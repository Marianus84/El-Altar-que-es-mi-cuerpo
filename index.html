<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Mi Presupuesto</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #f7faf8;
            color: #14221b;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            max-width: 480px;
            min-height: 100vh;
            margin: auto;
            background: #f7faf8;
        }

        .green {
            color: #20a35a;
        }

        .bg-green {
            background: #20a35a;
        }

        .progress-track {
            background: #e3eae5;
        }

        .progress-green {
            background: #20a35a;
        }

        .progress-red {
            background: #e91e4d;
        }

        .card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .circle {
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: #e4eae6;
        }

        .circle-progress {
            fill: none;
            stroke: #20a35a;
            stroke-linecap: round;
            transition: stroke-dashoffset .4s ease;
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, .42);
            backdrop-filter: blur(3px);
        }

        .safe-bottom {
            padding-bottom: calc(115px + env(safe-area-inset-bottom));
        }

        .nav-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

        input:focus {
            outline: none;
            border-color: #20a35a;
            box-shadow: 0 0 0 3px rgba(32, 163, 90, .12);
        }

        .day-row {
            transition: transform .15s ease, opacity .2s ease;
        }

        .day-row:active {
            transform: scale(.99);
        }

        .past-day {
            opacity: .62;
            filter: grayscale(12%);
        }

        .past-day .day-date {
            color: #9aa39e;
        }

        .today-day {
            box-shadow:
                0 0 0 2px rgba(32, 163, 90, .16),
                0 2px 8px rgba(0, 0, 0, .08);
        }

        .future-day {
            opacity: 1;
        }

        .backup-button {
            transition: transform .15s ease, background .15s ease;
        }

        .backup-button:active {
            transform: scale(.98);
        }

        .floating-add {
            box-shadow: 0 6px 20px rgba(32, 163, 90, .25);
        }

        .history-tab {
            transition: all .15s ease;
        }

        .history-tab.active {
            background: #20a35a;
            color: white;
            box-shadow: 0 3px 10px rgba(32, 163, 90, .20);
        }

        .chart-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .chart-scroll::-webkit-scrollbar {
            display: none;
        }

        .chart-tooltip {
            pointer-events: none;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const DEFAULT_SETTINGS = {
    caloriesWeekly: 16590,
    proteinDaily: 170,
    name: "Mi plan"
};

const DAYS = [
    "Lunes",
    "Martes",
    "Miércoles",
    "Jueves",
    "Viernes",
    "Sábado",
    "Domingo"
];

const MONTHS = [
    "enero",
    "febrero",
    "marzo",
    "abril",
    "mayo",
    "junio",
    "julio",
    "agosto",
    "septiembre",
    "octubre",
    "noviembre",
    "diciembre"
];


/* =========================================================
   UTILIDADES
========================================================= */

function getMonday(date = new Date()) {

    const d = new Date(date);

    d.setHours(0, 0, 0, 0);

    const day = d.getDay();

    const diff =
        day === 0
            ? -6
            : 1 - day;

    d.setDate(d.getDate() + diff);

    return d;
}


function dateKey(date) {

    const y = date.getFullYear();

    const m = String(
        date.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        date.getDate()
    ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function keyToDate(key) {

    return new Date(
        key + "T00:00:00"
    );
}


function formatDate(date) {

    return date.toLocaleDateString(
        "es-ES",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


function formatShortDate(date) {

    return date.toLocaleDateString(
        "es-ES",
        {
            day: "2-digit",
            month: "2-digit"
        }
    );
}


function formatChartDate(date) {

    return date.toLocaleDateString(
        "es-ES",
        {
            day: "2-digit",
            month: "2-digit"
        }
    );
}


function getWeekDates(date = new Date()) {

    const monday = getMonday(date);

    const dates = [];

    for (let i = 0; i < 7; i++) {

        const d = new Date(monday);

        d.setDate(
            monday.getDate() + i
        );

        dates.push(d);
    }

    return dates;
}


function getMonthDates(date = new Date()) {

    const year =
        date.getFullYear();

    const month =
        date.getMonth();

    const lastDay =
        new Date(
            year,
            month + 1,
            0
        ).getDate();

    const dates = [];

    for (let i = 1; i <= lastDay; i++) {

        dates.push(
            new Date(
                year,
                month,
                i
            )
        );
    }

    return dates;
}


function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


function loadJSON(key, fallback) {

    try {

        const value =
            localStorage.getItem(key);

        return value
            ? JSON.parse(value)
            : fallback;

    } catch {

        return fallback;
    }
}


function isPastDate(key) {

    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );

    const date =
        new Date(
            key + "T00:00:00"
        );

    return date < today;
}


function isFutureDate(key) {

    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );

    const date =
        new Date(
            key + "T00:00:00"
        );

    return date > today;
}


/* =========================================================
   APP
========================================================= */

function App() {

    const [activeTab, setActiveTab] =
        useState("home");

    const [settings, setSettings] =
        useState(() =>
            loadJSON(
                "nutrition_settings",
                DEFAULT_SETTINGS
            )
        );

    const [entries, setEntries] =
        useState(() =>
            loadJSON(
                "nutrition_entries",
                []
            )
        );

    const [showAdd, setShowAdd] =
        useState(false);

    const [selectedDate, setSelectedDate] =
        useState(
            dateKey(new Date())
        );


    /* -----------------------------------------------------
       GUARDAR AUTOMÁTICAMENTE
    ----------------------------------------------------- */

    useEffect(() => {

        localStorage.setItem(
            "nutrition_settings",
            JSON.stringify(settings)
        );

    }, [settings]);


    useEffect(() => {

        localStorage.setItem(
            "nutrition_entries",
            JSON.stringify(entries)
        );

    }, [entries]);


    /* -----------------------------------------------------
       FECHAS
    ----------------------------------------------------- */

    const weekDates =
        getWeekDates();

    const weekKeys =
        weekDates.map(dateKey);

    const todayKey =
        dateKey(new Date());


    /* -----------------------------------------------------
       ENTRADAS
    ----------------------------------------------------- */

    function getDayEntries(key) {

        return entries.filter(
            e => e.date === key
        );
    }


    function getDayCalories(key) {

        return getDayEntries(key)
            .reduce(
                (sum, e) =>
                    sum +
                    Number(e.calories || 0),
                0
            );
    }


    function getDayProtein(key) {

        return getDayEntries(key)
            .reduce(
                (sum, e) =>
                    sum +
                    Number(e.protein || 0),
                0
            );
    }


    /* =====================================================
       PRESUPUESTO DINÁMICO
    ===================================================== */

    /*
     * Calcula el presupuesto dinámico de cualquier fecha.
     *
     * Esto es importante para HISTORIAL:
     * no podemos usar únicamente la semana actual.
     *
     * Para cada fecha:
     *
     * presupuesto semanal
     * - consumo de días anteriores
     * --------------------------------
     * días restantes
     *
     * Ejemplo:
     *
     * 16.590 semanal
     *
     * Lunes: 2.600
     *
     * Martes:
     * (16.590 - 2.600) / 6
     *
     * Si martes consume 2.000:
     *
     * Miércoles:
     * (16.590 - 2.600 - 2.000) / 5
     */

    function getDynamicBudgetForDate(date) {

        const key =
            dateKey(date);

        const monday =
            getMonday(date);

        const week =
            getWeekDates(monday);

        const keys =
            week.map(dateKey);

        const index =
            keys.indexOf(key);

        if (index < 0) {
            return 0;
        }

        let remainingBudget =
            Number(settings.caloriesWeekly);

        for (let i = 0; i < index; i++) {

            remainingBudget -=
                getDayCalories(
                    keys[i]
                );
        }

        const remainingDays =
            7 - index;

        if (remainingDays <= 0) {
            return 0;
        }

        return Math.max(
            0,
            remainingBudget /
            remainingDays
        );
    }


    function getDynamicDailyBudget(index) {

        return getDynamicBudgetForDate(
            weekDates[index]
        );
    }


    /* =====================================================
       DATOS SEMANALES
    ===================================================== */

    const weeklyCaloriesConsumed =
        weekKeys.reduce(
            (sum, key) =>
                sum +
                getDayCalories(key),
            0
        );


    const weeklyProteinConsumed =
        weekKeys.reduce(
            (sum, key) =>
                sum +
                getDayProtein(key),
            0
        );


    const weeklyProteinTarget =
        Number(settings.proteinDaily) * 7;


    const weeklyCaloriesRemaining =
        Math.max(
            0,
            Number(settings.caloriesWeekly) -
            weeklyCaloriesConsumed
        );


    /* -----------------------------------------------------
       HOY
    ----------------------------------------------------- */

    const todayIndex =
        weekKeys.indexOf(todayKey);


    const todayBudget =
        todayIndex >= 0
            ? getDynamicDailyBudget(
                todayIndex
            )
            : Number(
                settings.caloriesWeekly
            ) / 7;


    const todayCalories =
        getDayCalories(
            todayKey
        );


    const todayProtein =
        getDayProtein(
            todayKey
        );


    const todayRemaining =
        Math.max(
            0,
            todayBudget -
            todayCalories
        );


    /* =====================================================
       AÑADIR REGISTRO
    ===================================================== */

    function addEntry(data) {

        const newEntry = {

            id:
                Date.now() +
                Math.random(),

            date:
                selectedDate,

            name:
                data.name,

            calories:
                Number(data.calories),

            protein:
                Number(data.protein)
        };


        setEntries(prev => [
            ...prev,
            newEntry
        ]);


        setShowAdd(false);
    }


    /* =====================================================
       ELIMINAR
    ===================================================== */

    function deleteEntry(id) {

        setEntries(prev =>
            prev.filter(
                entry =>
                    entry.id !== id
            )
        );
    }


    /* =====================================================
       BORRAR TODOS
    ===================================================== */

    function resetAll() {

        const confirmed =
            confirm(
                "¿Seguro que quieres borrar todos los registros? Esta acción no se puede deshacer."
            );

        if (!confirmed) {
            return;
        }

        setEntries([]);

        localStorage.removeItem(
            "nutrition_entries"
        );
    }


    /* =====================================================
       BACKUP — GUARDAR
    ===================================================== */

    function saveBackup() {

        const backup = {

            app:
                "Mi Presupuesto",

            version:
                2,

            exportedAt:
                new Date().toISOString(),

            settings:
                settings,

            entries:
                entries
        };


        const json =
            JSON.stringify(
                backup,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href = url;


        const today =
            new Date()
                .toISOString()
                .slice(0, 10);


        link.download =
            `backup-calorias-${today}.json`;


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        URL.revokeObjectURL(
            url
        );
    }


    /* =====================================================
       BACKUP — CARGAR
    ===================================================== */

    function loadBackup(event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                try {

                    const backup =
                        JSON.parse(
                            e.target.result
                        );


                    if (
                        !backup ||
                        !backup.settings ||
                        !Array.isArray(
                            backup.entries
                        )
                    ) {

                        throw new Error(
                            "Formato inválido"
                        );
                    }


                    const confirmed =
                        confirm(
                            "Cargar este backup reemplazará los datos actuales. ¿Quieres continuar?"
                        );


                    if (!confirmed) {

                        event.target.value =
                            "";

                        return;
                    }


                    const importedSettings = {

                        ...DEFAULT_SETTINGS,

                        ...backup.settings,

                        caloriesWeekly:
                            Number(
                                backup.settings
                                    .caloriesWeekly
                            ) || 0,

                        proteinDaily:
                            Number(
                                backup.settings
                                    .proteinDaily
                            ) || 0
                    };


                    const importedEntries =
                        backup.entries
                            .filter(
                                entry =>
                                    entry &&
                                    entry.date &&
                                    entry.name
                            )
                            .map(
                                entry => ({

                                    id:
                                        entry.id ||
                                        Date.now() +
                                        Math.random(),

                                    date:
                                        String(
                                            entry.date
                                        ),

                                    name:
                                        String(
                                            entry.name
                                        ),

                                    calories:
                                        Number(
                                            entry.calories
                                        ) || 0,

                                    protein:
                                        Number(
                                            entry.protein
                                        ) || 0
                                })
                            );


                    setSettings(
                        importedSettings
                    );

                    setEntries(
                        importedEntries
                    );


                    alert(
                        "Backup cargado correctamente."
                    );

                } catch (error) {

                    alert(
                        "No se pudo cargar el backup. El archivo no tiene un formato válido."
                    );
                }


                event.target.value =
                    "";
            };


        reader.readAsText(file);
    }


    /* =====================================================
       RENDER
    ===================================================== */

    return (

        <div className="app">

            {activeTab === "home" && (

                <Home

                    settings={
                        settings
                    }

                    weekDates={
                        weekDates
                    }

                    weekKeys={
                        weekKeys
                    }

                    todayKey={
                        todayKey
                    }

                    todayBudget={
                        todayBudget
                    }

                    todayCalories={
                        todayCalories
                    }

                    todayProtein={
                        todayProtein
                    }

                    todayRemaining={
                        todayRemaining
                    }

                    weeklyCaloriesConsumed={
                        weeklyCaloriesConsumed
                    }

                    weeklyCaloriesRemaining={
                        weeklyCaloriesRemaining
                    }

                    weeklyProteinConsumed={
                        weeklyProteinConsumed
                    }

                    weeklyProteinTarget={
                        weeklyProteinTarget
                    }

                    getDayCalories={
                        getDayCalories
                    }

                    getDayProtein={
                        getDayProtein
                    }

                    getDynamicDailyBudget={
                        getDynamicDailyBudget
                    }

                    onAdd={() => {

                        setSelectedDate(
                            todayKey
                        );

                        setShowAdd(
                            true
                        );
                    }}

                    onSelectDay={
                        key => {

                            setSelectedDate(
                                key
                            );

                            setShowAdd(
                                true
                            );
                        }
                    }

                    entries={
                        entries
                    }

                    onDelete={
                        deleteEntry
                    }
                />
            )}


            {activeTab === "history" && (

                <History

                    entries={
                        entries
                    }

                    getDayCalories={
                        getDayCalories
                    }

                    getDayProtein={
                        getDayProtein
                    }

                    getDynamicBudgetForDate={
                        getDynamicBudgetForDate
                    }

                    settings={
                        settings
                    }

                    todayKey={
                        todayKey
                    }

                    onSelectDay={
                        key => {

                            setSelectedDate(
                                key
                            );

                            setShowAdd(
                                true
                            );
                        }
                    }
                />
            )}


            {activeTab === "settings" && (

                <Settings

                    settings={
                        settings
                    }

                    setSettings={
                        setSettings
                    }

                    resetAll={
                        resetAll
                    }

                    saveBackup={
                        saveBackup
                    }

                    loadBackup={
                        loadBackup
                    }
                />
            )}


            {/* =================================================
               NAVEGACIÓN
            ================================================= */}

            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 nav-bottom z-30">

                <div className="max-w-[480px] mx-auto h-[82px] flex items-center justify-around">

                    <NavButton
                        active={
                            activeTab === "home"
                        }
                        icon="⌂"
                        label="Inicio"
                        onClick={() =>
                            setActiveTab(
                                "home"
                            )
                        }
                    />


                    <NavButton
                        active={
                            activeTab === "history"
                        }
                        icon="▦"
                        label="Historial"
                        onClick={() =>
                            setActiveTab(
                                "history"
                            )
                        }
                    />


                    <NavButton
                        active={
                            activeTab === "settings"
                        }
                        icon="⚙"
                        label="Ajustes"
                        onClick={() =>
                            setActiveTab(
                                "settings"
                            )
                        }
                    />

                </div>

            </div>


            {/* =================================================
               MODAL AÑADIR
            ================================================= */}

            {showAdd && (

                <AddModal

                    date={
                        selectedDate
                    }

                    onClose={() =>
                        setShowAdd(
                            false
                        )
                    }

                    onSave={
                        addEntry
                    }
                />
            )}

        </div>
    );
}


/* =========================================================
   HOME
========================================================= */

function Home({

    settings,
    weekDates,
    weekKeys,
    todayKey,
    todayBudget,
    todayCalories,
    todayProtein,
    todayRemaining,
    weeklyCaloriesConsumed,
    weeklyCaloriesRemaining,
    weeklyProteinConsumed,
    weeklyProteinTarget,
    getDayCalories,
    getDayProtein,
    getDynamicDailyBudget,
    onAdd,
    onSelectDay,
    entries,
    onDelete

}) {

    return (

        <main className="safe-bottom p-5">

            <header className="flex justify-between items-center mb-5">

                <div>

                    <div className="text-sm text-gray-500">
                        ESTA SEMANA
                    </div>

                    <h1 className="text-[28px] font-extrabold">

                        {formatShortDate(
                            weekDates[0]
                        )}

                        {" – "}

                        {formatShortDate(
                            weekDates[6]
                        )}

                    </h1>

                </div>


                <div className="w-12 h-12 rounded-2xl bg-white shadow-sm flex items-center justify-center text-2xl text-gray-500">

                    ⋁

                </div>

            </header>


            {/* =================================================
               RESUMEN SEMANAL
            ================================================= */}

            <section className="card p-6 mb-5">

                <div className="flex items-center gap-5">

                    <ProgressCircle
                        value={
                            weeklyCaloriesConsumed
                        }
                        max={
                            settings.caloriesWeekly
                        }
                        size={175}
                        stroke={14}
                        label="Calorías"
                    />


                    <div className="flex-1 space-y-5">

                        <MiniProgress
                            value={
                                weeklyProteinConsumed
                            }
                            max={
                                weeklyProteinTarget
                            }
                            label="Proteína"
                            suffix="g"
                        />


                        <div>

                            <div className="flex justify-between text-xs mb-2">

                                <span className="text-gray-500">
                                    Restantes
                                </span>

                                <span className="font-semibold">

                                    {Math.round(
                                        weeklyCaloriesRemaining
                                    ).toLocaleString(
                                        "es-ES"
                                    )}

                                    {" kcal"}

                                </span>

                            </div>


                            <div className="text-sm text-gray-500">

                                de{" "}

                                {Number(
                                    settings.caloriesWeekly
                                ).toLocaleString(
                                    "es-ES"
                                )}

                                {" kcal"}

                            </div>

                        </div>

                    </div>

                </div>

            </section>


            {/* =================================================
               PRESUPUESTO DE HOY
            ================================================= */}

            <section className="card p-5 mb-5">

                <div className="flex justify-between items-start">

                    <div>

                        <div className="text-sm text-gray-500">
                            PRESUPUESTO DE HOY
                        </div>


                        <div className="text-3xl font-extrabold mt-1">

                            {Math.round(
                                todayBudget
                            ).toLocaleString(
                                "es-ES"
                            )}

                            <span className="text-base font-medium text-gray-400">
                                {" kcal"}
                            </span>

                        </div>


                        <div className="text-sm text-gray-500 mt-1">

                            {Math.round(
                                todayCalories
                            ).toLocaleString(
                                "es-ES"
                            )}

                            {" consumidas · "}

                            {Math.round(
                                todayRemaining
                            ).toLocaleString(
                                "es-ES"
                            )}

                            {" restantes"}

                        </div>

                    </div>


                    <button
                        onClick={
                            onAdd
                        }
                        className="bg-green text-white w-12 h-12 rounded-2xl text-2xl shadow-sm"
                    >
                        +
                    </button>

                </div>


                {/* CALORÍAS */}

                <div className="mt-5">

                    <div className="flex justify-between text-xs mb-2">

                        <span>
                            Calorías
                        </span>

                        <span>

                            {Math.round(
                                todayCalories
                            )}

                            {" / "}

                            {Math.round(
                                todayBudget
                            )}

                        </span>

                    </div>


                    <div className="h-2 rounded-full progress-track overflow-hidden">

                        <div
                            className="h-full progress-green rounded-full"
                            style={{
                                width:
                                    `${clamp(
                                        todayCalories /
                                        Math.max(
                                            todayBudget,
                                            1
                                        ) *
                                        100,
                                        0,
                                        100
                                    )}%`
                            }}
                        />

                    </div>

                </div>

/* =========================================================
   CÍRCULO
========================================================= */

function ProgressCircle({

    value,
    max,
    size,
    stroke,
    label

}) {

    const radius =
        (size - stroke) / 2;

    const circumference =
        2 * Math.PI * radius;

    const percent =
        max > 0
            ? clamp(
                value / max,
                0,
                1
            )
            : 0;

    const offset =
        circumference *
        (1 - percent);


    return (

        <div
            className="relative flex-shrink-0"
            style={{
                width: size,
                height: size
            }}
        >

            <svg
                width={size}
                height={size}
                className="circle"
            >

                <circle
                    className="circle-bg"
                    cx={size / 2}
                    cy={size / 2}
                    r={radius}
                    strokeWidth={stroke}
                />

                <circle
                    className="circle-progress"
                    cx={size / 2}
                    cy={size / 2}
                    r={radius}
                    strokeWidth={stroke}
                    strokeDasharray={circumference}
                    strokeDashoffset={offset}
                />

            </svg>


            <div className="absolute inset-0 flex flex-col items-center justify-center">

                <div className="text-[25px] font-extrabold">
                    {Math.round(value).toLocaleString("es-ES")}
                </div>

                <div className="text-sm text-gray-400">
                    / {Math.round(max).toLocaleString("es-ES")}
                </div>

                <div className="text-sm text-gray-500 mt-1">
                    {label}
                </div>

            </div>

        </div>
    );
}


/* =========================================================
   MINI PROGRESS
========================================================= */

function MiniProgress({

    value,
    max,
    label,
    suffix

}) {

    const percent =
        max > 0
            ? clamp(
                value /
                max *
                100,
                0,
                100
            )
            : 0;


    return (

        <div>

            <div className="flex justify-between text-xs mb-2">

                <span className="text-gray-500">
                    {label}
                </span>

                <span className="font-semibold">

                    {Math.round(value)}
                    {" / "}
                    {Math.round(max)}
                    {" "}
                    {suffix}

                </span>

            </div>


            <div className="h-2 rounded-full progress-track overflow-hidden">

                <div
                    className="h-full progress-green rounded-full"
                    style={{
                        width:
                            `${percent}%`
                    }}
                />

            </div>

        </div>
    );
}

        useState("week");

       CREAR DATOS DEL PERIODO
    ===================================================== */

    function getHistoryDates() {

        if (period === "week") {

            return getWeekDates();

        }


        if (period === "month") {

            return getMonthDates();

        }


        /*
         * TOTAL
         *
         * Incluimos todos los días que
         * tengan registros.
         */

        if (entries.length === 0) {
            return [];
        }


        const keys =
            [...new Set(
                entries.map(
                    entry => entry.date
                )
            )];


        keys.sort();


        const first =
            keyToDate(keys[0]);

        const last =
            keyToDate(
                keys[keys.length - 1]
            );


        const dates = [];

        const current =
            new Date(first);

        while (
            current <= last
        ) {

            dates.push(
                new Date(current)
            );

            current.setDate(
                current.getDate() + 1
            );
        }


        return dates;
    }


    const dates =
        getHistoryDates();


    const keys =
        dates.map(dateKey);

    ===================================================== */

        dates.map(date => {

/* =========================================================
   GRÁFICA DEL HISTORIAL
========================================================= */

function HistoryChart({

    data,
    period

}) {

    /*
     * En móvil:
     *
     * Semana -> 420 px
     * Mes -> aproximadamente 900 px
     * Total -> 1100 px o más
     *
     * Esto permite que cada día tenga suficiente
     * espacio y que el usuario pueda deslizar.
     */

    const minWidth =
        period === "week"
            ? 390
            : period === "month"
                ? Math.max(
                    800,
                    data.length * 34
                )
                : Math.max(
                    1000,
                    data.length * 30
                );


    const width =
        Math.max(
            390,
            minWidth
        );

    const height =
        270;


    const padding = {

        top: 25,
        right: 15,
        bottom: 45,
        left: 45

    };


    const chartWidth =
        width -
        padding.left -
        padding.right;

    const chartHeight =
        height -
        padding.top -
        padding.bottom;


    const maxValue =
        Math.max(
            ...data.map(
                item =>
                    Math.max(
                        item.calories,
                        item.budget
                    )
            ),
            1000
        );


    const roundedMax =
        Math.ceil(
            maxValue / 500
        ) * 500;


    const yTicks = 4;


    function getX(index) {

        if (data.length === 1) {

            return (
                padding.left +
                chartWidth / 2
            );
        }

        return (
            padding.left +
            (
                index /
                (data.length - 1)
            ) *
            chartWidth
        );
    }


    function getY(value) {

        return (
            padding.top +
            chartHeight -
            (
                value /
                roundedMax
            ) *
            chartHeight
        );
    }


    const budgetPoints =
        data.map(
            (item, index) =>
                `${getX(index)},${getY(item.budget)}`
        ).join(" ");


    return (

        <div className="chart-scroll">

            <svg
                width={width}
                height={height}
                viewBox={`0 0 ${width} ${height}`}
            >

                {/* =================================================
                   GRID
                ================================================= */}

                {Array.from({
                    length:
                        yTicks + 1
                }).map(
                    (_, index) => {

                        const value =
                            roundedMax -
                            (
                                index /
                                yTicks
                            ) *
                            roundedMax;

                        const y =
                            getY(value);


                        return (

                            <g
                                key={
                                    `grid-${index}`
                                }
                            >

                                <line
                                    x1={
                                        padding.left
                                    }
                                    x2={
                                        width -
                                        padding.right
                                    }
                                    y1={y}
                                    y2={y}
                                    stroke="#e8eeea"
                                    strokeWidth="1"
                                />


                                <text
                                    x="4"
                                    y={y + 4}
                                    fontSize="9"
                                    fill="#9aa39e"
                                >
                                    {Math.round(
                                        value
                                    ).toLocaleString(
                                        "es-ES"
                                    )}
                                </text>

                            </g>

                        );

                    }
                )}


                {/* =================================================
                   BARRAS
                ================================================= */}

                {data.map(
                    (item, index) => {

                        const x =
                            getX(index);

                        const barWidth =
                            Math.max(
                                8,
                                Math.min(
                                    24,
                                    chartWidth /
                                    Math.max(
                                        data.length *
                                        1.7,
                                        1
                                    )
                                )
                            );


                        const barX =
                            x -
                            barWidth /
                            2;


                        const barY =
                            getY(
                                item.calories
                            );


                        const barHeight =
                            Math.max(
                                1,
                                padding.top +
                                chartHeight -
                                barY
                            );


                        const exceeded =
                            item.calories >
                            item.budget;


                        return (

                            <g
                                key={
                                    `bar-${item.key}`
                                }
                            >

                                <rect
                                    x={barX}
                                    y={barY}
                                    width={barWidth}
                                    height={barHeight}
                                    rx="5"
                                    fill={
                                        exceeded
                                            ? "#ef4444"
                                            : "#20a35a"
                                    }
                                    opacity={
                                        item.calories === 0
                                            ? 0.12
                                            : 0.85
                                    }
                                />


                                {/* Valor cuando hay espacio */}

                                {item.calories > 0 &&
                                    period === "week" && (

                                    <text
                                        x={x}
                                        y={
                                            Math.max(
                                                13,
                                                barY - 5
                                            )
                                        }
                                        textAnchor="middle"
                                        fontSize="8"
                                        fontWeight="600"
                                        fill="#59635d"
                                    >
                                        {Math.round(
                                            item.calories
                                        )}
                                    </text>

                                )}

                            </g>

                        );

                    }
                )}


                {/* =================================================
                   LÍNEA DE PRESUPUESTO
                ================================================= */}

                <polyline
                    points={
                        budgetPoints
                    }
                    fill="none"
                    stroke="#4b5563"
                    strokeWidth="2.5"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                />


                {/* =================================================
                   PUNTOS DEL PRESUPUESTO
                ================================================= */}

                {data.map(
                    (item, index) => (

                        <circle
                            key={
                                `budget-${item.key}`
                            }
                            cx={
                                getX(index)
                            }
                            cy={
                                getY(
                                    item.budget
                                )
                            }
                            r={
                                period === "week"
                                    ? 3
                                    : 2
                            }
                            fill="#4b5563"
                        />

                    )
                )}


                {/* =================================================
                   EJE X
                ================================================= */}

                {data.map(
                    (item, index) => {

                        /*
                         * En mes y total mostramos
                         * menos etiquetas para evitar
                         * que se superpongan.
                         */

                        let showLabel =
                            true;

                        if (
                            period === "month"
                        ) {

                            showLabel =
                                index % 3 === 0 ||
                                index ===
                                data.length - 1;

                        }


                        if (
                            period === "total"
                        ) {

                            showLabel =
                                index === 0 ||
                                index ===
                                data.length - 1 ||
                                index % 7 === 0;

                        }


                        if (!showLabel) {
                            return null;
                        }


                        return (

                            <text
                                key={
                                    `label-${item.key}`
                                }
                                x={
                                    getX(index)
                                }
                                y={
                                    height -
                                    18
                                }
                                textAnchor="middle"
                                fontSize="9"
                                fill="#7b857f"
                            >

                                {period === "week"
                                    ? item.date.toLocaleDateString(
                                        "es-ES",
                                        {
                                            weekday:
                                                "short"
                                        }
                                    ).replace(
                                        ".",
                                        ""
                                    )
                                    : formatChartDate(
                                        item.date
                                    )}

                            </text>

                        );

                    }
                )}

            </svg>

        </div>
    );
}


/* =========================================================
   AJUSTES
========================================================= */

function Settings({

    settings,
    setSettings,
    resetAll,
    saveBackup,
    loadBackup

}) {

    const [local, setLocal] =
        useState(settings);


    useEffect(() => {

        setLocal(settings);

    }, [settings]);


    function save() {

        const calories =
            Number(
                local.caloriesWeekly
            );

        const protein =
            Number(
                local.proteinDaily
            );


        if (
            !Number.isFinite(
                calories
            ) ||
            calories <= 0
        ) {

            alert(
                "Introduce un presupuesto semanal válido."
            );

            return;
        }


        if (
            !Number.isFinite(
                protein
            ) ||
            protein < 0
        ) {

            alert(
                "Introduce un objetivo de proteína válido."
            );

            return;
        }


        const newSettings = {

            ...local,

            caloriesWeekly:
                calories,

            proteinDaily:
                protein
        };


        setSettings(
            newSettings
        );


        setLocal(
            newSettings
        );


        alert(
            "Configuración guardada."
        );
    }


    return (

        <main className="safe-bottom p-5">

            <header className="mb-6">

                <h1 className="text-3xl font-extrabold">
                    Mi plan
                </h1>

                <p className="text-gray-500 mt-2">
                    Configura tu presupuesto nutricional
                </p>

            </header>


            {/* OBJETIVOS */}

            <section className="card p-5 mb-4">

                <h2 className="font-bold text-lg mb-5">
                    Objetivos
                </h2>


                <label className="block text-sm text-gray-500 mb-2">
                    Presupuesto semanal de calorías
                </label>


                <input
                    type="number"
                    inputMode="numeric"
                    value={
                        local.caloriesWeekly
                    }
                    onChange={e =>
                        setLocal({
                            ...local,
                            caloriesWeekly:
                                e.target.value
                        })
                    }
                    className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold mb-5"
                />


                <label className="block text-sm text-gray-500 mb-2">
                    Objetivo diario de proteína
                </label>


                <input
                    type="number"
                    inputMode="numeric"
                    value={
                        local.proteinDaily
                    }
                    onChange={e =>
                        setLocal({
                            ...local,
                            proteinDaily:
                                e.target.value
                        })
                    }
                    className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold"
                />

            </section>


            {/* FUNCIONAMIENTO */}

            <section className="card p-5 mb-4">

                <h2 className="font-bold text-lg">
                    Cómo funciona
                </h2>


                <p className="text-sm text-gray-500 leading-6 mt-3">

                    Tu presupuesto de calorías es semanal.
                    No tienes un límite diario fijo.

                </p>


                <p className="text-sm text-gray-500 leading-6 mt-2">

                    Cada día, las calorías que quedan de la
                    semana se redistribuyen automáticamente
                    entre los días restantes.

                </p>


                <div className="bg-green/10 rounded-2xl p-4 mt-4 text-sm">

                    <div className="font-bold green mb-2">
                        Ejemplo
                    </div>


                    <div className="text-gray-600 leading-6">

                        Presupuesto semanal:
                        <strong>
                            {" 16.590 kcal"}
                        </strong>

                        <br />

                        Lunes consume:
                        <strong>
                            {" 2.600 kcal"}
                        </strong>

                        <br />

                        Quedan:
                        <strong>
                            {" 13.990 kcal"}
                        </strong>

                        <br />

                        Martes recibe:
                        <strong>
                            {" 2.331 kcal"}
                        </strong>

                        <br /><br />

                        Si el martes consumes menos,
                        el presupuesto de miércoles
                        aumenta automáticamente.

                    </div>

                </div>

            </section>


            {/* BACKUP */}

            <section className="card p-5 mb-4">

                <h2 className="font-bold text-lg">
                    Backup
                </h2>


                <p className="text-sm text-gray-500 leading-6 mt-2 mb-5">

                    Guarda una copia de tus registros y
                    configuración para poder restaurarlos
                    posteriormente.

                </p>


                <button
                    onClick={
                        saveBackup
                    }
                    className="backup-button w-full bg-green text-white py-4 rounded-2xl font-bold mb-3"
                >
                    ↓ Guardar backup
                </button>


                <label className="backup-button w-full bg-gray-100 text-gray-700 py-4 rounded-2xl font-bold flex items-center justify-center cursor-pointer">

                    ↑ Cargar backup

                    <input
                        type="file"
                        accept=".json,application/json"
                        onChange={
                            loadBackup
                        }
                        className="hidden"
                    />

                </label>

            </section>


            <button
                onClick={save}
                className="w-full bg-green text-white py-4 rounded-2xl font-bold text-lg mb-4"
            >
                Guardar configuración
            </button>


            <button
                onClick={resetAll}
                className="w-full bg-white text-red-500 border border-red-100 py-4 rounded-2xl font-semibold"
            >
                Borrar registros
            </button>

        </main>
    );
}


/* =========================================================
   MODAL AÑADIR
========================================================= */

function AddModal({

    date,
    onClose,
    onSave

}) {

    const [name, setName] =
        useState("");

    const [calories, setCalories] =
        useState("");

    const [protein, setProtein] =
        useState("");


    function submit(e) {

        e.preventDefault();


        if (!name.trim()) {

            alert(
                "Introduce el nombre del alimento."
            );

            return;
        }


        if (
            calories === "" ||
            Number(calories) < 0
        ) {

            alert(
                "Introduce las calorías."
            );

            return;
        }


        if (
            protein !== "" &&
            Number(protein) < 0
        ) {

            alert(
                "La proteína no puede ser negativa."
            );

            return;
        }


        onSave({

            name:
                name.trim(),

            calories:
                Number(calories),

            protein:
                Number(protein || 0)

        });
    }


    return (

        <div className="fixed inset-0 z-50 modal-backdrop flex items-end justify-center">

            <div className="bg-white w-full max-w-[480px] rounded-t-[30px] p-6">

                <div className="flex justify-between items-center mb-6">

                    <div>

                        <div className="text-sm text-gray-500">

                            {formatDate(
                                new Date(
                                    date +
                                    "T00:00:00"
                                )
                            )}

                        </div>


                        <h2 className="text-2xl font-extrabold">
                            Añadir comida
                        </h2>

                    </div>


                    <button
                        onClick={
                            onClose
                        }
                        className="w-10 h-10 rounded-full bg-gray-100 text-xl"
                    >
                        ×
                    </button>

                </div>


                <form
                    onSubmit={
                        submit
                    }
                    className="space-y-4"
                >

                    <div>

                        <label className="block text-sm text-gray-500 mb-2">
                            Alimento / comida
                        </label>


                        <input
                            autoFocus
                            value={
                                name
                            }
                            onChange={e =>
                                setName(
                                    e.target.value
                                )
                            }
                            placeholder="Ej. Pechuga de pollo"
                            className="w-full border border-gray-200 rounded-2xl px-4 py-4"
                        />

                    </div>


                    <div>

                        <label className="block text-sm text-gray-500 mb-2">
                            Calorías
                        </label>


                        <input
                            type="number"
                            inputMode="decimal"
                            min="0"
                            value={
                                calories
                            }
                            onChange={e =>
                                setCalories(
                                    e.target.value
                                )
                            }
                            placeholder="500"
                            className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold"
                        />

                    </div>


                    <div>

                        <label className="block text-sm text-gray-500 mb-2">
                            Proteína (g)
                        </label>


                        <input
                            type="number"
                            inputMode="decimal"
                            min="0"
                            value={
                                protein
                            }
                            onChange={e =>
                                setProtein(
                                    e.target.value
                                )
                            }
                            placeholder="40"
                            className="w-full border border-gray-200 rounded-2xl px-4 py-4 text-lg font-semibold"
                        />

                    </div>


                    <button
                        type="submit"
                        className="w-full bg-green text-white py-4 rounded-2xl font-bold text-lg mt-3"
                    >
                        Añadir
                    </button>

                </form>

            </div>

        </div>
    );
}
