<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Mi Presupuesto</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #f7faf8;
            color: #14221b;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            max-width: 480px;
            min-height: 100vh;
            margin: auto;
            background: #f7faf8;
            position: relative;
        }

        .green {
            color: #20a35a;
        }

        .bg-green {
            background: #20a35a;
        }

        .progress-track {
            background: #e3eae5;
        }

        .progress-green {
            background: #20a35a;
        }

        .progress-red {
            background: #e91e4d;
        }

        .card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, .42);
            backdrop-filter: blur(3px);
        }

        .safe-bottom {
            padding-bottom: calc(115px + env(safe-area-inset-bottom));
        }

        .nav-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #20a35a;
            box-shadow: 0 0 0 3px rgba(32, 163, 90, .12);
        }

        .day-row {
            transition: transform .15s ease, opacity .2s ease;
        }

        .day-row:active {
            transform: scale(.99);
        }

        .past-day {
            opacity: .60;
            background: #edf1ed;
            box-shadow: none !important;
            padding: 12px 16px !important;
            border: 1px solid #dce4de;
        }

        .today-day {
            box-shadow:
                0 0 0 2px rgba(32, 163, 90, .16),
                0 2px 8px rgba(0, 0, 0, .08);
        }

        .backup-button {
            transition: transform .15s ease, background .15s ease;
        }

        .backup-button:active {
            transform: scale(.98);
        }

        /* =====================================================
           CÍRCULO DE AGUA (CON EFECTO FÍSICO DE INCLINACIÓN)
        ===================================================== */
        .water-circle {
            position: relative;
            overflow: hidden;
            border-radius: 50%;
            background: #f1f5f2;
            box-shadow:
                inset 0 0 0 8px #e4eae6,
                0 2px 8px rgba(0, 0, 0, .05);
            transform: perspective(300px);
            will-change: transform;
        }

        .water-fill {
            position: absolute;
            left: -15%;
            width: 130%;
            bottom: 0;
            background: #20a35a;
            transition: height .7s cubic-bezier(.22, .61, .36, 1), transform 0.1s ease-out;
            will-change: transform, height;
        }

        .water-wave {
            position: absolute;
            left: -20%;
            width: 140%;
            height: 32px;
            top: -15px;
            border-radius: 50%;
            background: rgba(255,255,255,.28);
            animation: waveMove 3.2s linear infinite;
        }

        .water-wave-2 {
            position: absolute;
            left: -20%;
            width: 140%;
            height: 28px;
            top: -11px;
            border-radius: 50%;
            background: rgba(255,255,255,.16);
            animation: waveMoveReverse 4.5s linear infinite;
        }

        .water-shimmer {
            position: absolute;
            left: -50%;
            width: 200%;
            height: 70%;
            top: 15%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.10),
                transparent
            );
            transform: rotate(-15deg);
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes waveMove {
            from { transform: translateX(0); }
            to { transform: translateX(-12%); }
        }

        @keyframes waveMoveReverse {
            from { transform: translateX(-8%); }
            to { transform: translateX(8%); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-30%) rotate(-15deg); }
            50% { transform: translateX(30%) rotate(-15deg); }
            100% { transform: translateX(-30%) rotate(-15deg); }
        }

        .water-content {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .water-number {
            font-size: 25px;
            font-weight: 800;
            line-height: 1.1;
        }

        .water-max {
            font-size: 14px;
            color: #6b7280;
            margin-top: 3px;
        }

        .water-label {
            font-size: 14px;
            color: #6b7280;
            margin-top: 6px;
        }

        .history-chart {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .chart-grid-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px dashed #dfe6e1;
        }

        .chart-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .chart-scroll::-webkit-scrollbar {
            display: none;
        }

        .chart-inner {
            min-width: 100%;
        }

        .bar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-width: 48px;
            height: 230px;
        }

        .bar-area {
            position: relative;
            width: 100%;
            height: 185px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .consumption-bar {
            width: 27px;
            min-height: 2px;
            background: #20a35a;
            border-radius: 8px 8px 3px 3px;
            transition: height .4s ease;
            z-index: 3;
        }

        .chart-label {
            font-size: 10px;
            color: #6b7280;
            margin-top: 8px;
            white-space: nowrap;
        }

        .chart-value {
            font-size: 9px;
            color: #6b7280;
            margin-bottom: 3px;
            white-space: nowrap;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }

        .legend-green { background: #20a35a; }
        .legend-red { background: #e91e4d; }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #ccc; 
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

const DEFAULT_SETTINGS = {
    caloriesWeekly: 16590,
    proteinWeekly: 1190,
    stepsWeekly: 70000,
    name: "Mi plan",
    strictWindowsEnabled: false,
    breakfastStart: "07:00",
    breakfastEnd: "11:00",
    lunchStart: "12:30",
    lunchEnd: "16:00",
    dinnerStart: "19:30",
    dinnerEnd: "22:30"
};

const DAYS = [
    "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"
];

const MEAL_TYPES = [
    "Desayuno", "Almuerzo", "Cena"
];

function getMonday(date = new Date()) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
}

function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

function formatDate(date) {
    return date.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function formatWeekDate(date) {
    return date.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit" });
}

function getWeekDates(referenceDate = new Date()) {
    const monday = getMonday(referenceDate);
    const dates = [];
    for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        dates.push(d);
    }
    return dates;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function loadJSON(key, fallback) {
    try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
    } catch {
        return fallback;
    }
}

function isPastDate(key) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const date = new Date(key + "T00:00:00");
    return date < today;
}

function formatShortDate(key) {
    const date = new Date(key + "T00:00:00");
    return date.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit" });
}

function timeStringToMinutes(timeStr) {
    if (!timeStr) return 0;
    const [h, m] = timeStr.split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
}

function isCurrentTimeInRange(startStr, endStr) {
    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const startMinutes = timeStringToMinutes(startStr);
    const endMinutes = timeStringToMinutes(endStr);
    return currentMinutes >= startMinutes && currentMinutes <= endMinutes;
}

function CustomDialog({ config, onClose }) {
    if (!config.show) return null;

    return (
        <div className="fixed inset-0 z-[100] modal-backdrop flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-6 w-full max-w-[320px] shadow-2xl animate-[fadeIn_0.2s_ease-out]">
                {config.title && (
                    <h3 className="text-xl font-extrabold mb-2 text-gray-800">{config.title}</h3>
                )}
                <p className="text-gray-600 text-sm mb-6 leading-relaxed">
                    {config.message}
                </p>
                
                <div className="flex gap-3 justify-end">
                    {!config.isAlert && (
                        <button 
                            onClick={onClose}
                            className="px-5 py-2.5 rounded-xl text-gray-600 font-semibold bg-gray-100 hover:bg-gray-200 transition-colors"
                        >
                            Cancelar
                        </button>
                    )}
                    <button 
                        onClick={() => {
                            if (config.onConfirm) config.onConfirm();
                            onClose();
                        }}
                        className="px-5 py-2.5 rounded-xl text-white font-semibold bg-green hover:bg-green/90 transition-colors shadow-sm"
                    >
                        {config.isAlert ? 'Entendido' : 'Confirmar'}
                    </button>
                </div>
            </div>
        </div>
    );
}

function App() {
    const [activeTab, setActiveTab] = useState("home");
    
    const [dialogConfig, setDialogConfig] = useState({
        show: false, title: "", message: "", isAlert: true, onConfirm: null
    });

    const showAlert = (title, message) => {
        setDialogConfig({ show: true, title, message, isAlert: true, onConfirm: null });
    };

    const showConfirm = (title, message, onConfirm) => {
        setDialogConfig({ show: true, title, message, isAlert: false, onConfirm });
    };

    const closeDialog = () => setDialogConfig(prev => ({ ...prev, show: false }));

    const [settings, setSettings] = useState(() => loadJSON("nutrition_settings", DEFAULT_SETTINGS));
    const [entries, setEntries] = useState(() => {
        const raw = loadJSON("nutrition_entries", []);
        const cleanMap = new Map();
        raw.forEach(e => {
            if (e && e.date && e.name && e.calories !== undefined) {
                const uniqueKey = e.id ? String(e.id) : `${e.date}_${e.name}_${Math.random()}`;
                cleanMap.set(uniqueKey, {
                    id: e.id || Date.now() + Math.random(),
                    date: String(e.date),
                    name: String(e.name),
                    calories: Number(e.calories) || 0,
                    protein: Number(e.protein) || 0,
                    mealType: String(e.mealType || "Desayuno")
                });
            }
        });
        return Array.from(cleanMap.values());
    });
    const [savedFoods, setSavedFoods] = useState(() => loadJSON("nutrition_saved_foods", []));
    const [stepsData, setStepsData] = useState(() => loadJSON("nutrition_steps", {}));
    
    const [showAdd, setShowAdd] = useState(false);
    const [selectedDate, setSelectedDate] = useState(dateKey(new Date()));
    const [selectedMealType, setSelectedMealType] = useState("Desayuno");
    const [editingEntry, setEditingEntry] = useState(null);
    const [editingFood, setEditingFood] = useState(null);

    const [currentWeekReference, setCurrentWeekReference] = useState(new Date());

    useEffect(() => {
        localStorage.setItem("nutrition_settings", JSON.stringify(settings));
    }, [settings]);

    useEffect(() => {
        localStorage.setItem("nutrition_entries", JSON.stringify(entries));
    }, [entries]);

    useEffect(() => {
        localStorage.setItem("nutrition_saved_foods", JSON.stringify(savedFoods));
    }, [savedFoods]);

    useEffect(() => {
        localStorage.setItem("nutrition_steps", JSON.stringify(stepsData));
    }, [stepsData]);

    const weekDates = getWeekDates(currentWeekReference);
    const weekKeys = weekDates.map(dateKey);
    const todayKey = dateKey(new Date());

    function getDayEntries(key) {
        return entries.filter(e => e.date === key);
    }

    function getDayCalories(key) {
        return getDayEntries(key).reduce((sum, e) => sum + Number(e.calories || 0), 0);
    }

    function getDayProtein(key) {
        return getDayEntries(key).reduce((sum, e) => sum + Number(e.protein || 0), 0);
    }

    function getDaySteps(key) {
        return Number(stepsData[key] || 0);
    }

    function setDaySteps(key, val) {
        setStepsData(prev => ({ ...prev, [key]: Math.max(0, Number(val) || 0) }));
    }

    const weeklyCaloriesConsumed = weekKeys.reduce((sum, key) => sum + getDayCalories(key), 0);
    const weeklyProteinConsumed = weekKeys.reduce((sum, key) => sum + getDayProtein(key), 0);
    const weeklyStepsConsumed = weekKeys.reduce((sum, key) => sum + getDaySteps(key), 0);

    const weeklyCaloriesRemaining = Math.max(0, Number(settings.caloriesWeekly || 0) - weeklyCaloriesConsumed);
    const weeklyProteinRemaining = Math.max(0, Number(settings.proteinWeekly || 0) - weeklyProteinConsumed);
    const weeklyStepsRemaining = Math.max(0, Number(settings.stepsWeekly || 0) - weeklyStepsConsumed);

    function getDynamicDailyBudget(index, totalWeeklyTarget, getConsumedFn) {
        let remainingBudget = Number(totalWeeklyTarget || 0);
        for (let i = 0; i < index; i++) {
            remainingBudget -= getConsumedFn(weekKeys[i]);
        }
        const remainingDays = 7 - index;
        if (remainingDays <= 0) return 0;
        return Math.max(0, remainingBudget / remainingDays);
    }

    const todayIndex = weekKeys.indexOf(todayKey);
    
    const todayBudget = todayIndex >= 0 ? getDynamicDailyBudget(todayIndex, settings.caloriesWeekly, getDayCalories) : Number(settings.caloriesWeekly || 0) / 7;
    const todayCalories = getDayCalories(todayKey);
    const todayRemaining = Math.max(0, todayBudget - todayCalories);

    const todayProteinBudget = todayIndex >= 0 ? getDynamicDailyBudget(todayIndex, settings.proteinWeekly, getDayProtein) : Number(settings.proteinWeekly || 0) / 7;
    const todayProtein = getDayProtein(todayKey);

    const todayStepsBudget = todayIndex >= 0 ? getDynamicDailyBudget(todayIndex, settings.stepsWeekly, getDaySteps) : Number(settings.stepsWeekly || 0) / 7;
    const todaySteps = getDaySteps(todayKey);

    function saveEntry(data) {
        if (settings.strictWindowsEnabled && selectedDate === todayKey && !editingEntry) {
            let start = settings.breakfastStart;
            let end = settings.breakfastEnd;
            if (data.mealType === "Almuerzo") { start = settings.lunchStart; end = settings.lunchEnd; }
            if (data.mealType === "Cena") { start = settings.dinnerStart; end = settings.dinnerEnd; }

            if (!isCurrentTimeInRange(start, end)) {
                showConfirm(
                    "Fuera de horario permitido",
                    `Estás intentando registrar ${data.mealType} fuera de su franja horaria recomendada (${start} - ${end}). ¿Deseas saltarte la restricción de horario y registrarlo de todas formas?`,
                    () => proceedSaveEntry(data)
                );
                return;
            }
        }

        proceedSaveEntry(data);
    }

    function proceedSaveEntry(data) {
        if (editingEntry) {
            setEntries(prev => prev.map(e => e.id === editingEntry.id ? {
                ...e,
                name: data.name.trim(),
                calories: Number(data.calories),
                protein: Number(data.protein),
                mealType: data.mealType
            } : e));
        } else {
            setEntries(prev => [
                ...prev,
                {
                    id: Date.now() + Math.random(),
                    date: selectedDate,
                    name: data.name.trim(),
                    calories: Number(data.calories),
                    protein: Number(data.protein),
                    mealType: data.mealType
                }
            ]);
        }

        const nameLower = data.name.trim().toLowerCase();
        const existsInLibrary = savedFoods.some(f => f.name.toLowerCase() === nameLower);
        
        if (!existsInLibrary) {
            setSavedFoods(prev => [...prev, {
                id: Date.now() + Math.random(),
                name: data.name.trim(),
                calories: Number(data.calories),
                protein: Number(data.protein || 0)
            }]);
        }

        setShowAdd(false);
        setEditingEntry(null);
    }

    function deleteEntry(id) {
        setEntries(prev => prev.filter(entry => entry.id !== id));
    }

    function deleteSavedFood(id) {
        setSavedFoods(prev => prev.filter(food => food.id !== id));
    }

    function updateSavedFood(updatedFood) {
        setSavedFoods(prev => prev.map(f => f.id === updatedFood.id ? updatedFood : f));
        setEditingFood(null);
    }

    function resetAll() {
        showConfirm(
            "Borrar Registros", 
            "¿Seguro que quieres borrar todos los registros de consumo y pasos? Esta acción no se puede deshacer.",
            () => {
                setEntries([]);
                setStepsData({});
                localStorage.removeItem("nutrition_entries");
                localStorage.removeItem("nutrition_steps");
                showAlert("Éxito", "Registros borrados correctamente.");
            }
        );
    }

    function saveBackup() {
        const backup = {
            app: "Mi Presupuesto",
            version: 13,
            exportedAt: new Date().toISOString(),
            settings: settings,
            entries: entries,
            savedFoods: savedFoods,
            steps: stepsData
        };

        const json = JSON.stringify(backup, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        const today = new Date().toISOString().slice(0, 10);
        link.download = `backup-nutricion-${today}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function loadBackup(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const backup = JSON.parse(e.target.result);
                if (!backup || !backup.settings || !Array.isArray(backup.entries)) {
                    throw new Error("Formato inválido");
                }

                showConfirm(
                    "Cargar Backup",
                    "Cargar este backup reemplazará tus datos actuales. ¿Quieres continuar?",
                    () => {
                        const importedSettings = {
                            ...DEFAULT_SETTINGS,
                            ...backup.settings,
                            caloriesWeekly: Number(backup.settings.caloriesWeekly) || 16590,
                            proteinWeekly: Number(backup.settings.proteinWeekly) || 1190,
                            stepsWeekly: Number(backup.settings.stepsWeekly) || 70000
                        };

                        const importedEntries = backup.entries
                            .filter(entry => entry && entry.date && entry.name)
                            .map(entry => ({
                                id: entry.id || Date.now() + Math.random(),
                                date: String(entry.date),
                                name: String(entry.name),
                                calories: Number(entry.calories) || 0,
                                protein: Number(entry.protein) || 0,
                                mealType: String(entry.mealType || "Desayuno")
                            }));
                        
                        const importedSavedFoods = Array.isArray(backup.savedFoods) ? backup.savedFoods : [];
                        const importedSteps = backup.steps && typeof backup.steps === 'object' ? backup.steps : {};

                        setSettings(importedSettings);
                        setEntries(importedEntries);
                        setSavedFoods(importedSavedFoods);
                        setStepsData(importedSteps);

                        showAlert("Backup Restaurado", "Los datos se han cargado correctamente.");
                    }
                );
            } catch {
                showAlert("Error", "No se pudo cargar el backup. El archivo no tiene un formato válido.");
            }
            event.target.value = "";
        };
        reader.readAsText(file);
    }

    return (
        <div className="app">
            <CustomDialog config={dialogConfig} onClose={closeDialog} />

            {activeTab === "home" && (
                <Home
                    settings={settings}
                    weekDates={weekDates}
                    weekKeys={weekKeys}
                    todayKey={todayKey}
                    todayBudget={todayBudget}
                    todayCalories={todayCalories}
                    todayProtein={todayProtein}
                    todayProteinBudget={todayProteinBudget}
                    todaySteps={todaySteps}
                    todayStepsBudget={todayStepsBudget}
                    todayRemaining={todayRemaining}
                    weeklyCaloriesConsumed={weeklyCaloriesConsumed}
                    weeklyCaloriesRemaining={weeklyCaloriesRemaining}
                    weeklyProteinConsumed={weeklyProteinConsumed}
                    weeklyProteinRemaining={weeklyProteinRemaining}
                    weeklyStepsConsumed={weeklyStepsConsumed}
                    weeklyStepsRemaining={weeklyStepsRemaining}
                    getDayCalories={getDayCalories}
                    getDayProtein={getDayProtein}
                    getDaySteps={getDaySteps}
                    setDaySteps={setDaySteps}
                    getDynamicDailyBudget={getDynamicDailyBudget}
                    currentWeekReference={currentWeekReference}
                    setCurrentWeekReference={setCurrentWeekReference}
                    onAdd={(targetDate, mealType = "Desayuno") => { 
                        setSelectedDate(targetDate || todayKey); 
                        setSelectedMealType(mealType);
                        setEditingEntry(null); 
                        setShowAdd(true); 
                    }}
                    onSelectDay={key => { setSelectedDate(key); setSelectedMealType("Desayuno"); setEditingEntry(null); setShowAdd(true); }}
                    onEdit={entry => { setEditingEntry(entry); setSelectedDate(entry.date); setSelectedMealType(entry.mealType || "Desayuno"); setShowAdd(true); }}
                    entries={entries}
                    onDelete={deleteEntry}
                />
            )}

            {activeTab === "history" && (
                <History
                    entries={entries}
                    settings={settings}
                    stepsData={stepsData}
                    getDayCalories={getDayCalories}
                    getDayProtein={getDayProtein}
                    getDaySteps={getDaySteps}
                    getDynamicDailyBudget={getDynamicDailyBudget}
                    onSelectDay={key => { setSelectedDate(key); setSelectedMealType("Desayuno"); setShowAdd(true); }}
                />
            )}
            
            {activeTab === "foods" && (
                <FoodLibrary 
                    savedFoods={savedFoods}
                    onDelete={deleteSavedFood}
                    onEdit={food => setEditingFood(food)}
                />
            )}

            {activeTab === "settings" && (
                <Settings
                    settings={settings}
                    setSettings={setSettings}
                    resetAll={resetAll}
                    saveBackup={saveBackup}
                    loadBackup={loadBackup}
                    showAlert={showAlert}
                />
            )}

function AddModal({ date, initialMealType, onClose, onSave, savedFoods, showAlert, initialData, settings }) {
    const [name, setName] = useState(initialData ? initialData.name : "");
    const [calories, setCalories] = useState(initialData ? initialData.calories.toString() : "");
    const [protein, setProtein] = useState(initialData ? initialData.protein.toString() : "");
    const [mealType, setMealType] = useState(initialData ? initialData.mealType : initialMealType);
    const [showSuggestions, setShowSuggestions] = useState(false);

    const filteredFoods = name.trim() === "" 
        ? [] 
        : savedFoods.filter(f => f.name.toLowerCase().includes(name.toLowerCase()));

    const exactMatch = filteredFoods.length === 1 && filteredFoods[0].name.toLowerCase() === name.toLowerCase();
    const displaySuggestions = showSuggestions && filteredFoods.length > 0 && !exactMatch;

    function submit(e) {
        e.preventDefault();

        if (!name.trim()) {
            showAlert("Faltan datos", "Por favor, introduce el nombre del alimento.");
            return;
        }

        if (calories === "" || Number(calories) < 0) {
            showAlert("Faltan datos", "Por favor, introduce las calorías correctamente.");
            return;
        }

        if (protein !== "" && Number(protein) < 0) {
            showAlert("Dato incorrecto", "La proteína no puede ser un valor negativo.");
            return;
        }

        if (settings.strictWindowsEnabled && date === dateKey(new Date()) && !initialData) {
            let start = settings.breakfastStart;
            let end = settings.breakfastEnd;
            if (mealType === "Almuerzo") { start = settings.lunchStart; end = settings.lunchEnd; }
            if (mealType === "Cena") { start = settings.dinnerStart; end = settings.dinnerEnd; }

            if (!isCurrentTimeInRange(start, end)) {
                showAlert("Fuera de horario permitido", `Estás intentando registrar ${mealType} fuera de su franja horaria recomendada (${start} - ${end}).`);
                return;
            }
        }

        onSave({
            name: name.trim(),
            calories: Number(calories),
            protein: Number(protein || 0),
            mealType: mealType
        });
    }

    function selectFood(food) {
        setName(food.name);
        setCalories(food.calories.toString());
        setProtein(food.protein.toString());
        setShowSuggestions(false);
    }

    return (
        <div className="fixed inset-0 z-[60] modal-backdrop flex items-end justify-center animate-[fadeIn_0.2s_ease-out]">
            <div className="bg-white w-full max-w-[480px] rounded-t-[32px] p-6 shadow-2xl relative flex flex-col max-h-[90vh]">
                <div className="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 absolute top-3 left-1/2 -translate-x-1/2"></div>
                
                <div className="flex justify-between items-center mb-6 mt-2">
                    <div>
                        <div className="text-xs font-semibold text-green uppercase tracking-wide mb-1">
                            {formatDate(new Date(date + "T00:00:00"))}
                        </div>
                        <h2 className="text-2xl font-extrabold text-gray-800">
                            {initialData ? "Editar alimento" : `Añadir a ${mealType}`}
                        </h2>
                    </div>
                    <button onClick={onClose} className="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>

                <form onSubmit={submit} className="flex flex-col gap-5 overflow-y-auto custom-scrollbar pb-4">
                    <div>
                        <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Momento del día</label>
                        <select
                            value={mealType}
                            onChange={e => setMealType(e.target.value)}
                            className="w-full border-2 border-gray-100 bg-gray-50 rounded-2xl px-4 py-3.5 text-gray-800 font-medium focus:bg-white transition-colors"
                        >
                            {MEAL_TYPES.map(meal => (
                                <option key={meal} value={meal}>
                                    {meal}
                                </option>
                            ))}
                        </select>
                    </div>

                    <div className="relative">
                        <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Alimento / comida</label>
                        <input
                            autoFocus
                            value={name}
                            onChange={e => setName(e.target.value)}
                            onFocus={() => setShowSuggestions(true)}
                            onBlur={() => setTimeout(() => setShowSuggestions(false), 200)}
                            placeholder="Ej. Pechuga de pollo"
                            className="w-full border-2 border-gray-100 bg-gray-50 rounded-2xl px-4 py-4 text-gray-800 font-medium focus:bg-white transition-colors"
                            autoComplete="off"
                        />
                        
                        {displaySuggestions && (
                            <div className="absolute top-full left-0 right-0 mt-2 bg-white border border-gray-100 shadow-[0_10px_25px_rgba(0,0,0,0.1)] rounded-2xl z-50 max-h-56 overflow-y-auto custom-scrollbar overflow-hidden">
                                <div className="text-xs font-semibold text-gray-400 px-4 py-2 bg-gray-50/80 border-b border-gray-100">Alimentos guardados</div>
                                {filteredFoods.map(f => (
                                    <div 
                                        key={f.id} 
                                        onClick={() => selectFood(f)} 
                                        className="p-3.5 border-b border-gray-50 last:border-0 hover:bg-green/5 active:bg-green/10 cursor-pointer flex justify-between items-center transition-colors"
                                    >
                                        <div className="font-bold text-sm text-gray-700">{f.name}</div>
                                        <div className="flex gap-2">
                                            <span className="text-[11px] font-semibold text-green bg-green/10 px-2 py-1 rounded-md">{f.calories} kcal</span>
                                            <span className="text-[11px] font-semibold text-blue-600 bg-blue-50 px-2 py-1 rounded-md">{f.protein}g</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Calorías</label>
                            <div className="relative">
                                <input
                                    type="number"
                                    inputMode="decimal"
                                    min="0"
                                    value={calories}
                                    onChange={e => setCalories(e.target.value)}
                                    placeholder="0"
                                    className="w-full border-2 border-gray-100 bg-gray-50 rounded-2xl pl-4 pr-12 py-4 text-xl font-extrabold text-gray-800 focus:bg-white transition-colors"
                                />
                                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-semibold text-gray-400">kcal</span>
                            </div>
                        </div>

                        <div>
                            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Proteína</label>
                            <div className="relative">
                                <input
                                    type="number"
                                    inputMode="decimal"
                                    min="0"
                                    value={protein}
                                    onChange={e => setProtein(e.target.value)}
                                    placeholder="0"
                                    className="w-full border-2 border-gray-100 bg-gray-50 rounded-2xl pl-4 pr-8 py-4 text-xl font-extrabold text-gray-800 focus:bg-white transition-colors"
                                />
                                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-semibold text-gray-400">g</span>
                            </div>
                        </div>
                    </div>

                    <button
                        type="submit"
                        className="w-full bg-green text-white py-4 rounded-2xl font-bold text-lg mt-4 shadow-lg shadow-green/20 hover:bg-green/90 active:scale-[0.98] transition-all"
                    >
                        {initialData ? "Guardar cambios" : "Añadir al día"}
                    </button>
                </form>
            </div>
        </div>
    );
}

function ProgressCircle({ value, max, size, label }) {
    const [tiltX, setTiltX] = useState(0);
    const [tiltY, setTiltY] = useState(0);

    useEffect(() => {
        function handleOrientation(e) {
            if (e.gamma !== null && e.beta !== null) {
                const x = clamp(e.gamma, -30, 30);
                const y = clamp(e.beta, -30, 30);
                setTiltX(x * 0.4);
                setTiltY(y * 0.4);
            }
        }

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', handleOrientation, true);
        }

        return () => {
            if (window.DeviceOrientationEvent) {
                window.removeEventListener('deviceorientation', handleOrientation, true);
            }
        };
    }, []);

    const percent = max > 0 ? clamp(value / max, 0, 1) : 0;
    const percentage = percent * 100;

    return (
        <div 
            className="water-circle flex-shrink-0" 
            style={{ 
                width: size, 
                height: size,
                transform: `perspective(300px) rotateX(${-tiltY}deg) rotateY(${tiltX}deg)`
            }}
        >
            <div 
                className="water-fill" 
                style={{ 
                    height: `${percentage}%`,
                    transform: `translate(${-tiltX * 0.8}px, ${tiltY * 0.2}px) rotate(${tiltX * 0.5}deg)`
                }}
            >
                <div className="water-wave"></div>
                <div className="water-wave-2"></div>
                <div className="water-shimmer"></div>
            </div>
            <div className="water-content">
                <div className="water-number text-gray-800">{Math.round(value).toLocaleString("es-ES")}</div>
                <div className="water-max">/ {Math.round(max).toLocaleString("es-ES")}</div>
                <div className="water-label font-medium">{label}</div>
            </div>
        </div>
    );
}

function MiniProgress({ value, max, label, suffix, color }) {

    );
}

function History({ entries, settings, stepsData, getDayCalories, getDayProtein, getDaySteps, getDynamicDailyBudget, onSelectDay }) {
    const [period, setPeriod] = useState("week");
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    function getHistoryDates() {
        const dates = [];
        if (period === "week") {
            const monday = getMonday(today);
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                dates.push(d);
            }
        } else if (period === "month") {
            const start = new Date(today.getFullYear(), today.getMonth(), 1);
            const end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) dates.push(new Date(d));
        } else {
            if (entries.length === 0) return [];
            const sorted = [...entries].sort((a, b) => a.date.localeCompare(b.date));
            const start = new Date(sorted[0].date + "T00:00:00");
            for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) dates.push(new Date(d));
        }
        return dates;
    }

    const dates = getHistoryDates();
    const chartData = dates.map((date, index) => {
        const key = dateKey(date);
        const calories = getDayCalories(key);
        const budget = period === "week" ? getDynamicDailyBudget(index, settings.caloriesWeekly, getDayCalories) : Number(settings.caloriesWeekly || 0) / 7;
        return { date, key, calories, budget };
    });

    const totalCalories = chartData.reduce((sum, item) => sum + item.calories, 0);
    const totalProtein = chartData.reduce((sum, item) => sum + getDayProtein(item.key), 0);
    const totalSteps = chartData.reduce((sum, item) => sum + getDaySteps(item.key), 0);
    const daysWithData = chartData.filter(item => item.calories > 0 || getDaySteps(item.key) > 0).length;
    const averageCalories = daysWithData > 0 ? totalCalories / daysWithData : 0;
    
    const dailyBaseline = Number(settings.caloriesWeekly || 0) / 7;
    const maxChartValue = Math.max(...chartData.map(item => Math.max(item.calories, item.budget)), dailyBaseline, 1);
    const chartHeight = 185;
    const baselineHeight = (dailyBaseline / maxChartValue) * chartHeight;

    function periodTitle() {
        if (period === "week") return "Esta semana";
        if (period === "month") return today.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
        return "Todo el historial";
    }

    return (
        <main className="safe-bottom p-5">
            <header className="mb-5">
                <div className="text-sm font-semibold tracking-wide text-gray-400">HISTORIAL</div>
                <h1 className="text-3xl font-extrabold text-gray-800">Consumo y Actividad</h1>
            </header>

            <div className="card p-1.5 mb-5 flex gap-1 bg-white">
                {[["week", "Semana"], ["month", "Mes"], ["all", "Total"]].map(([value, label]) => (
                    <button
                        key={value}
                        onClick={() => setPeriod(value)}
                        className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all ${period === value ? "bg-green text-white shadow-md shadow-green/20" : "text-gray-400 hover:text-gray-600 hover:bg-gray-50"}`}
                    >
                        {label}
                    </button>
                ))}
            </div>

            <div className="grid grid-cols-2 gap-3 mb-3">
                <div className="card p-4 border border-gray-50 shadow-sm">
                    <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wide">Calorías</div>
                    <div className="text-xl font-extrabold mt-1 text-gray-800">{Math.round(totalCalories).toLocaleString("es-ES")}</div>
                    <div className="text-[11px] font-medium text-gray-400 mt-0.5">
                        {daysWithData > 0 ? `${Math.round(averageCalories).toLocaleString("es-ES")} kcal/día` : "Sin registros"}
                    </div>
                </div>
                <div className="card p-4 border border-gray-50 shadow-sm">
                    <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wide">Proteína</div>
                    <div className="text-xl font-extrabold mt-1 text-gray-800">{Math.round(totalProtein).toLocaleString("es-ES")} <span className="text-sm">g</span></div>
                    <div className="text-[11px] font-medium text-gray-400 mt-0.5">
                        {daysWithData > 0 ? `${Math.round(totalProtein / daysWithData)} g/día` : "Sin registros"}
                    </div>
                </div>
            </div>

            <div className="card p-4 mb-5 border border-gray-50 shadow-sm flex items-center justify-between">
                <div>
                    <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wide">Pasos Totales</div>
                    <div className="text-xl font-extrabold mt-1 text-gray-800">{totalSteps.toLocaleString("es-ES")}</div>
                </div>
                <div className="text-right">
                    <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wide">Promedio Diario</div>
                    <div className="text-xl font-extrabold mt-1 text-amber-600">{daysWithData > 0 ? Math.round(totalSteps / daysWithData).toLocaleString("es-ES") : 0}</div>
                </div>
            </div>

            <section className="card p-5 mb-5 border border-gray-50 shadow-sm">
                <div className="flex justify-between items-start mb-4">
                    <div>
                        <h2 className="font-bold text-lg text-gray-800 capitalize">{periodTitle()}</h2>
                        <p className="text-xs font-medium text-gray-400 mt-0.5">Consumo diario vs presupuesto objetivo</p>
                    </div>
                </div>

                <div className="flex items-center gap-4 mb-4 text-xs font-medium text-gray-500">
                    <div className="flex items-center gap-1.5"><span className="legend-dot legend-green"></span>Consumo</div>
                    <div className="flex items-center gap-1.5"><span className="legend-dot legend-red"></span>Límite Diario</div>
                </div>

                {chartData.length === 0 ? (
                    <div className="py-12 text-center text-gray-400 text-sm font-medium">Todavía no hay registros suficientes.</div>
                ) : (
                    <div className="chart-scroll">
                        <div className="chart-inner" style={{ minWidth: period === "month" ? "760px" : period === "all" ? `${Math.max(chartData.length * 48, 100)}px` : "100%" }}>
                            <div className="history-chart">
                                {[0, 25, 50, 75, 100].map(percentage => (
                                    <div key={percentage} className="chart-grid-line border-gray-100" style={{ top: `${100 - percentage}%` }} />
                                ))}
                                
                                <div className="relative flex items-end justify-between gap-1 px-1">
                                    <div 
                                        className="absolute left-0 right-0 border-t-[2px] border-dashed border-red-400 z-10 opacity-80 pointer-events-none" 
                                        style={{ bottom: `calc(45px + ${baselineHeight}px)` }}
                                    >
                                        <div className="absolute -top-[22px] right-0 text-[9px] font-extrabold text-red-500 bg-white/90 px-1.5 py-0.5 rounded shadow-sm">
                                            OBJETIVO {Math.round(dailyBaseline)}
                                        </div>
                                    </div>

                                    {chartData.map(item => {
                                        const consumptionHeight = item.calories / maxChartValue * chartHeight;
                                        const isOverBaseline = item.calories > dailyBaseline;

                                        return (
                                            <div key={item.key} className="bar-item flex-1 group relative">
                                                <div className="bar-area">
                                                    {item.calories > 0 && (
                                                        <div className="chart-value font-bold text-gray-700" style={{ position: "absolute", bottom: `${Math.min(consumptionHeight + 4, chartHeight - 10)}px` }}>
                                                            {Math.round(item.calories)}
                                                        </div>
                                                    )}
                                                    <div className={`consumption-bar ${isOverBaseline ? '!bg-red-400' : ''}`} style={{ height: `${Math.max(consumptionHeight, item.calories > 0 ? 4 : 0)}px` }} />
                                                </div>
                                                <div className="chart-label font-medium text-gray-400">
                                                    {period === "week" ? DAYS[item.date.getDay() === 0 ? 6 : item.date.getDay() - 1].slice(0, 2) : formatShortDate(item.key)}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                )}
            </section>
        </main>
    );
}

function Settings({ settings, setSettings, resetAll, saveBackup, loadBackup, showAlert }) {
    const [local, setLocal] = useState(settings);

    useEffect(() => setLocal(settings), [settings]);

    function save() {
        const calories = Number(local.caloriesWeekly);
        const protein = Number(local.proteinWeekly);
        const steps = Number(local.stepsWeekly);

        if (!Number.isFinite(calories) || calories <= 0) {
            showAlert("Error", "Introduce un presupuesto semanal de calorías válido.");
            return;
        }
        if (!Number.isFinite(protein) || protein < 0) {
            showAlert("Error", "Introduce un objetivo semanal de proteína válido.");
            return;
        }
        if (!Number.isFinite(steps) || steps < 0) {
            showAlert("Error", "Introduce un objetivo semanal de pasos válido.");
            return;
        }
        
        const updatedSettings = {
            ...local,
            caloriesWeekly: calories,
            proteinWeekly: protein,
            stepsWeekly: steps
        };
        
        setSettings(updatedSettings);
        showAlert("¡Listo!", "Tu configuración ha sido guardada correctamente.");
    }

    return (
        <main className="safe-bottom p-5">
            <header className="mb-6">
                <div className="text-sm font-semibold tracking-wide text-gray-400">AJUSTES</div>
                <h1 className="text-3xl font-extrabold text-gray-800">Mi plan</h1>

                    <input 
                        type="number" 
                        inputMode="numeric" 
                        value={local.caloriesWeekly} 
                        onChange={e => setLocal({ ...local, caloriesWeekly: e.target.value })} 
                        className="w-full border-2 border-gray-100 bg-gray-50 focus:bg-white rounded-2xl pl-4 pr-12 py-3.5 text-xl font-bold text-gray-800 transition-colors" 
                    />
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-medium text-gray-400">kcal</span>
                </div>

                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Objetivo semanal de proteína</label>
                <div className="relative mb-4">
                    <input 
                        type="number" 
                        inputMode="numeric" 
                        value={local.proteinWeekly} 
                        onChange={e => setLocal({ ...local, proteinWeekly: e.target.value })} 
                        className="w-full border-2 border-gray-100 bg-gray-50 focus:bg-white rounded-2xl pl-4 pr-8 py-3.5 text-xl font-bold text-gray-800 transition-colors" 
                    />
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-medium text-gray-400">g</span>
                </div>

                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Objetivo semanal de pasos</label>
                <div className="relative mb-4">
                    <input 
                        type="number" 
                        inputMode="numeric" 
                        value={local.stepsWeekly} 
                        onChange={e => setLocal({ ...local, stepsWeekly: e.target.value })}

                    />
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-medium text-gray-400">pasos</span>

            <section className="card p-5 mb-5 border border-gray-50 shadow-sm">
